name: Auslieferungslauf

# Eine Schrittfolge für beide Umgebungen: Was auf Produktiv läuft, ist vorher
# auf Staging gelaufen; nur zwei Schritte fragen nach der Umgebung.

on:
  workflow_call:
    inputs:
      umgebung:
        description: '`staging` oder `produktion` — bestimmt Umgebung, Adresse und Zielpfad.'
        required: true
        type: string
      probelauf:
        description: 'PROBELAUF — nichts ausliefern, nur den Weg messen (E-KH-08).'
        required: false
        type: boolean
        default: false
      probelauf_ohne_sitzung:
        description: 'Zielprobe ohne Wiederverwendung der TLS-Sitzung (Trennversuch F3).'
        required: false
        type: boolean
        default: false
      probelauf_mengenprobe:
        description: 'Mengenprobe statt der Rundlaeufe, 1–500 Verzeichnisse (leer = aus).'
        required: false
        type: string
        default: ''
      probelauf_sitzungsprobe:
        description: 'Sitzungsprobe statt der Rundlaeufe (Abruf, dann Steuerbefehl).'
        required: false
        type: boolean
        default: false
      probelauf_gespraech:
        description: 'GESPRAECHSLAUF — echt schreiben, aber in ein Probeverzeichnis, mit Mitschnitt.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # `actions: read` braucht das Tor der grünen Läufe; ohne es liest `gh api`
  # still eine leere Liste, und das Tor bleibt mit falschem Grund zu.
  actions: read

# `defaults` erbt ein aufgerufener Arbeitslauf nicht — ohne diese Zeile fehlt
# `pipefail`, und eine Pipe kann nicht mehr rot werden.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  ausliefern:
    # Heißt zusammengesetzt `staging / ausliefern` — genau so zählt ihn das Tor
    # der grünen Läufe unten; wer den Namen ändert, ändert es dort mit.
    name: ausliefern
    runs-on: ubuntu-latest
    # Zeigt dieser Ausdruck ins Leere, läuft der Job ohne Pflichtfreigabe — grün
    # und ungefragt; nach jeder Änderung mit einem Probelauf nachmessen.
    environment: ${{ inputs.umgebung }}
    # Nie abbrechen, auch auf Staging nicht: Ein halber Abgleich hinterlässt
    # eine Zustandsdatei, nach der der nächste Lauf Änderungen übersieht.
    concurrency:
      group: ausliefern-${{ inputs.umgebung }}
      cancel-in-progress: false
    env:
      JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
    steps:
      - name: Adresse, Zielpfad und Zustandsdatei dieser Umgebung bestimmen
        # `case` statt Ausdruck: `A && B || C` fällt auch bei leerem `B` auf
        # `C`, und Produktiv mäße bei leerer `PRODUKTION_URL` still Staging.
        # Kein Vorgabewert für eine fehlende Variable — er synchronisierte eine
        # falsch eingerichtete Anlage grün in ein fremdes Verzeichnis.
        env:
          UMGEBUNG:      ${{ inputs.umgebung }}
          PRODUKTION_URL: ${{ vars.PRODUKTION_URL }}
          STAGING_URL:    ${{ vars.STAGING_URL }}
          FTP_ZIELPFAD:   ${{ vars.FTP_ZIELPFAD }}
          FTP_STATE_PFAD: ${{ vars.FTP_STATE_PFAD }}
        run: |
          set -euo pipefail
          case "$UMGEBUNG" in
            produktion)
              basis="${PRODUKTION_URL:-}"
              basisname='PRODUKTION_URL' ;;
            staging)
              basis="${STAGING_URL:-}"
              basisname='STAGING_URL' ;;
            *)
              echo "::error::Unbekannte Umgebung '$UMGEBUNG'. Erlaubt sind genau 'staging' und 'produktion' — ein Tippfehler hier waere ein Job ohne Umgebung und damit ohne Freigabe."
              exit 1 ;;
          esac
          fehlt=""
          if [ -z "$basis" ]; then
            echo "::error::Die Variable $basisname der Umgebung $UMGEBUNG ist leer. Ohne sie fragen Backup-Tor, Wartung und Zielprobe ins Leere. Eintragen unter Settings -> Environments -> $UMGEBUNG -> Variables."
            fehlt="ja"
          fi
          if [ -z "${FTP_ZIELPFAD:-}" ]; then
            echo "::error::Die Variable FTP_ZIELPFAD der Umgebung $UMGEBUNG ist leer. Bis AP6 sprang hier ein Vorgabewert ein (Produktiv './httpdocs/', Staging './staging/') -- er ist absichtlich weg (E-KH-07), weil er eine falsch eingerichtete Anlage nicht auffallen liess. Eintragen unter Settings -> Environments -> $UMGEBUNG -> Variables."
            fehlt="ja"
          fi
          if [ -z "${FTP_STATE_PFAD:-}" ]; then
            echo "::error::Die Variable FTP_STATE_PFAD der Umgebung $UMGEBUNG ist leer. Vorgabewert war '../.deploy-state-produktion.json' bzw. '../.deploy-state-staging.json'; er ist weg (E-KH-07). ZWEI NAMEN, NICHT EINER -- teilen sich beide Umgebungen einen FTP-Zugang, ueberschrieben sie sonst einander die Zustandsdatei. Eintragen unter Settings -> Environments -> $UMGEBUNG -> Variables."
            fehlt="ja"
          fi
          if [ -n "$fehlt" ]; then
            echo "::error::Abbruch VOR jedem Zugriff auf den Server -- es ist nichts geschehen, was rueckgaengig zu machen waere."
            exit 1
          fi
          ziel="$FTP_ZIELPFAD"
          zustand="$FTP_STATE_PFAD"
          {
            echo "BASIS=$basis"
            echo "ZIELPFAD=$ziel"
            echo "ZUSTANDSPFAD=$zustand"
          } >> "$GITHUB_ENV"
          echo "Umgebung:      $UMGEBUNG"
          echo "Basisadresse:  $basis"
          echo "Zielpfad:      $ziel"
          echo "Zustandsdatei: $zustand"

      - name: PROBELAUF — was dieser Lauf NICHT tut
        if: ${{ inputs.probelauf }}
        run: |
          echo "::notice::PROBELAUF — es wird nichts ausgeliefert."
          {
            echo '## PROBELAUF — nichts ausgeliefert'
            echo
            echo 'Gemessen werden: die drei Geheimnisse, der Adressvergleich, die'
            echo '**Zielprobe** (Rundlauf FTPS → HTTPS → löschen) und der Abgleich'
            echo 'als **Trockenlauf**.'
            echo
            echo 'NICHT gefahren werden: Tag-Vergleich, Tor der grünen Läufe,'
            echo 'Backup-Tor, Wartungsmodus, `doku`-Kopie und die Migrationsabfrage.'
            echo 'Geschrieben wird nichts außer der Probedatei und der Zustandsdatei;'
            echo 'die Probedatei wird im selben Schritt wieder gelöscht, die'
            echo 'Zustandsdatei bleibt liegen und wird bei jedem weiteren Lauf'
            echo 'nur noch vorgefunden (AP4, E-KH-26).'
            echo
            echo '**Und der Job `staging` läuft gar nicht mit** — seit AP5. Vorher'
            echo 'tat er es, und er hat dabei wirklich nach Staging ausgeliefert'
            echo '(gemessen im Lauf 35547147256). Ein Probelauf liefert jetzt'
            echo 'nirgendwohin aus, auch nicht auf die Testanlage.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sind die drei Geheimnisse der Umgebung ${{ inputs.umgebung }} da?
        # Steht vor Backup und Wartung: Ein vertippter Name soll scheitern,
        # bevor die Anlage zu ist.
        # Die Namen gehören nur an die Umgebung: Steht derselbe eine Ebene
        # höher, greift still dessen Wert, und der Schritt geht immer auf.
        env:
          UMGEBUNG:     ${{ inputs.umgebung }}
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # `if`-Blöcke statt `[ … ] && …`: Unter `set -e` beendet eine solche
          # Kette als letzte Zeile den Schritt mit 1 — gerade wenn alles stimmt.
          fehlt=""
          if [ -z "${FTP_SERVER:-}" ];   then fehlt="$fehlt FTP_SERVER"; fi
          if [ -z "${FTP_USERNAME:-}" ]; then fehlt="$fehlt FTP_USERNAME"; fi
          if [ -z "${FTP_PASSWORD:-}" ]; then fehlt="$fehlt FTP_PASSWORD"; fi
          if [ -n "$fehlt" ]; then
            echo "::error::Umgebung $UMGEBUNG: es fehlt$fehlt. Sie gehoeren als ENVIRONMENT SECRETS an die Umgebung, nicht als Repositoriums- oder Organisationsgeheimnis."
            exit 1
          fi
          case "$FTP_SERVER" in
            *://*|*/*|*:*)
              echo "::error::FTP_SERVER traegt ein Schema, einen Pfad oder einen Port. Erwartet wird der blosse Hostname, z. B. ftp.example.de."
              exit 1 ;;
          esac
          echo "Drei Geheimnisse vorhanden; der Host sieht wie ein Hostname aus."

      - name: Tag gegen WEB_VERSION halten
        if: ${{ inputs.umgebung == 'produktion' && !inputs.probelauf }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ver=$(php -r "require 'server/version.php'; echo WEB_VERSION;")
          echo "Tag: $tag · WEB_VERSION: $ver"
          if [ "$tag" != "web-v$ver" ]; then
            echo "::error::Tag $tag passt nicht zu WEB_VERSION $ver (erwartet web-v$ver)."
            exit 1
          fi

      - name: Grüner Staging- und Stufe-1-Lauf auf diesem Stand?
        if: ${{ inputs.umgebung == 'produktion' && !inputs.probelauf }}
        # Gefragt wird nach dem Commit, nicht nach dem Zweig: Ein Tag kann auf
        # einem Stand sitzen, der nie auf `main` war.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${GITHUB_SHA}"
          echo "Commit: $sha"

          FENSTER=50
          baum=$(git rev-parse 'HEAD^{tree}' 2>/dev/null || true)
          echo "Baum des Tag-Commits: ${baum:-— nicht ermittelt —}"
          python3 tools/kette/baumsuche.py --baum "${baum:-}" --fenster "$FENSTER" --ausgabe stufe1.json

          vergleich=$(gh api "repos/${GITHUB_REPOSITORY}/compare/produktion...$sha" \
                       --jq '.status' 2>/dev/null || true)
          echo "Vergleich gegen den Zeiger \`produktion\`: ${vergleich:-— nicht ermittelt —}"

          laeufe=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/auslieferung.yml/runs?head_sha=$sha&status=success" \
                    --jq '[.workflow_runs[] | {id, event, head_branch}]' 2>/dev/null || echo '[]')

          # Gezählt wird der erfolgreiche Job, nicht der grüne Lauf, und auf
          # Gleichheit statt Namensanfang; wer `staging` oder `ausliefern`
          # umbenennt, ändert die Zeile mit, sonst zählt sie still null.
          echo "$laeufe" > roh.json
          : > zeilen.jsonl
          for lauf in $(jq -r '.[].id' roh.json); do
            ok=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$lauf/jobs" \
                  --jq '[.jobs[] | select(.name == "staging" or .name == "staging / ausliefern") | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
            if [ "${ok:-0}" -ge 1 ]; then flagge=true; else flagge=false; fi
            jq -c --argjson ok "$flagge" --argjson id "$lauf" \
               '.[] | select(.id == $id) | . + {staging_ok: $ok}' roh.json >> zeilen.jsonl
          done
          jq -s '.' zeilen.jsonl > laeufe.json
          echo "Zusammengetragen:"
          jq -c '.[]' laeufe.json

          python3 tools/kette/freigabe.py urteil \
            --laeufe laeufe.json \
            --vergleich "${vergleich:-}" \
            --baum "${baum:-}" \
            --stufe1-laeufe stufe1.json

      - name: Adressvergleich — meint die Kette dieselbe Anlage wie die Wache?
        if: ${{ inputs.umgebung == 'produktion' }}
        env:
          WACHE_BASIS: ${{ vars.WACHE_BASIS }}
        run: |
          set -euo pipefail
          if [ -z "${WACHE_BASIS:-}" ]; then
            echo "::error::Die Repositoriums-Variable WACHE_BASIS ist leer. Bis AP6 sprang in der Wache ein Vorgabewert ein; er ist weg (E-KH-07). Ohne sie kann niemand sagen, ob Kette und Wache dieselbe Anlage meinen. Eintragen unter Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          norm() { printf '%s' "$1" | sed 's:/*$::' | tr 'A-Z' 'a-z'; }
          a="$(norm "$BASIS")"
          b="$(norm "$WACHE_BASIS")"
          echo "Kette (PRODUKTION_URL): $a"
          echo "Wache (WACHE_BASIS):    $b"
          if [ "$a" != "$b" ]; then
            echo "::error::PRODUKTION_URL und WACHE_BASIS nennen verschiedene Anlagen. Die Kette lieferte nach '$a' aus, die Integritaetswache bewachte '$b' — beide Seiten waeren fuer sich gruen, und der Produktivserver bliebe unbeobachtet. Abbruch vor dem Backup-Tor."
            exit 1
          fi
          echo "Kette und Wache meinen dieselbe Anlage."

      - name: Zielprobe — liegt eine hochgeladene Datei wirklich unter der Basisadresse?
        # Selbstprobe zuerst — ein kaputtes Werkzeug sähe sonst grün aus.
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          OHNE=""
          if [ "${{ inputs.probelauf }}" = "true" ] \
             && [ "${{ inputs.probelauf_ohne_sitzung }}" = "true" ]; then
            OHNE="--ohne-sitzungswiederverwendung"
            echo "::notice::TRENNVERSUCH — die Zielprobe läuft OHNE Wiederverwendung der TLS-Sitzung."
            {
              echo '### Trennversuch (F3)'
              echo
              echo 'Die Zielprobe läuft in dieser Runde **ohne** Wiederverwendung der'
              echo 'TLS-Sitzung auf dem Datenkanal. Scheitert sie hier und gelingt sie'
              echo 'mit Wiederverwendung, verlangt der Server sie — und das ist die'
              echo 'Erklärung für den `ECONNRESET` der Auslieferungsaktion.'
              echo
              echo 'Die Zeile **„TLS-Sitzung wiederverwendet"** im Protokoll ist der'
              echo 'Beleg. Steht dort `NICHT FESTSTELLBAR`, misst dieser Lauf nichts.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          MENGE=""
          ZAHL="${{ inputs.probelauf_mengenprobe }}"
          if [ -n "$ZAHL" ]; then
            if [ "${{ inputs.probelauf }}" != "true" ]; then
              echo "::error::Die Mengenprobe laeuft NUR im Probelauf. Sie legt Verzeichnisse auf dem Zielserver an; in einer echten Auslieferung hat sie nichts zu suchen."
              exit 1
            fi
            case "$ZAHL" in
              ''|*[!0-9]*)
                echo "::error::Die Eingabe probelauf_mengenprobe braucht eine Zahl, nicht '$ZAHL'."
                exit 1 ;;
            esac
            if [ "$ZAHL" -lt 1 ] || [ "$ZAHL" -gt 500 ]; then
              echo "::error::Die Eingabe probelauf_mengenprobe liegt ausserhalb von 1 bis 500: $ZAHL."
              exit 1
            fi
            MENGE="--mengenprobe $ZAHL"
            echo "::notice::MENGENPROBE — $ZAHL Verzeichnisse in EINER FTP-Sitzung. Die Rundlaeufe entfallen in dieser Runde."
            {
              echo '### Mengenprobe (F3)'
              echo
              echo "Statt der beiden Rundläufe legt dieser Lauf **$ZAHL Verzeichnisse in"
              echo 'EINER FTP-Sitzung** an. Das ist der letzte Unterschied zwischen der'
              echo 'Zielprobe und der Auslieferungsaktion: Die Probe ruft `curl` je'
              echo 'Operation einmal auf und bekommt jedes Mal eine frische Sitzung, die'
              echo 'Aktion hält **eine** Verbindung für 688 Dateien und 62 Verzeichnisse.'
              echo
              echo 'Die Zeile **„Übertragungen abgeschlossen (226): N von '"$ZAHL"'"** ist das'
              echo 'Ergebnis. Ist N kleiner als '"$ZAHL"' und größer als 0, hat F3 einen Namen:'
              echo 'eine Sitzungs- oder Mengengrenze des Servers — ein Befund für den Hoster.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          SITZUNG=""
          if [ "${{ inputs.probelauf_sitzungsprobe }}" = "true" ]; then
            if [ "${{ inputs.probelauf }}" != "true" ]; then
              echo "::error::Die Sitzungsprobe laeuft NUR im Probelauf. Sie tritt an die Stelle der Rundlaeufe; eine echte Auslieferung braucht die Zielprobe, nicht eine Messung."
              exit 1
            fi
            if [ -n "$MENGE" ]; then
              echo "::error::Mengenprobe UND Sitzungsprobe zugleich geht nicht -- beide treten an die Stelle der Rundlaeufe. Eine von beiden, sonst misst der Lauf etwas anderes, als daransteht."
              exit 1
            fi
            SITZUNG="--sitzungsprobe"
            echo "::notice::SITZUNGSPROBE — Abruf, DANN ein Steuerbefehl, in EINER Sitzung. Die Rundlaeufe entfallen in dieser Runde."
            {
              echo '### Sitzungsprobe (F3)'
              echo
              echo 'Dieser Lauf misst die Reihenfolge, in der die Auslieferungsaktion'
              echo 'stirbt: **Abruf über den Datenkanal, DANACH ein Steuerbefehl — in'
              echo 'derselben Sitzung.** Die Aktion holt ihre Zustandsdatei und setzt'
              echo 'danach `MKD` ab; `_openDir` selbst öffnet gar keine Datenverbindung'
              echo '(`basic-ftp` 6.2.1, Z. 686–689), der Reset kommt also von davor.'
              echo
              echo '**Ein Reset an dieser Stelle ist im Trockenlauf unsichtbar**, weil'
              echo 'danach kein Steuerbefehl mehr kommt — genau die beobachtete Lage:'
              echo 'Probelauf grün, echter Lauf rot.'
              echo
              echo 'Die Zeile **„`PWD` NACH dem Abruf, dieselbe Sitzung"** ist das'
              echo 'Ergebnis. **FEHLGESCHLAGEN wäre der Treffer.** Steht dort'
              echo '`KEINE 257-Antwort gesehen`, misst dieser Lauf nichts.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 tools/kette/zielprobe.py --selbstprobe
          python3 tools/kette/zielprobe.py \
            --basis "$BASIS" \
            --ftp-server "$FTP_SERVER" \
            --ftp-konto "$FTP_USERNAME" \
            --ftp-pass "$FTP_PASSWORD" \
            --ftp-pfad "$ZIELPFAD" \
            $OHNE $MENGE $SITZUNG

      - name: Backup-Tor — Komplett-Backup zu Ende laufen lassen
        if: ${{ !inputs.probelauf }}
        # Selbstprobe zuerst — ein Tor, das immer aufgeht, sähe sonst grün aus.
        run: |
          python3 tools/kette/tor.py --selbstprobe
          python3 tools/kette/tor.py backup --basis "$BASIS" --token "$JOBS_TOKEN"

      - name: Handbuch und „Was ist NAdoku" nach server/doku kopieren
        if: ${{ !inputs.probelauf }}
        run: |
          set -euo pipefail
          mkdir -p server/doku
          cp docs/Handbuch.md docs/Was-ist-NAdoku.md server/doku/
          if [ -d docs/bilder ]; then cp -r docs/bilder server/doku/; fi
          echo "Kopiert:"; ls -l server/doku/

      - name: Gesprächslauf — Riegel und Ansage
        # Ohne `if`: Ein Riegel, der nur bei stimmender Lage läuft, ist keiner.
        run: |
          set -euo pipefail
          if [ "${{ inputs.probelauf_gespraech }}" != "true" ]; then
            exit 0
          fi
          if [ "${{ inputs.probelauf }}" != "true" ]; then
            echo "::error::Der Gespraechslauf laeuft NUR im Probelauf. Er schaltet den Trockenlauf ab; ohne das Haekchen `probelauf` waere das eine echte Auslieferung ohne Tag."
            exit 1
          fi
          echo "::warning::GESPRAECHSLAUF — die Auslieferungsaktion schreibt ECHT, aber in .zielprobe-gespraech/ und NICHT in den Webroot."
          {
            echo '### Gesprächslauf (F3, Prüfpunkt 18a)'
            echo
            echo 'Die Auslieferungsaktion läuft in dieser Runde **echt** — kein'
            echo 'Trockenlauf — und schreibt ihren FTP-Dialog mit (`log-level: verbose`).'
            echo 'Nach acht Trennversuchen ist das die einzige verbliebene Messung: Jede'
            echo 'hat gezeigt, dass `curl` kann, woran die Aktion stirbt.'
            echo
            echo '**Zwei Riegel halten den Preis klein:**'
            echo
            echo '1. `server-dir` zeigt auf **`.zielprobe-gespraech/`** und nicht auf den'
            echo '   Webroot. Die Anwendung bleibt unberührt: kein Wartungsmodus, kein'
            echo '   halb ausgelieferter Stand. Der **führende Punkt** ist Absicht —'
            echo '   `.htaccess` antwortet auf jeden Pfad mit führendem Punkt mit 403,'
            echo '   also liegt dort keine zweite, abrufbare Kopie der Anwendung.'
            echo '2. `state-name` zeigt auf eine **eigene** Zustandsdatei INNERHALB des'
            echo '   Probeverzeichnisses. Der Gesprächslauf kann die der echten'
            echo '   Auslieferung damit nicht anfassen.'
            echo
            echo '**Erwartet:** derselbe `ECONNRESET` wie im echten Lauf — und diesmal'
            echo 'steht davor, bei welchem FTP-Befehl und mit welcher Serverantwort.'
            echo
            echo '**Danach von Hand:** `.zielprobe-gespraech/` entfernen. Das Werkzeug'
            echo 'kann das nicht — es räumt einzelne Probedateien weg, keine Bäume, und'
            echo 'ein Werkzeug, das Verzeichnisbäume auf dem Produktivserver löscht,'
            echo 'soll es nicht geben.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zustandsdatei der Aktion bereitstellen (AP4, F-KH-U-25)
        # Bleibt, auch wenn die Datei liegt: Fehlt sie, stirbt die Aktion an
        # `ECONNRESET`; eine vorhandene fasst der Schritt nie an.
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Dieselben Ausdrücke wie `server-dir` und `state-name` unten; sonst
          # liegt die Datei, wo die Aktion nicht sucht, und alles ist grün.
          ZIEL:    ${{ inputs.probelauf_gespraech && '.zielprobe-gespraech/' || env.ZIELPFAD }}
          ZUSTAND: ${{ inputs.probelauf_gespraech && '.deploy-state-gespraech.json' || env.ZUSTANDSPFAD }}
        run: |
          set -euo pipefail
          # Ein leeres `server-dir` synchronisierte ins Wurzelverzeichnis des
          # FTP-Zugangs, neben den Webroot — deshalb dieser zweite Riegel.
          if [ -z "${ZIEL:-}" ]; then
            echo "::error::Der Zielpfad ist leer. Die Auslieferung wuerde in das Wurzelverzeichnis des FTP-Zugangs schreiben. Pruefe die Variable FTP_ZIELPFAD der Umgebung."
            exit 1
          fi
          if [ -z "${ZUSTAND:-}" ]; then
            echo "::error::Der Pfad der Zustandsdatei ist leer. Pruefe die Variable FTP_STATE_PFAD der Umgebung."
            exit 1
          fi
          python3 tools/kette/zustand.py --selbstprobe
          python3 tools/kette/zustand.py \
            --ftp-server "$FTP_SERVER" \
            --ftp-konto "$FTP_USERNAME" \
            --ftp-pass "$FTP_PASSWORD" \
            --ftp-pfad "$ZIEL" \
            --zustandspfad "$ZUSTAND"
          {
            echo '### Zustandsdatei bereitgestellt (AP4)'
            echo
            echo 'Der Schritt davor legt die Zustandsdatei an, falls sie fehlt. Ohne'
            echo 'sie sendet die Aktion `RETR` auf einen Namen, den es nicht gibt —'
            echo 'der Datenkanal steht dann schon, der Server schließt ihn, und'
            echo '`basic-ftp` liest `ECONNRESET` auf dem Datensocket (F-KH-U-25).'
            echo
            echo '**Läuft der Abgleich jetzt durch, ist die Abhilfe bewiesen** — und'
            echo 'zwar ohne einen Finger an der laufenden Anlage: Es geht in'
            echo '`.zielprobe-gespraech/`, nicht in den Webroot.'
            echo
            echo 'Danach liegen dort rund **9,7 MB in 62 Verzeichnissen**, die von Hand'
            echo 'zu entfernen sind (Prüfpunkt 20).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wartung einschalten
        # Was scheitern kann, ohne den Server zu ändern, steht vor diesem
        # Schritt; direkt danach kommt der Abgleich, sonst Wartung für nichts.
        if: ${{ !inputs.probelauf }}
        run: python3 tools/kette/tor.py wartung-an --basis "$BASIS" --token "$JOBS_TOKEN"

      - name: server/ per FTPS synchronisieren
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          protocol:   ftps
          port:       21
          local-dir:  ./server/
          # Der führende Punkt ist Absicht: `.htaccess` sperrt Punktpfade mit
          # 403, sonst läge im Probeverzeichnis eine öffentlich abrufbare Kopie.
          server-dir: ${{ inputs.probelauf_gespraech && '.zielprobe-gespraech/' || env.ZIELPFAD }}
          # Im Trockenlauf überspringt die Aktion `createFolder`; ob sie
          # schreiben kann, misst erst der Gesprächslauf.
          dry-run: ${{ inputs.probelauf == true && inputs.probelauf_gespraech != true }}
          log-level: ${{ inputs.probelauf_gespraech && 'verbose' || 'standard' }}
          # Die Zustandsdatei gehört aus dem Webroot (sie nennt Pfad und Hash
          # jeder Datei), je Umgebung eine eigene, im Gesprächslauf eine im
          # Probeverzeichnis; `state-name` gilt relativ zu `server-dir`.
          state-name: ${{ inputs.probelauf_gespraech && '.deploy-state-gespraech.json' || env.ZUSTANDSPFAD }}
          # Acht Pfade, die nur auf dem Server liegen, und `install.php` (das
          # Runbook lässt sie nach der Einrichtung löschen); die drei
          # Verzeichnisse stehen als `x/**` und `x/`, weil die Aktion beides
          # getrennt prüft.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            config.php
            install.php
            install.lock
            wartung.lock
            ueberlast.json
            sicherungen/**
            sicherungen/
            apk/**
            apk/
            .sitzungen/**
            .sitzungen/

      - name: Liegt nach dem Abgleich wirklich die neue Fassung oben?
        if: ${{ inputs.umgebung == 'produktion' && !inputs.probelauf }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          erwartet="${tag#web-v}"
          gemeldet=$(python3 tools/kette/tor.py zustand --basis "$BASIS" --token "$JOBS_TOKEN" --frage version)
          echo "Tag: $tag · erwartet: $erwartet · gemeldet: $gemeldet"
          if [ "$gemeldet" = unbekannt ]; then
            echo "::error::Die Anlage hat ihre Fassung nicht genannt. Der Abgleich ist gelaufen, aber ob die neue Fassung oben liegt, ist damit UNBEKANNT — nicht 'in Ordnung'. Die Wartung bleibt an."
            exit 1
          fi
          if [ "$gemeldet" != "$erwartet" ]; then
            echo "::error::Nach dem Abgleich meldet die Anlage Fassung $gemeldet, der Tag sagt $erwartet. Es liegt nicht oben, was ausgeliefert werden sollte. Die Wartung bleibt an."
            exit 1
          fi
          echo "Die Anlage meldet $gemeldet — das ist der Tag." >> "$GITHUB_STEP_SUMMARY"

      - name: Zustand — Migration ausstehend?
        if: ${{ !inputs.probelauf }}
        # Ausstehende Migration ist kein Fehlschlag: grün mit Hinweis, Wartung
        # an — rot ließe den Zeiger `produktion` auf dem alten Stand.
        run: |
          python3 tools/kette/tor.py zustand --basis "$BASIS" --token "$JOBS_TOKEN"
          offen=$(python3 tools/kette/tor.py zustand --basis "$BASIS" --token "$JOBS_TOKEN" --frage migration)
          echo "Migration ausstehend: $offen"
          if [ "$offen" = ja ]; then
            echo "::warning::Migration ausstehend — die Wartung BLEIBT AN."
            {
              echo '## Migration ausstehend'
              echo
              echo 'Die Dateien sind oben, die Wartung ist **an** und bleibt es.'
              echo 'Jetzt von Hand: **Betrieb → Updates** öffnen, die ausstehenden'
              echo 'Migrationen ausführen, danach dort **Wartung beenden**.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 tools/kette/tor.py wartung-aus --basis "$BASIS" --token "$JOBS_TOKEN"
          echo 'Keine Migration ausstehend — Wartung wieder aus.' >> "$GITHUB_STEP_SUMMARY"

      - name: Wenn etwas schiefging — was jetzt gilt und was zu tun ist
        if: ${{ failure() }}
        run: |
          set -uo pipefail
          # `-e` gilt hier trotzdem (aus `defaults`; `set -uo` hebt es nicht
          # auf): Jede Abfrage braucht ihr `|| echo unbekannt`.
          wartung=unbekannt
          fassung=unbekannt
          if [ -n "${BASIS:-}" ] && [ -n "${JOBS_TOKEN:-}" ]; then
            wartung=$(python3 tools/kette/tor.py zustand --basis "$BASIS" --token "$JOBS_TOKEN" --frage wartung 2>/dev/null || echo unbekannt)
            fassung=$(python3 tools/kette/tor.py zustand --basis "$BASIS" --token "$JOBS_TOKEN" --frage version 2>/dev/null || echo unbekannt)
          fi
          echo "::error::Auslieferung nach ${{ inputs.umgebung }} GESCHEITERT. Wartung: $wartung · gemeldete Fassung: $fassung · Dateistand: UNBEKANNT (der Abgleich kann halb gelaufen sein)."
          {
            echo "## Auslieferung nach \`${{ inputs.umgebung }}\` gescheitert"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Wartungsmodus | **$wartung** |"
            echo "| Gemeldete Fassung | \`$fassung\` |"
            echo "| Dateistand | **unbekannt** — der Abgleich kann halb gelaufen sein |"
            echo "| Gescheitert in | Lauf \`${GITHUB_RUN_ID}\`, oben der erste rote Schritt |"
            echo
            echo 'Steht dort **unbekannt**, hat die Anlage nicht geantwortet — das ist'
            echo 'keine Entwarnung, sondern eine eigene Auskunft: Dann ist auch der'
            echo 'Wartungsmodus nicht abgefragt worden.'
            echo
            echo '### Zwei Wege, und beide sind von Hand'
            echo
            echo '1. **Denselben Stand noch einmal ausliefern.** Sinnvoll, wenn der'
            echo '   gescheiterte Schritt eine Ursache hatte, die behoben ist (ein'
            echo '   Geheimnis, eine Variable, ein Aussetzer der Gegenstelle). Der'
            echo '   Abgleich ist wiederholbar: Er überträgt, was sich unterscheidet.'
            echo '2. **Auf den vorigen Tag zurück.** Ein Lauf mit dem vorigen'
            echo '   `web-v*`-Tag legt den alten Stand oben auf; der Zeiger'
            echo '   `produktion` folgt dorthin. Hat die Auslieferung eine Migration'
            echo '   mitgebracht, gehört die Datenbank aus der Sicherung dazu —'
            echo '   Code zurückzurollen und das Schema vorwärts zu lassen ergibt'
            echo '   eine Anwendung, die es nie gab.'
            echo
            echo '**Die Wartung schaltet die Kette NICHT von selbst aus** (E-KH-06):'
            echo 'Mitten im Abgleich liegt ein gemischter Stand, und eine Anwendung,'
            echo 'die den ausliefert, ist schlimmer als eine, die geschlossen ist.'
            echo 'Von Hand geht es unter **Betrieb → Updates → Wartung beenden**.'
          } >> "$GITHUB_STEP_SUMMARY"
