name: Integritaetswache

# Laeuft die ausgelieferte Fassung noch der aus dem Repositorium?
#
# WOGEGEN (SP-6, F-SP-9, Backlog Nr. 140). Der eine Angriff, gegen den keine
# Verschluesselung im Browser hilft, ist ein Server, der VERAENDERTEN CODE
# ausliefert: eine Zeile in `crypto.js`, und das naechste Passwort geht mit.
# Verhindern laesst sich das nur durch Zugangsschutz; ERKENNEN hier.
#
# WARUM ES KEINE EIGENE MAILADRESSE BRAUCHT: Ein fehlgeschlagener Lauf loest
# die gewoehnliche GitHub-Benachrichtigung aus (Einstellung "Actions" in den
# Benachrichtigungen). Eine eigene Adresse braeuchte es nur, wenn die Meldung
# woanders ankommen soll.
#
# KEIN SERVERZUGRIFF, NUR HTTPS -- die Wache holt oeffentliche Dateien und die
# Anmeldeseite. Sie hat keine Zugangsdaten und soll keine bekommen.

on:
  schedule:
    # Taeglich um 04:17 UTC. Krumme Minute mit Absicht: Zur vollen Stunde
    # stehen bei GitHub Millionen Jobs an, und der Lauf verschoebe sich
    # unvorhersehbar.
    - cron: '17 4 * * *'
  # Nach jedem Deploy: Genau dann aendert sich die Auslieferung, und genau
  # dann will man wissen, ob sie so ankam, wie sie losgeschickt wurde.
  #
  # SEIT AP2 LAEUFT DIE WACHE BEI JEDEM AUSLOESER DURCH (E-KH-13). Bis zum
  # 20.09.2026 stand weiter unten ein Riegel, der nach einem `workflow_run`
  # erst fragte, ob der Job `produktion` erfolgreich war -- sonst hielt sie
  # still. Der Riegel war noetig, solange sie gegen `main` verglich: Nach
  # einem Staging-Deploy haette sie Produktiv gegen einen Stand gehalten, der
  # dort gar nicht liegt. Jetzt vergleicht sie gegen den ZEIGER, und der
  # aendert sich nur bei einer Produktiv-Auslieferung. Damit ist der Riegel
  # nicht nur entbehrlich, sondern schaedlich -- er liess die Wache nach
  # einem Staging-Deploy schweigen, obwohl der Vergleich jetzt gueltig waere.
  #
  # DER NAME IST DIE KUPPLUNG, UND SIE IST ZERBRECHLICH (P5a/AP1, Fund F4).
  # Bis Web 20.3.0 stand hier "Server per FTP hochladen" — der Anzeigename des
  # alten `deploy.yml`. Wer einen Lauf umbenennt, haengt diese Wache ab, und
  # zwar STILL: Kein Fehler, keine rote Zeile, nur ein Auslöser, der nie mehr
  # feuert. Mit der Auslieferungskette (E-P5a-10) heisst der Lauf
  # "Auslieferung"; steht der Name hier und dort nicht wortgleich, ist die
  # Wache blind.
  workflow_run:
    workflows: ["Auslieferung"]
    types: [completed]
  workflow_dispatch:

# `actions: read` IST MIT AP2 ENTFALLEN. Es gab diese Berechtigung nur fuer
# den `gh api`-Aufruf des alten Riegels ("hat der Job `produktion` in diesem
# Lauf geklappt?"). Der Riegel ist weg, der Aufruf auch -- und eine
# Berechtigung, die niemand mehr braucht, wird ausgetragen und nicht
# aufbewahrt. `contents: read` reicht fuer beide Auschecken.
permissions:
  contents: read

# ALLE run-BLOECKE MIT `pipefail` (16.09.2026, gemessen).
#
# GitHub faehrt run-Bloecke mit `bash -e {0}` — OHNE pipefail. Der
# Rueckgabewert einer Pipe ist damit der des LETZTEN Glieds, und ein
# gescheitertes erstes Glied faellt lautlos durch. Im Schritt "Wortliste"
# stand `python3 wortliste.py | tee /tmp/wortliste.txt`: `tee` gibt immer 0,
# also konnte dieser Schritt NIE ROT WERDEN. Nachgemessen:
# `bash -e -c 'python3 -c "import sys;sys.exit(1)" | tee /dev/null; echo $?'`
# ergibt 0.
#
# Ein Pruefmittel, das nicht scheitern kann, ist kein Pruefmittel — es ist
# eine gruene Zahl ohne Aussage. Deshalb hier, an EINER Stelle je Lauf, und
# nicht als Flicken an der einen Pipe: Die naechste Pipe kommt bestimmt.
#
# GEMESSEN, WAS DADURCH ROT WIRD: von zehn Pipes in den drei Laeufen trifft
# es genau eine — `grep -oE "WEB_VERSION..." | head -1` im Schritt
# "Fassungen nennen". Die war ohnehin kaputt (das Muster verlangte ein Komma
# hinter dem Namen, `version.php` schreibt `const WEB_VERSION = '…'`) und ist
# im selben Zug berichtigt.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  wache:
    runs-on: ubuntu-latest
    steps:
      - name: Werkzeug auschecken
        # DAS WERKZEUG KOMMT VON HIER, DER VERGLEICHSSTAND VOM ZEIGER
        # (E-KH-13). Beides aus dem Zeigerzweig zu nehmen waere falsch: Dann
        # liefe eine Wache, die so alt ist wie die Auslieferung, und eine
        # Verbesserung an ihr griffe erst nach dem naechsten Deploy.
        uses: actions/checkout@v7

      - name: Gibt es den Zeiger `produktion` ueberhaupt?
        # FEHLENDER ZEIGER IST ROT MIT ANSAGE, NIE STILL GRUEN (E-KH-13).
        # `actions/checkout` scheiterte zwar auch von selbst, aber mit
        # "couldn't find remote ref" -- einer Meldung, die nicht sagt, was
        # das fuer diese Anlage bedeutet. Hier steht es in unseren Worten,
        # samt dem Weg, ihn anzulegen.
        run: |
          if [ -z "$(git ls-remote --heads origin produktion)" ]; then
            echo "::error::Der Zeigerzweig 'produktion' fehlt — die Wache hat NICHT verglichen."
            {
              echo '## Integritaetswache: kein Vergleich'
              echo
              echo "Der Zweig **\`produktion\`** gibt es nicht. Er zeigt auf den Commit,"
              echo 'der auf dem Produktivserver liegt; ohne ihn ist unbekannt, wogegen'
              echo 'zu vergleichen waere.'
              echo
              echo 'Anlegen: `git branch produktion <commit der letzten Auslieferung>`'
              echo 'und pushen. Danach bewegt ihn der Auslieferungslauf selbst.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Zeiger 'produktion': $(git ls-remote --heads origin produktion | cut -f1)"

      - name: Zeiger auschecken — das ist der Vergleichsstand
        uses: actions/checkout@v7
        with:
          ref: produktion
          path: zeiger
          # `fetch-tags`, DAMIT DIE ZUSAMMENFASSUNG DAS TAG NENNEN KANN. Ohne
          # Tags meldet `git describe --exact-match` nichts, und die Wache
          # schriebe "kein Tag" an einen Stand, der sehr wohl eines traegt --
          # eine Auskunft, die in die Irre fuehrt.
          fetch-depth: 1
          fetch-tags: true

      - name: Selbstprobe — erkennt die Wache eine Abweichung ueberhaupt?
        # ZUERST, und das ist kein Formalismus: Ein gruener Lauf einer Wache,
        # die immer gruen meldet, sieht genauso aus wie einer, der nichts
        # gefunden hat. Die Selbstprobe rechnet ohne Netz und braucht eine
        # Sekunde.
        run: python3 tools/integritaetswache/wache.py --selbstprobe

      - name: Auslieferung gegen den Zeiger `produktion`
        # NICHT MEHR "gegen das Repositorium" (AP2/E-KH-13): Verglichen wird
        # gegen den AUSGELIEFERTEN Stand, und der liegt im Zeigerzweig. Dass
        # `main` weiter ist, ist der Normalfall und kein Befund mehr.
        env:
          # Ueber eine Repository-Variable umstellbar, damit ein Selbsthoster
          # die Datei nicht anfassen muss.
          WACHE_BASIS: ${{ vars.WACHE_BASIS }}
        run: |
          BASIS="${WACHE_BASIS:-https://nadoku.gen-em.org}"
          echo "Basisadresse: $BASIS"
          rc=0
          python3 tools/integritaetswache/wache.py "$BASIS" --stand zeiger \
            > /tmp/wache.txt 2>&1 || rc=$?
          cat /tmp/wache.txt
          # DIE ZUSAMMENFASSUNG NENNT, WAS GEMESSEN WURDE (E-KH-13: Commit,
          # Tag und Dateizahl). Ein "Kein Unterschied" ohne den verglichenen
          # Stand ist eine gruene Zahl ohne Aussage -- genau die Sorte, vor
          # der `CLAUDE.md` 6 warnt.
          #
          # `|| rc=$?` UND NICHT `| tee`: Ohne das haette `bash -e` hier
          # abgebrochen, und die Zusammenfassung bliebe leer -- ausgerechnet
          # im roten Lauf, in dem man sie braucht. Dieselbe Falle wie bei der
          # Wortliste am 16.09.2026, nur andersherum.
          {
            echo '## Integritaetswache'
            echo
            grep -E '^(Integritaetswache gegen|Vergleichsstand:|  Teil )' /tmp/wache.txt \
              | sed 's/^/- /' || true
            echo
            if [ "$rc" = 0 ]; then
              echo '**Kein Unterschied.**'
            else
              echo '**ROT** — Einzelheiten im Protokoll des Schritts.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
