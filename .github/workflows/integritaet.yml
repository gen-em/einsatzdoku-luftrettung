name: Integritaetswache

on:
  schedule:
    # Krumme Minute mit Absicht: Zur vollen Stunde stauen sich die geplanten
    # Läufe bei GitHub, und dieser verschöbe sich oder entfiele.
    - cron: '17 4 * * *'
  # Der Name „Auslieferung“ ist die Kupplung: Heißt der Lauf dort anders, feuert
  # dieser Auslöser nie mehr — ohne Fehler, ohne rote Zeile.
  workflow_run:
    workflows: ["Auslieferung"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# GitHub fährt `run:` ohne `pipefail` — eine Pipe meldet dann nur ihr letztes
# Glied, und `prüfe | tee datei` kann nie rot werden.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  wache:
    runs-on: ubuntu-latest
    steps:
      - name: Werkzeug auschecken
        # Werkzeug von hier, nur der Vergleichsstand vom Zeiger — sonst griffe
        # jede Verbesserung an der Wache erst nach dem nächsten Deploy.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Gibt es den Zeiger `produktion` ueberhaupt?
        run: |
          if [ -z "$(git ls-remote --heads origin produktion)" ]; then
            echo "::error::Der Zeigerzweig 'produktion' fehlt — die Wache hat NICHT verglichen."
            {
              echo '## Integritaetswache: kein Vergleich'
              echo
              echo "Der Zweig **\`produktion\`** gibt es nicht. Er zeigt auf den Commit,"
              echo 'der auf dem Produktivserver liegt; ohne ihn ist unbekannt, wogegen'
              echo 'zu vergleichen waere.'
              echo
              echo 'Anlegen: `git branch produktion <commit der letzten Auslieferung>`'
              echo 'und pushen. Danach bewegt ihn der Auslieferungslauf selbst.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Zeiger 'produktion': $(git ls-remote --heads origin produktion | cut -f1)"

      - name: Zeiger auschecken — das ist der Vergleichsstand
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: produktion
          path: zeiger
          # `fetch-tags`, sonst findet `git describe` kein Tag, und die
          # Zusammenfassung meldete „kein Tag“ an einem Stand, der eines trägt.
          fetch-depth: 1
          fetch-tags: true

      - name: Selbstprobe — erkennt die Wache eine Abweichung ueberhaupt?
        # Selbstprobe zuerst — eine taube Wache sähe sonst grün aus.
        run: python3 tools/integritaetswache/wache.py --selbstprobe

      - name: Auslieferung gegen den Zeiger `produktion`
        env:
          WACHE_BASIS: ${{ vars.WACHE_BASIS }}
        run: |
          # Keine Vorgabe: Ein fest eingebauter Wert ließe die Wache bei
          # vergessener Variable eine andere Anlage bewachen und grün melden.
          if [ -z "${WACHE_BASIS:-}" ]; then
            echo "::error::Die Repositoriums-Variable WACHE_BASIS ist leer. Ohne sie weiss die Wache nicht, welche Anlage sie messen soll — und eine Vorgabe gibt es seit AP6 absichtlich nicht mehr. Eintragen unter Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          BASIS="$WACHE_BASIS"
          echo "Basisadresse: $BASIS"
          rc=0
          python3 tools/integritaetswache/wache.py "$BASIS" --stand zeiger \
            > /tmp/wache.txt 2>&1 || rc=$?
          cat /tmp/wache.txt
          # Erst zusammenfassen, dann scheitern: `|| rc=$?` statt `| tee`, sonst
          # bräche `bash -e` ab, und die Zusammenfassung fehlte im roten Lauf.
          {
            echo '## Integritaetswache'
            echo
            # Das Muster hängt am Wortlaut von `wache.py`; ändert der sich,
            # bleibt diese Liste wegen `|| true` still leer.
            grep -E '^(Integritaetswache gegen|Vergleichsstand:|  Teil )' /tmp/wache.txt \
              | sed 's/^/- /' || true
            echo
            if [ "$rc" = 0 ]; then
              echo '**Kein Unterschied.**'
            else
              echo '**ROT** — Einzelheiten im Protokoll des Schritts.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
