name: Auslieferung

# ZWEI WEGE, ZWEI UMGEBUNGEN (Konzept P5a, E-P5a-10; Rahmenplan R67/E-PV-3).
#
# Bis zu dieser Fassung hiess diese Datei `deploy.yml` und hatte genau einen
# Weg: Push auf `main` mit Änderung unter `server/` → FTPS auf **Produktiv**.
# Keine Zwischenstufe, kein Prüftor, kein Rollback-Weg — in `CLAUDE.md` 3
# stand dazu der Satz „Es gibt keine Zwischenstufe und keine Testumgebung".
# Das endet hier.
#
#   staging      Push auf `main`   → Umgebung `staging`, danach Stufe 2
#   produktion   Tag `web-vX.Y.Z`  → Umgebung `produktion` mit
#                                    PFLICHTFREIGABE, davor das Backup-Tor
#
# WARUM KEIN `paths`-FILTER MEHR. Der alte Lauf beschränkte sich auf
# Änderungen unter `server/**`. Ein `on.push` kann Zweige UND Tags auslösen,
# aber `paths` gilt dann für beides — und für einen Tag-Push ist „welche
# Dateien haben sich geändert" keine sinnvolle Frage. Der Filter fällt
# deshalb weg. Er kostet wenig: Die FTPS-Aktion überträgt ohnehin nur, was
# sich geändert hat, und **Staging soll `main` spiegeln**, auch wenn nur
# `docs/` gewandert ist.
#
# WAS DIE PFLICHTFREIGABE LEISTET UND WAS NICHT. Sie ist eine Eigenschaft der
# GitHub-Umgebung („required reviewers"), nicht dieser Datei — wer sie dort
# abschaltet, hat sie abgeschaltet. Sie leistet: Zwischen „Tag gesetzt" und
# „Dateien auf Produktiv" steht ein Mensch. Sie leistet nicht: irgendeine
# Aussage über den Inhalt. Dafür sind die Prüftore da.
#
# DAS BACKUP-TOR STEHT IN `tools/kette/tor.py` und nicht hier (E-P5a-12).
# Eine Bedingung, die einen Deploy verhindern soll, gehört dorthin, wo eine
# `--selbstprobe` sie nachweisen kann — genau das verlangt die Abnahme von
# AP1. Fünf Lagen prüft sie für das Backup-Tor selbst, darunter „meldet nie
# fertig" und „Stand ist von gestern"; die ganze Selbstprobe fährt elf — die
# übrigen gehören zum Unterbefehl `pause` und zur Fehlerantwort. Sie läuft
# seit Web 20.16.1 in Stufe 1 und hier noch einmal, unmittelbar vor dem Tor.
#
# ROLLBACK ist ein Lauf mit dem vorigen Tag (E-PV-3 (d)). Deshalb trägt der
# Tag die Fassung und nicht die Uhrzeit.
#
# WER DIESEN LAUF UMBENENNT, LIEST `integritaet.yml`. Sie hängt per
# `workflow_run` am NAMEN dieses Laufs. Eine Umbenennung hier hängt sie ab —
# still, ohne Fehlermeldung (Fund F4 des Konzepts).
#
# ------------------------------------------------------------------------
# DIE DREI GEHEIMNISSE HEISSEN IN BEIDEN UMGEBUNGEN GLEICH
# ------------------------------------------------------------------------
#
# `FTP_SERVER`, `FTP_USERNAME`, `FTP_PASSWORD` — und die UMGEBUNG entscheidet,
# welcher Wert ankommt. Das ist die Bauart, fuer die es Umgebungen gibt, und
# sie hat einen Vorzug, den sprechende Namen nicht haben: **Ein Job kann die
# Zugangsdaten der falschen Seite nicht erwischen, weil es die anderen in
# seiner Umgebung gar nicht gibt.** Mit `NADOKU_STAGING_*` und
# `NADOKU_PRODUKTION_*` waere ein kopierter Job, der den falschen Praefix
# stehen laesst, ein Deploy auf die falsche Anlage — und niemand saehe es,
# bis er es sieht.
#
# SIE GEHOEREN AN DIE UMGEBUNG, NICHT AN DIE ORGANISATION. Ein
# Organisationsgeheimnis mit "All repositories" ist von jedem Arbeitslauf in
# jedem Repositorium der Organisation lesbar; die Pflichtfreigabe an
# `produktion` waere damit eine Formalie.
#
# DER RIEGEL UNTEN IST DER WICHTIGERE TEIL. GitHub setzt ein Geheimnis, das es
# nicht gibt, auf LEER und bricht nicht ab. Die FTPS-Aktion lief damit mit
# leerem Benutzernamen los und scheiterte erst an der Gegenstelle — mit einer
# Meldung ueber die Anmeldung, nicht ueber den fehlenden Eintrag. Wer den
# Namen eines Geheimnisses vertippt, sucht den Fehler dann beim Hoster.
#
# UND `FTP_SERVER` HEISST SO, WEIL DER WERT EIN HOSTNAME IST. Ein Feld namens
# `..._URL` laedt dazu ein, `ftps://…/staging` einzutragen; die Aktion setzt
# den Wert unveraendert als Server ein, und die Namensaufloesung gelingt nie.
# Der Riegel prueft es deshalb mit.

on:
  push:
    branches: [ main ]
    tags: [ 'web-v*' ]
  workflow_dispatch:
    inputs:
      probelauf:
        description: >-
          PROBELAUF — nichts ausliefern, nur den Weg messen (E-KH-08).
          Fährt `produktion` mit Pflichtfreigabe, aber ohne Tag-Vergleich,
          ohne Backup, ohne Wartung und ohne Schreiben außer der Probedatei;
          der Abgleich läuft als Trockenlauf.
        type: boolean
        default: false
      probelauf_ohne_sitzung:
        description: >-
          Nur zusammen mit PROBELAUF: die Zielprobe OHNE Wiederverwendung der
          TLS-Sitzung auf dem Datenkanal fahren. Das ist der Trennversuch zu
          F3 — gelingt der Lauf MIT und scheitert er OHNE, verlangt der Server
          die Wiederverwendung. Im Normalbetrieb bleibt dies aus.
        type: boolean
        default: false
      probelauf_mengenprobe:
        description: >-
          Nur zusammen mit PROBELAUF: statt der beiden Rundläufe eine
          MENGENPROBE mit dieser Zahl Verzeichnissen (1–500, leer = aus).
          Sie legt sie in EINER FTP-Sitzung an — die Nachstellung dessen, was
          die Auslieferungsaktion tut (688 Dateien, 62 Verzeichnisse in einer
          Sitzung). Die Zielprobe kann das bauartbedingt nicht messen: Sie
          ruft `curl` je Operation einmal auf. Empfehlung für den ersten
          Versuch: 80.
        type: string
        default: ""
      probelauf_sitzungsprobe:
        description: >-
          Nur zusammen mit PROBELAUF: statt der beiden Rundläufe eine
          SITZUNGSPROBE — abrufen und DANACH einen Steuerbefehl absetzen, in
          DERSELBEN FTP-Sitzung. Das ist die Reihenfolge, in der die
          Auslieferungsaktion stirbt (F-KH-U-23): Sie holt ihre Zustandsdatei
          über den Datenkanal und setzt danach `MKD` ab. Ein Reset dazwischen
          ist im Trockenlauf unsichtbar, weil danach kein Steuerbefehl mehr
          kommt. Schreibt nur die Probedatei und räumt sie wieder weg.
        type: boolean
        default: false
      probelauf_gespraech:
        description: >-
          Nur zusammen mit PROBELAUF: GESPRÄCHSLAUF. Die Auslieferungsaktion
          läuft ECHT (kein Trockenlauf) und schreibt ihren FTP-Dialog mit
          (log-level verbose) — aber in ein gesperrtes Probeverzeichnis
          `.zielprobe-gespraech/` und NICHT in den Webroot. Sie erreicht damit
          `ensureDir` und stirbt voraussichtlich dort; diesmal steht im
          Protokoll, bei welchem Befehl und mit welcher Serverantwort. Die
          Anwendung bleibt unberührt — kein Wartungsmodus, kein halber Stand.
          ACHTUNG: Das Probeverzeichnis bleibt danach stehen und wird VON HAND
          entfernt (Prüfdokument, Prüfpunkt 18a).
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# ALLE run-BLOECKE MIT `pipefail` (16.09.2026, gemessen).
#
# GitHub faehrt run-Bloecke mit `bash -e {0}` — OHNE pipefail. Der
# Rueckgabewert einer Pipe ist damit der des LETZTEN Glieds, und ein
# gescheitertes erstes Glied faellt lautlos durch. Im Schritt "Wortliste"
# stand `python3 wortliste.py | tee /tmp/wortliste.txt`: `tee` gibt immer 0,
# also konnte dieser Schritt NIE ROT WERDEN. Nachgemessen:
# `bash -e -c 'python3 -c "import sys;sys.exit(1)" | tee /dev/null; echo $?'`
# ergibt 0.
#
# Ein Pruefmittel, das nicht scheitern kann, ist kein Pruefmittel — es ist
# eine gruene Zahl ohne Aussage. Deshalb hier, an EINER Stelle je Lauf, und
# nicht als Flicken an der einen Pipe: Die naechste Pipe kommt bestimmt.
#
# GEMESSEN, WAS DADURCH ROT WIRD: von zehn Pipes in den drei Laeufen trifft
# es genau eine — `grep -oE "WEB_VERSION..." | head -1` im Schritt
# "Fassungen nennen". Die war ohnehin kaputt (das Muster verlangte ein Komma
# hinter dem Namen, `version.php` schreibt `const WEB_VERSION = '…'`) und ist
# im selben Zug berichtigt.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  staging:
    name: staging
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Sind die drei Geheimnisse der Umgebung `staging` da?
        # Siehe Kopf: ein fehlendes Geheimnis ist LEER, nicht rot.
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # AUSGESCHRIEBENE `if`-BLOECKE UND KEINE `&&`-KETTEN. Unter `set -e`,
          # und GitHub setzt es, ist `[ -z "$X" ] && y=1` als LETZTE Zeile eines
          # Skripts ein Abbruch mit Code 1, sobald die Bedingung nicht zutrifft
          # — also genau dann, wenn alles in Ordnung ist. Die Falle ist bekannt
          # und kostet eine halbe Stunde; drei Zeilen mehr kosten nichts.
          fehlt=""
          if [ -z "${FTP_SERVER:-}" ];   then fehlt="$fehlt FTP_SERVER"; fi
          if [ -z "${FTP_USERNAME:-}" ]; then fehlt="$fehlt FTP_USERNAME"; fi
          if [ -z "${FTP_PASSWORD:-}" ]; then fehlt="$fehlt FTP_PASSWORD"; fi
          if [ -n "$fehlt" ]; then
            echo "::error::Umgebung staging: es fehlt$fehlt. Sie gehoeren als ENVIRONMENT SECRETS an die Umgebung, nicht als Repositoriums- oder Organisationsgeheimnis."
            exit 1
          fi
          # Der Wert ist ein HOSTNAME, keine Adresse. Die FTPS-Aktion setzt ihn
          # unveraendert als Server ein; ein `ftps://` davor, ein Pfad dahinter
          # oder ein `:21` am Ende (die Aktion hat `port:` getrennt) ergibt eine
          # Namensaufloesung, die nie gelingt — und eine Fehlermeldung ueber die
          # Anmeldung statt ueber den Eintrag.
          case "$FTP_SERVER" in
            *://*|*/*|*:*)
              echo "::error::FTP_SERVER traegt ein Schema, einen Pfad oder einen Port. Erwartet wird der blosse Hostname, z. B. ftp.example.de."
              exit 1 ;;
          esac
          echo "Drei Geheimnisse vorhanden; der Host sieht wie ein Hostname aus."

      - name: Handbuch und „Was ist NAdoku" nach server/doku kopieren
        run: |
          # DER FTPS-SCHRITT LAEDT NUR `server/` HOCH. `docs/` liegt daneben
          # und kaeme nie auf den Server -- `hilfe.php` und `ueber.php`
          # zeigten dort dauerhaft "Dieses Dokument fehlt" (P5b/AP8,
          # E-P5b-08, -22). Deshalb wandern beide Dateien VOR dem Sync nach
          # `server/doku/`; `doku_pfad()` sucht erst `../docs/` (fuer
          # Selbsthosterinnen, die das Repositorium hochladen) und dann dort.
          #
          # `server/doku/` steht NICHT in .gitignore und ist trotzdem leer im
          # Repositorium: Der Ordner entsteht hier. Wer ihn eincheckte,
          # haette zwei Fassungen desselben Handbuchs im Baum.
          set -euo pipefail
          mkdir -p server/doku
          cp docs/Handbuch.md docs/Was-ist-NAdoku.md server/doku/
          if [ -d docs/bilder ]; then cp -r docs/bilder server/doku/; fi
          echo "Kopiert:"; ls -l server/doku/

      - name: server/ per FTPS auf Staging synchronisieren
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          protocol:   ftps
          port:       21
          local-dir:  ./server/
          # Das Verzeichnis der Subdomain. Umgebungsvariable und kein
          # Geheimnis: Es ist ein Pfad, keine Zugangsberechtigung.
          server-dir: ${{ vars.FTP_ZIELPFAD || './staging/' }}
          # DIE ZUSTANDSDATEI GEHOERT NICHT IN DEN WEBROOT (Nr. 213).
          #
          # Ohne diese Zeile legt die Aktion `.ftp-deploy-sync-state.json`
          # in `server-dir` ab -- also dorthin, wo der Webserver ausliefert.
          # Darin steht je Datei Pfad, Groesse und Hash. Kein Geheimnis, aber
          # die ganze Struktur und der Versionsstand jeder einzelnen Datei.
          #
          # `../` HEBT SIE EINE EBENE HERAUS, und das geht nur, weil der
          # FTP-Zugang eine Ebene UEBER dem Webroot landet -- `server-dir`
          # sagt es selbst (`./staging/`). Erlaubt der Kaefig das nicht,
          # bricht die Auslieferung; dann traegt man `FTP_STATE_PFAD` als
          # Variable ein und zeigt wieder nach innen. Die Punktdatei-Sperre
          # in `server/.htaccess` faengt sie dort ab -- deshalb ist der
          # Rueckbau eine Variable und kein Notfall.
          #
          # ZWEI NAMEN, NICHT EINER: Teilen sich Staging und Produktion einen
          # FTP-Zugang, landeten beide Staende in derselben Datei und
          # ueberschrieben einander -- die Kette lieferte dann jedes Mal
          # alles neu aus oder, schlimmer, uebersaehe Aenderungen.
          state-name: ${{ vars.FTP_STATE_PFAD || '../.deploy-state-staging.json' }}
          # DIE AUSNAHMELISTE IST WORTGLEICH DIE DES ALTEN `deploy.yml` UND
          # BLEIBT ES. Jede Zeile hat eine Geschichte, und jede fehlende
          # Zeile hat eine teurere:
          #   config.php, install.lock   liegen nur auf dem Server
          #   install.php                der Einrichter. NICHT weil er
          #                              gefaehrlich waere -- er verweigert
          #                              sich selbst, solange config.php oder
          #                              install.lock existiert
          #                              (install.php:136) --, sondern weil
          #                              das Runbook seit jeher sagt
          #                              "install.php danach loeschen"
          #                              (Technik.md, Neuinstallation) und die
          #                              Kette genau das jedes Mal rueckgaengig
          #                              machte. Nr. 214.
          #                              **PREIS, BENANNT:** Eine LEERE Anlage
          #                              laesst sich damit nicht mehr allein
          #                              ueber die Kette einrichten -- die
          #                              Datei muss einmal von Hand hinauf.
          #                              Stufe 2 sagt es, wenn dieser Fall
          #                              eintritt.
          #   sicherungen/               entstehen nur dort (A8.2)
          #   wartung.lock               der Schalter des Wartungsmodus
          #                              (E-S5W-02) — und der Deploy ist
          #                              genau das, was währenddessen läuft
          #   ueberlast.json             der Zähler der Verbindungsgrenze
          #                              (P5a/AP9, E-P5a-50) — ein Zustand
          #                              dieser Installation, kein Quelltext
          #   apk/                       die Android-Pakete (E-S4-16)
          # sicherungen/ und apk/ stehen zweimal, weil die Aktion Datei- und
          # Verzeichnismuster getrennt prüft.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            config.php
            install.php
            install.lock
            wartung.lock
            ueberlast.json
            sicherungen/**
            sicherungen/
            apk/**
            apk/
            .sitzungen/**
            .sitzungen/

  stufe2:
    name: Prüfung Stufe 2
    needs: staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_URL:   ${{ vars.STAGING_URL }}
      STAGING_KONTO: ${{ secrets.STAGING_KONTO }}
      STAGING_PASS:  ${{ secrets.STAGING_PASS }}
      # DERSELBE NAME WIE IM JOB `produktion`, ANDERER WERT. Beide Jobs lesen
      # ihn aus IHRER Umgebung (`environment:`) — `stufe2` aus `staging`,
      # `produktion` aus `produktion`. Das Token gehoert der jeweiligen
      # INSTALLATION (`app_state.jobs_token`, sichtbar unter Betrieb ->
      # Hintergrundjobs), nicht dem Repositorium; zwei Installationen haben
      # zwei Tokens. Gleicher Name, damit die beiden Zeilen sich lesen lassen.
      JOBS_TOKEN:    ${{ secrets.JOBS_TOKEN }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Antwortet Staging wie eine eingerichtete Installation?
        # SEIT DEM 16.09.2026, UND ZWAR AUS EINEM KONKRETEN ANLASS: Solange
        # `STAGING_KONTO` leer war, uebersprangen die beiden Schritte unten
        # und sagten es. Sobald das Geheimnis eingetragen ist — und es wird
        # eingetragen, BEVOR die Anlage steht —, greift der Zweig nicht mehr,
        # und die Kreislaeufe laufen gegen eine Adresse, die noch nichts
        # ausliefert. Sie scheitern dann mit einem Python-Rueckverfolg ueber
        # eine fehlende Anmeldeseite, und niemand liest daraus, dass schlicht
        # `install.php` noch nicht gelaufen ist.
        #
        # ER UEBERSPRINGT NICHT, ER BRICHT AB. Ein Stand, der auf Staging
        # nicht laeuft, ist nicht freigabefaehig — das ist die Aussage von
        # Stufe 2, und sie soll rot sein. Neu ist nur, dass sie sagt, WARUM.
        #
        # ER FRAGT `login.php` UND NICHT `/`. Eine frische Subdomain liefert
        # beim Hoster eine „Domain Default page" mit HTTP 200 aus — gemessen
        # am 16.09.2026 an `staging.nadoku.gen-em.org`, der DAMALIGEN
        # Staging-Anlage im Produktiv-Webspace. Seit dem 20.09.2026 liegt
        # Staging bei einem anderen Hoster (`staging-nadoku.gen-em.org`,
        # lima-city, E-KH-04); die Messung ist Geschichte, der Befund nicht.
        # Wer nur den Code prueft, haelt eine leere Subdomain fuer eine
        # laufende Anwendung.
        # Derselbe Griff faengt den teuersten Einrichtungsfehler mit:
        # **ein falscher `FTP_ZIELPFAD`.** Liegen die Dateien im falschen
        # Verzeichnis, gibt es dort keine `login.php`, und das faellt hier auf
        # und nicht erst, wenn jemand die fremde Seite sucht.
        run: |
          if [ -z "${STAGING_URL:-}" ]; then
            echo "::warning::STAGING_URL fehlt — Stufe 2 ÜBERSPRUNGEN, nicht gemessen."
            echo '**Stufe 2: ÜBERSPRUNGEN** (keine STAGING_URL) — nicht gemessen.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          antwort=$(curl -sS -o /tmp/staging-login.html -L --max-time 30 \
                         -w '%{http_code} %{url_effective}' "$STAGING_URL/login.php" || echo '000 -')
          code=${antwort%% *}
          ziel=${antwort#* }
          echo "login.php: HTTP $code · gelandet bei $ziel"
          case "$ziel" in
            *install.php*)
              # SEIT NR. 214 GIBT ES HIER ZWEI FAELLE, UND SIE BRAUCHEN ZWEI
              # ANTWORTEN. `install.php` steht seither in der Ausnahmeliste
              # (das Runbook sagt "danach loeschen", und die Kette machte das
              # jedes Mal rueckgaengig). Der Preis: Eine LEERE Anlage laesst
              # sich nicht mehr allein ueber die Kette einrichten. Ohne diese
              # Unterscheidung faende man an dieser Stelle einen 404 vor und
              # suchte den Fehler im FTP-Zielpfad -- im falschen Ort.
              icode=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "$STAGING_URL/install.php" || echo '000')
              if [ "$icode" = "404" ]; then
                echo "::error::Die Anlage ist noch nicht eingerichtet, und install.php liegt nicht oben — sie steht seit Nr. 214 in der Ausnahmeliste und wird bewusst NICHT ausgeliefert. Für eine leere Anlage die Datei server/install.php EINMAL von Hand per FTP hochladen, einrichten, danach wieder löschen. Rahmenplan 6a, Schritte 6 bis 8."
              else
                echo "::error::Die Dateien liegen oben, die Anlage ist aber noch nicht eingerichtet — der Aufruf landet auf install.php (HTTP $icode). Rahmenplan 6a, Schritte 6 bis 8."
              fi
              exit 1 ;;
          esac
          if [ "$code" = "000" ]; then
            echo "::error::$STAGING_URL antwortet nicht. Steht die Subdomain schon? (Rahmenplan 6a, Schritte 1 bis 3.)"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::$STAGING_URL/login.php antwortet mit $code. Bei 404 liegen die Dateien im falschen Verzeichnis — FTP_ZIELPFAD prüfen (Rahmenplan 6a, Schritt 4)."
            exit 1
          fi
          if ! grep -q 'AGPL-3.0' /tmp/staging-login.html; then
            echo "::error::Unter $STAGING_URL/login.php antwortet etwas, das nicht nach dieser Anwendung aussieht (die Fusszeile fehlt). Eine leere Subdomain liefert beim Hoster eine Standardseite mit 200 aus."
            exit 1
          fi
          echo "Staging liefert die Anmeldeseite der Anwendung aus."

      - name: Punktdateien gesperrt, .well-known offen?
        # WARUM DIESER SCHRITT ES BEWEIST UND EIN BLOSSER 404 ES NICHT TAT
        # (Nr. 213, 16.09.2026).
        #
        # `RewriteRule ... [F]` antwortet **403, ob die Datei da ist oder
        # nicht** -- mod_rewrite laeuft vor der Dateisuche. Genau daran
        # haengt die Aussagekraft: Ein 404 hiesse nur „dort liegt nichts"
        # und wuerde auch von einer leeren Subdomain kommen. Der Befund, der
        # diesen Schritt ausgeloest hat, wurde zuerst genau so
        # fehlgedeutet -- die Abfrage gegen ein noch leeres Staging gab 404,
        # und das sah nach Entwarnung aus.
        #
        # DIE ZWEITE ZEILE IST DIE WICHTIGERE. `.well-known/` traegt die
        # ACME-Herausforderung. Antwortet sie 403, ist die
        # Zertifikatserneuerung tot -- und zwar lautlos, bis das Zertifikat
        # in bis zu 90 Tagen ablaeuft. Diese Pruefung ist das einzige, was
        # zwischen einer zu breiten Sperre und einer abgelaufenen Anlage
        # steht.
        run: |
          if [ -z "${STAGING_URL:-}" ]; then
            echo "::warning::STAGING_URL fehlt — Punktdatei-Prüfung ÜBERSPRUNGEN, nicht gemessen."
            echo '**Punktdateien: ÜBERSPRUNGEN** (keine STAGING_URL) — nicht gemessen.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          fehler=0

          for pfad in ".ftp-deploy-sync-state.json" ".deploy-state-staging.json" ".env" ".git/config"; do
            code=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "$STAGING_URL/$pfad" || echo '000')
            echo "  /$pfad → HTTP $code"
            if [ "$code" != "403" ]; then
              echo "::error::/$pfad antwortet $code statt 403. Die Punktdatei-Sperre in server/.htaccess greift nicht — liest dieser Webserver .htaccess überhaupt? Ein 404 ist KEINE Entwarnung: er kommt auch von einer leeren Adresse."
              fehler=1
            fi
          done

          wk=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' \
                    "$STAGING_URL/.well-known/acme-challenge/kettenpruefung" || echo '000')
          echo "  /.well-known/acme-challenge/kettenpruefung → HTTP $wk (erwartet 404, NICHT 403)"
          if [ "$wk" = "403" ]; then
            echo "::error::.well-known/ ist mitgesperrt. Die Zertifikatserneuerung (ACME) schlägt damit fehl, und zwar lautlos bis zum Ablauf. Die Ausnahme (?!well-known/) in server/.htaccess prüfen."
            fehler=1
          fi

          if [ "$fehler" != "0" ]; then exit 1; fi
          {
            echo '**Punktdateien:** 4 Pfade → 403 (gesperrt), `.well-known/acme-challenge/` → '"$wk"' (offen).'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Punktdateien gesperrt, .well-known offen."

      - name: Kreisläufe csv und edbak gegen Staging
        # BRAUCHT EIN PRÜFKONTO auf Staging (Umgebungsgeheimnis). Fehlt es,
        # wird der Schritt ÜBERSPRUNGEN UND GESAGT — ein Lauf, der ohne
        # Zugangsdaten grün meldet, hat nichts gemessen (`CLAUDE.md` 6).
        run: |
          if [ -z "${STAGING_URL:-}" ] || [ -z "${STAGING_KONTO:-}" ]; then
            echo "::warning::Prüfkonto auf Staging fehlt — Kreisläufe ÜBERSPRUNGEN, nicht gemessen."
            echo '**Kreisläufe: ÜBERSPRUNGEN** (kein Prüfkonto) — nicht gemessen.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # ALLE RIEGEL VOR DER ERSTEN INSTALLATION. Der JOBS_TOKEN-Riegel
          # stand zuerst hinter pip, npm und dem Chromium-Download: Fehlte das
          # Token UND brach der Download ab (Netz, Spiegel, Rate-Limit), wurde
          # der Schritt ROT mit einer Playwright-Meldung, obwohl eine Zeile
          # weiter „übersprungen, nicht gemessen" gestanden hätte. Man sucht
          # dann am falschen Ort. Begründung zum Token selbst weiter unten.
          if [ -z "${JOBS_TOKEN:-}" ]; then
            echo "::warning::JOBS_TOKEN der Umgebung staging fehlt — Kreisläufe ÜBERSPRUNGEN, nicht gemessen."
            echo '**Kreisläufe: ÜBERSPRUNGEN** (kein `JOBS_TOKEN`) — nicht gemessen. Der Wert steht auf Staging unter Betrieb → Hintergrundjobs.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pip -q install cffi cryptography
          # PLAYWRIGHT LIEGT NICHT DA, WO DIE WERKZEUGE ES SUCHEN.
          # `aufnehmen.mjs` und `kreislauf.py` laden es ueber einen PFAD
          # (`PLAYWRIGHT_MODUL`, Vorgabe /opt/node22/... — der Pfad der
          # Arbeitsumgebung dieses Projekts). Auf einem Laeufer gibt es den
          # nicht. `npx playwright install` holt nur die BROWSER, nicht das
          # Modul an diesen Pfad. Also lokal installieren und den Pfad sagen.
          npm install --no-save --silent playwright@1.56
          export PLAYWRIGHT_MODUL="$PWD/node_modules/playwright/index.mjs"
          [ -f "$PLAYWRIGHT_MODUL" ] \
            || { echo "::error::Playwright-Modul fehlt unter $PLAYWRIGHT_MODUL"; exit 1; }
          npx --yes playwright@1.56 install chromium
          # DREI FEHLER IN EINER ZEILE, gefunden beim ERSTEN Lauf dieses
          # Schritts am 16.09.2026 (er war in AP1 geschrieben und nie
          # gelaufen):
          #
          #   `--art` FEHLTE, und es ist ein Pflichtargument. Der Lauf brach
          #   mit "the following arguments are required: --art" ab.
          #
          #   `--passwort` GIBT ES NICHT. Das Werkzeug kennt
          #   `--konto-passwort` (das Umlaufkonto, das es selbst anlegt),
          #   `--backup-passwort` und `--admin-passwort` (der Zugang, mit dem
          #   es das Umlaufkonto anlegt und wieder loescht). Das Pruefkonto
          #   der Umgebung ist das ADMIN-Konto — also `--admin-email` und
          #   `--admin-passwort`, nicht `--konto`/`--passwort`.
          #
          #   EIN Aufruf, obwohl der Schrittname "csv UND edbak" verspricht.
          #   Jetzt zwei, und beide muessen gruen sein.
          #
          # `--frisch` ist Pflicht und keine Bequemlichkeit: Ein Umlauf in ein
          # GEFUELLTES Konto misst nichts, weil die Dublettenerkennung alles
          # ueberspringt (steht so im Kopf von kreislauf.py). Der Schalter
          # loescht ein vorhandenes Umlaufkonto ueber den Adminbereich.
          # DIE JOB-PAUSE BRAUCHT DAS TOKEN (17.09.2026, Backlog Nr. 219).
          #
          # `kreislauf.py` haelt die Hintergrundjobs an, bevor es ein Backup
          # in ein frisches Konto spielt — sonst duennt der Verdichtungsjob
          # die wiederhergestellten Spuren aus, und der Vergleich misst
          # „hat der Job dazwischen zugeschlagen" statt „kommt zurueck, was
          # hineinging". Nachgemessen: ein Lauf ohne Pause verdichtete 125
          # Spuren des Umlaufkontos.
          #
          # Bis Web 20.16.0 ging das NUR ueber die Kommandozeile, also nur
          # auf dem Rechner der Installation. Hier laeuft ein Laeufer gegen
          # ein fernes Staging: keine `config.php`, kein Weg. Genau daran ist
          # der erste echte Lauf dieses Schritts gescheitert.
          #
          # OHNE TOKEN WIRD NICHT GEMESSEN, statt still auf den lokalen Weg
          # zurueckzufallen: Der schlaegt hier fehl, und ein Kreislauf ohne
          # Pause waere eine gruene Zahl ohne Aussage (`CLAUDE.md` 6).
          for art in edbak csv; do
            echo "--- Kreislauf $art ---"
            python3 tools/referenzdatensatz/vergleich/kreislauf.py \
                    --art "$art" --frisch \
                    --basis "$STAGING_URL" \
                    --admin-email "$STAGING_KONTO" \
                    --admin-passwort "$STAGING_PASS" \
                    --jobs-token "$JOBS_TOKEN" \
              || { echo "::error::Kreislauf $art gegen Staging gescheitert."; exit 1; }
          done

      - name: Bilderlauf gegen Staging
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: |
          if [ -z "${STAGING_URL:-}" ] || [ -z "${STAGING_KONTO:-}" ]; then
            echo "::warning::Prüfkonto auf Staging fehlt — Bilderlauf ÜBERSPRUNGEN, nicht gemessen."
            echo '**Bilderlauf: ÜBERSPRUNGEN** (kein Prüfkonto) — nicht gemessen.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # PLAYWRIGHT LIEGT NICHT DA, WO DIE WERKZEUGE ES SUCHEN.
          # `aufnehmen.mjs` und `kreislauf.py` laden es ueber einen PFAD
          # (`PLAYWRIGHT_MODUL`, Vorgabe /opt/node22/... — der Pfad der
          # Arbeitsumgebung dieses Projekts). Auf einem Laeufer gibt es den
          # nicht. `npx playwright install` holt nur die BROWSER, nicht das
          # Modul an diesen Pfad. Also lokal installieren und den Pfad sagen.
          npm install --no-save --silent playwright@1.56
          export PLAYWRIGHT_MODUL="$PWD/node_modules/playwright/index.mjs"
          [ -f "$PLAYWRIGHT_MODUL" ] \
            || { echo "::error::Playwright-Modul fehlt unter $PLAYWRIGHT_MODUL"; exit 1; }
          npx --yes playwright@1.56 install chromium
          # `--admin`/`--admin-pw` UND NICHT `--konto`/`--passwort`.
          # Die beiden letzten gibt es in diesem Werkzeug nicht; es kannte bis
          # zum 16.09.2026 keine Pruefung auf Unbekanntes und hat sie STILL
          # verworfen — der Lauf meldete sich dann mit den eingebauten
          # Vorgaben an und scheiterte mit "Anmeldung gescheitert", einer
          # Meldung, die den Grund nicht nennt. `aufnehmen.mjs` bricht jetzt
          # mit Rueckgabewert 2 ab, wenn ein Schalter unbekannt ist.
          #
          # `STAGING_KONTO` IST das Admin-Konto — derselbe Wert geht im
          # Kreislauf-Schritt als `--admin-email` hinein, und `--frisch`
          # braucht dort Adminrechte.
          #
          # DIE 29 DEMO-SEITEN laufen ueber die eingebauten Vorgaben
          # (`demo@gen-em.org` / `nadokudemo0815`). Das Konto kommt NICHT aus
          # dem Einspiellauf, sondern aus der Fixture: Adminbereich ->
          # Demo-Konto -> „Demo-Konto anlegen" (Rahmenplan 6a Schritt 8, seit
          # 17.09.2026 erledigt). `seiten.json` fuehrt 29 Demo-, 15 Admin- und
          # 6 anmeldungsfreie Seiten; `aufnehmen.mjs` baut alle drei Rollen
          # auf, bevor es das erste Bild macht.
          #
          # ERSTE MESSUNG MIT DEMO-KONTO (17.09.2026): 400 Einzelbilder, 50
          # Kontaktboegen — alle drei Rollen trugen. Rot blieb der Schritt aus
          # zwei anderen Gruenden, und beide stehen im Backlog:
          # Nr. 220 (`07-wartungsseite`: `aufnehmen.mjs` schaltet den
          # Wartungsmodus ueber die LOKALE Datei `server/wartung.lock` — gegen
          # ein fernes Staging wirkungslos) und Nr. 221 (waagerechter Ueberlauf
          # auf `05-datenschutz` bei 360 px).
          # `--jobs-token` FUER DIE WARTUNGSSEITE (Backlog Nr. 220). Zwei
          # Eintraege in `seiten.json` tragen `"wartung": true` und brauchen
          # die Installation im Wartungsmodus. `aufnehmen.mjs` schaltete ihn
          # ueber die LOKALE Datei `server/wartung.lock` — auf einem Laeufer
          # wirkungslos. Ohne Token bricht der Lauf jetzt VORHER ab, statt
          # acht Bilder der Anmeldeseite abzulegen.
          rc=0
          node tools/screenshots/aufnehmen.mjs \
               --basis "$STAGING_URL" \
               --admin "$STAGING_KONTO" --admin-pw "$STAGING_PASS" \
               --jobs-token "$JOBS_TOKEN" || rc=$?

          # DER BERICHT GEHOERT IN DIE ZUSAMMENFASSUNG, NICHT IN DEN MUELL.
          #
          # Der Lauf schreibt `ausgabe/bericht.md` mit einer Spalte
          # VERURSACHER — dem Element, das ueberlaeuft. Auf dem Laeufer wird
          # sie mit dem Arbeitsverzeichnis weggeraeumt. Am 17.09.2026 meldete
          # der erste Durchlauf, der ALLE 50 Seiten erreichte — rot, aber
          # vollstaendig — „Ueberlauf bei 360" auf
          # `05-datenschutz`, und weil der Bericht fort war, liess sich
          # oertlich nur noch ausschliessen, was es NICHT ist: Markup und
          # Stylesheet sind byteidentisch mit dem Repositorium, alle zehn
          # Schriftdateien liegen und stimmen, und oertlich laeuft nichts
          # ueber — weder bei Massstab 1 noch 2 (Backlog Nr. 221).
          #
          # Eine Zahl ohne den Verursacher ist ein Befund, den niemand
          # nachgehen kann. Ab jetzt steht er im Lauf.
          if [ -f tools/screenshots/ausgabe/bericht.md ]; then
            {
              echo '<details><summary>Bilderlauf — Bericht</summary>'
              echo
              cat tools/screenshots/ausgabe/bericht.md
              echo
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # DER MESSSTAND STAND HIER UND KONNTE NIE LAUFEN (Backlog Nr. 206,
      # behoben in P5a/AP9, E-P5a-53).
      #
      # Der Schritt rief `serverprobe.py --basis "$STAGING_URL"` auf. Diese
      # Kennzeichnung gibt es nicht — `serverprobe.py` kennt `--konto`,
      # `--ausgabe`, `--wartung-fahren` und `--optimieren` —, also wäre jeder
      # Tag-Lauf hier mit „unrecognized arguments" abgebrochen. Und die
      # Kennzeichnung fehlt nicht aus Versehen: Die Serverprobe misst
      # TABELLENGRÖSSEN, SPEICHERSPITZEN und den Waisen-Vollscan, und dafür
      # braucht sie die Datenbank selbst. Über HTTP ist davon nichts zu
      # sehen. Eine Adresse als Ziel war ein Denkfehler, kein Tippfehler.
      #
      # Ersatzlos gestrichen und nicht ersetzt: Der Messstand ist ein
      # MANUELLES Regressionsmittel (R35) und läuft lokal vor einer
      # Auslieferung, nicht in der Kette. Seine Zahlen stehen in
      # `tools/messstand/ausgangsmessung.md`, und was von ihnen auf der
      # Zielanlage gilt, steht dort auf der Plattformkarte
      # (Betrieb → Status → Plattform, seit P5a/AP2) — einschließlich
      # `post_max_size`, der Zahl, um die es in Backlog Nr. 37 geht.
      - name: Messstand — wo seine Zahlen stehen
        # OHNE BEDINGUNG, und das ist die Berichtigung (16.09.2026).
        #
        # Hier stand `if: startsWith(github.ref, 'refs/tags/web-v')`. Damit
        # konnte der Schritt in KEINEM Lauf laufen: Bei einem Tag wird
        # `staging` uebersprungen (sein `if` schliesst Tags aus), `stufe2`
        # haengt per `needs` daran und wird mit uebersprungen — die Bedingung
        # waere zwar erfuellt, der Job laeuft aber nicht. Auf `main` laeuft
        # `stufe2`, dort ist die Bedingung falsch. Zwei Wege, kein Treffer.
        #
        # Der Satz gehoert ohnehin in JEDEN Stufe-2-Lauf: Wer die
        # Zusammenfassung liest, sucht den Messstand und soll erfahren, warum
        # er nicht dabei ist — nicht nur an Tagen.
        run: |
          {
            echo '**Messstand: läuft nicht in der Kette** — er misst die Datenbank'
            echo 'selbst (Tabellengrößen, Speicherspitzen) und ist über HTTP nicht'
            echo 'zu haben. Er ist ein manuelles Regressionsmittel (R35); seine'
            echo 'Zahlen stehen in `tools/messstand/ausgangsmessung.md`, die Grenzen'
            echo 'der Zielanlage auf Betrieb → Status → Plattform.'
          } >> "$GITHUB_STEP_SUMMARY"

  produktion:
    name: produktion
    # NEBEN DEM TAG JETZT AUCH DER PROBELAUF (E-KH-08). Er fährt denselben Job
    # mit derselben Pflichtfreigabe — und damit auch von `main`, wo kein Tag
    # steht. Was er NICHT tut, steht an jedem einzelnen Schritt: kein
    # Tag-Vergleich, kein Backup, keine Wartung, kein Schreiben außer der
    # Probedatei, und der Abgleich als Trockenlauf.
    #
    # Ein zweiter Job wäre der bequeme Weg und der falsche: Dann prüfte der
    # Probelauf eine Schrittfolge, die es so nicht gibt, und genau die Frage
    # „stimmen Geheimnisse, Adresse und Ziel?" bliebe unbeantwortet.
    if: >-
      startsWith(github.ref, 'refs/tags/web-v')
      || inputs.probelauf
    runs-on: ubuntu-latest
    # DIE UMGEBUNG IST DAS TOR. Pflichtfreigabe durch die Betreiberin (T1 aus
    # E-PV-3); die FTPS-Zugangsdaten und JOBS_TOKEN sind ihre Geheimnisse und
    # stehen nicht mehr als Repositoriums-Secrets herum.
    environment: produktion
    env:
      BASIS:      ${{ vars.PRODUKTION_URL }}
      JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
    steps:
      - name: PROBELAUF — was dieser Lauf NICHT tut
        if: ${{ inputs.probelauf }}
        run: |
          echo "::notice::PROBELAUF — es wird nichts ausgeliefert."
          {
            echo '## PROBELAUF — nichts ausgeliefert'
            echo
            echo 'Gemessen werden: die drei Geheimnisse, der Adressvergleich, die'
            echo '**Zielprobe** (Rundlauf FTPS → HTTPS → löschen) und der Abgleich'
            echo 'als **Trockenlauf**.'
            echo
            echo 'NICHT gefahren werden: Tag-Vergleich, Tor der grünen Läufe,'
            echo 'Backup-Tor, Wartungsmodus, `doku`-Kopie und die Migrationsabfrage.'
            echo 'Geschrieben wird nichts außer der Probedatei — und die wird im'
            echo 'selben Schritt wieder gelöscht.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Sind die drei Geheimnisse der Umgebung `produktion` da?
        # HIER WIEGT ER SCHWERER ALS AUF STAGING, UND DESHALB STEHT ER GANZ
        # OBEN: Weiter unten haette der Lauf schon das Komplett-Backup
        # angestossen und die Wartung EINGESCHALTET. Braeche er dann an der
        # FTPS-Anmeldung ab, staende die Anwendung zu, und jemand muesste
        # sie von Hand wieder aufmachen — wegen eines vertippten Namens.
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # AUSGESCHRIEBENE `if`-BLOECKE UND KEINE `&&`-KETTEN. Unter `set -e`,
          # und GitHub setzt es, ist `[ -z "$X" ] && y=1` als LETZTE Zeile eines
          # Skripts ein Abbruch mit Code 1, sobald die Bedingung nicht zutrifft
          # — also genau dann, wenn alles in Ordnung ist. Die Falle ist bekannt
          # und kostet eine halbe Stunde; drei Zeilen mehr kosten nichts.
          fehlt=""
          if [ -z "${FTP_SERVER:-}" ];   then fehlt="$fehlt FTP_SERVER"; fi
          if [ -z "${FTP_USERNAME:-}" ]; then fehlt="$fehlt FTP_USERNAME"; fi
          if [ -z "${FTP_PASSWORD:-}" ]; then fehlt="$fehlt FTP_PASSWORD"; fi
          if [ -n "$fehlt" ]; then
            echo "::error::Umgebung produktion: es fehlt$fehlt. Sie gehoeren als ENVIRONMENT SECRETS an die Umgebung, nicht als Repositoriums- oder Organisationsgeheimnis."
            exit 1
          fi
          # Der Wert ist ein HOSTNAME, keine Adresse. Die FTPS-Aktion setzt ihn
          # unveraendert als Server ein; ein `ftps://` davor, ein Pfad dahinter
          # oder ein `:21` am Ende (die Aktion hat `port:` getrennt) ergibt eine
          # Namensaufloesung, die nie gelingt — und eine Fehlermeldung ueber die
          # Anmeldung statt ueber den Eintrag.
          case "$FTP_SERVER" in
            *://*|*/*|*:*)
              echo "::error::FTP_SERVER traegt ein Schema, einen Pfad oder einen Port. Erwartet wird der blosse Hostname, z. B. ftp.example.de."
              exit 1 ;;
          esac
          echo "Drei Geheimnisse vorhanden; der Host sieht wie ein Hostname aus."

      - name: Tag gegen WEB_VERSION halten
        # KEIN TAG IM PROBELAUF (E-KH-08) — er läuft von `main`.
        if: ${{ !inputs.probelauf }}
        # F-P5a-1: Der Tag heisst `web-vX.Y.Z` und ist gleich `WEB_VERSION`.
        # Eine Auslieferung, deren Tag etwas anderes sagt als die Fusszeile
        # der ausgelieferten Anwendung, ist beim nächsten Rollback ein Rätsel.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ver=$(php -r "require 'server/version.php'; echo WEB_VERSION;")
          echo "Tag: $tag · WEB_VERSION: $ver"
          if [ "$tag" != "web-v$ver" ]; then
            echo "::error::Tag $tag passt nicht zu WEB_VERSION $ver (erwartet web-v$ver)."
            exit 1
          fi

      - name: Grüner Staging- und Stufe-1-Lauf auf diesem Stand?
        # IM PROBELAUF NICHT (E-KH-08 nennt ihn nicht). Dieses Tor schützt
        # Produktiv davor, ungeprobten Code zu bekommen — der Probelauf
        # liefert keinen Code aus, es gibt also nichts zu schützen. Und es
        # wäre der falsche Riegel am falschen Tag: Ausgerechnet wenn die
        # Kette klemmt, braucht man den Probelauf, um zu messen WARUM.
        if: ${{ !inputs.probelauf }}
        # Ein Tag darf nur ausliefern, was auf Staging schon stand und dort
        # grün war (E-P5a-13). Gefragt wird nach dem COMMIT, nicht nach dem
        # Zweig: Ein Tag kann auf einem Stand sitzen, der nie auf `main` war.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${GITHUB_SHA}"
          echo "Commit: $sha"
          pruef=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pruefung.yml/runs?head_sha=$sha&status=success" \
                   --jq '.workflow_runs | length' 2>/dev/null || echo 0)
          stg=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/auslieferung.yml/runs?head_sha=$sha&status=success" \
                   --jq '[.workflow_runs[] | select(.event == "push")] | length' 2>/dev/null || echo 0)
          echo "Grüne Stufe-1-Läufe auf diesem Commit: $pruef"
          echo "Grüne Staging-Läufe auf diesem Commit:  $stg"
          if [ "$pruef" -lt 1 ]; then
            echo "::error::Kein grüner Stufe-1-Lauf auf $sha — dieser Stand ist nicht freigabefähig."
            exit 1
          fi
          if [ "$stg" -lt 1 ]; then
            echo "::error::Kein grüner Staging-Lauf auf $sha — dieser Stand stand nie auf Staging."
            exit 1
          fi

      - name: Zielprobe — liegt eine hochgeladene Datei wirklich unter PRODUKTION_URL?
        # WARUM VOR DEM BACKUP-TOR (E-KH-07, F4). Bis hierher hat noch nichts
        # den Server verändert. Zeigt das FTP-Konto auf ein anderes
        # Verzeichnis als `PRODUKTION_URL`, fällt das JETZT auf — und nicht
        # erst, nachdem ein Komplett-Backup gelaufen ist und die Wartung an
        # ist. Die Probe schreibt genau eine Datei mit Zufallsnamen, holt sie
        # über HTTPS zurück, vergleicht sie, löscht sie und prüft das Löschen.
        #
        # `curl` UND NICHT DIE AUSLIEFERUNGSAKTION, und das ist Absicht: ein
        # ZWEITER FTPS-Client. Scheitert der Upload unten und die Probe hier
        # gelingt, liegt es an der Bibliothek; scheitern beide an derselben
        # Stelle, an der Plattform. Das ist der Trennschnitt, den F3 braucht.
        #
        # DIE SELBSTPROBE LÄUFT DAVOR, jedes Mal: Ein Prüfmittel, das immer
        # grün meldet, sieht genauso aus wie eines, das nichts gefunden hat.
        # Sie rechnet ohne Netz und kostet eine Sekunde.
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # DER TRENNVERSUCH IST EIN SCHALTER UND KEIN ZWEITER SCHRITT
          # (E-KH-07). Zwei Schritte hiessen zwei Wege durch die Kette, und
          # der eine waere nie gefahren worden. So misst der Probelauf beide
          # Betriebsarten ueber DENSELBEN Weg — nur der Datenkanal aendert
          # sich.
          #
          # UND ER GILT NUR IM PROBELAUF. Eine Auslieferung faehrt immer MIT
          # Wiederverwendung; ein Tag-Lauf hat den Schalter gar nicht.
          OHNE=""
          if [ "${{ inputs.probelauf }}" = "true" ] \
             && [ "${{ inputs.probelauf_ohne_sitzung }}" = "true" ]; then
            OHNE="--ohne-sitzungswiederverwendung"
            echo "::notice::TRENNVERSUCH — die Zielprobe läuft OHNE Wiederverwendung der TLS-Sitzung."
            {
              echo '### Trennversuch (F3)'
              echo
              echo 'Die Zielprobe läuft in dieser Runde **ohne** Wiederverwendung der'
              echo 'TLS-Sitzung auf dem Datenkanal. Scheitert sie hier und gelingt sie'
              echo 'mit Wiederverwendung, verlangt der Server sie — und das ist die'
              echo 'Erklärung für den `ECONNRESET` der Auslieferungsaktion.'
              echo
              echo 'Die Zeile **„TLS-Sitzung wiederverwendet"** im Protokoll ist der'
              echo 'Beleg. Steht dort `NICHT FESTSTELLBAR`, misst dieser Lauf nichts.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # DIE MENGENPROBE TRITT AN DIE STELLE DER RUNDLAEUFE (F-KH-U-20).
          # Sie legt bis zu 500 Verzeichnisse auf dem Zielserver an -- deshalb
          # NUR im Probelauf, nur auf ausdrueckliche Eingabe, und niemals
          # nebenbei. Ohne diesen Riegel liefe sie eines Tages waehrend einer
          # echten Auslieferung.
          MENGE=""
          ZAHL="${{ inputs.probelauf_mengenprobe }}"
          if [ -n "$ZAHL" ]; then
            if [ "${{ inputs.probelauf }}" != "true" ]; then
              echo "::error::Die Mengenprobe laeuft NUR im Probelauf. Sie legt Verzeichnisse auf dem Zielserver an; in einer echten Auslieferung hat sie nichts zu suchen."
              exit 1
            fi
            case "$ZAHL" in
              ''|*[!0-9]*)
                echo "::error::Die Eingabe probelauf_mengenprobe braucht eine Zahl, nicht '$ZAHL'."
                exit 1 ;;
            esac
            if [ "$ZAHL" -lt 1 ] || [ "$ZAHL" -gt 500 ]; then
              echo "::error::Die Eingabe probelauf_mengenprobe liegt ausserhalb von 1 bis 500: $ZAHL."
              exit 1
            fi
            MENGE="--mengenprobe $ZAHL"
            echo "::notice::MENGENPROBE — $ZAHL Verzeichnisse in EINER FTP-Sitzung. Die Rundlaeufe entfallen in dieser Runde."
            {
              echo '### Mengenprobe (F3)'
              echo
              echo "Statt der beiden Rundläufe legt dieser Lauf **$ZAHL Verzeichnisse in"
              echo 'EINER FTP-Sitzung** an. Das ist der letzte Unterschied zwischen der'
              echo 'Zielprobe und der Auslieferungsaktion: Die Probe ruft `curl` je'
              echo 'Operation einmal auf und bekommt jedes Mal eine frische Sitzung, die'
              echo 'Aktion hält **eine** Verbindung für 688 Dateien und 62 Verzeichnisse.'
              echo
              echo 'Die Zeile **„Übertragungen abgeschlossen (226): N von '"$ZAHL"'"** ist das'
              echo 'Ergebnis. Ist N kleiner als '"$ZAHL"' und größer als 0, hat F3 einen Namen:'
              echo 'eine Sitzungs- oder Mengengrenze des Servers — ein Befund für den Hoster.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # DIE SITZUNGSPROBE TRITT EBENSO AN DIE STELLE DER RUNDLAEUFE
          # (F-KH-U-23). Sie schreibt nur EINE Probedatei und raeumt sie weg;
          # der Riegel "nur im Probelauf" steht hier trotzdem, weil sie die
          # Rundlaeufe verdraengt -- eine Auslieferung, die statt der
          # Zielprobe eine Messung faehrt, hat ihr Tor nicht durchlaufen.
          SITZUNG=""
          if [ "${{ inputs.probelauf_sitzungsprobe }}" = "true" ]; then
            if [ "${{ inputs.probelauf }}" != "true" ]; then
              echo "::error::Die Sitzungsprobe laeuft NUR im Probelauf. Sie tritt an die Stelle der Rundlaeufe; eine echte Auslieferung braucht die Zielprobe, nicht eine Messung."
              exit 1
            fi
            if [ -n "$MENGE" ]; then
              echo "::error::Mengenprobe UND Sitzungsprobe zugleich geht nicht -- beide treten an die Stelle der Rundlaeufe. Eine von beiden, sonst misst der Lauf etwas anderes, als daransteht."
              exit 1
            fi
            SITZUNG="--sitzungsprobe"
            echo "::notice::SITZUNGSPROBE — Abruf, DANN ein Steuerbefehl, in EINER Sitzung. Die Rundlaeufe entfallen in dieser Runde."
            {
              echo '### Sitzungsprobe (F3)'
              echo
              echo 'Dieser Lauf misst die Reihenfolge, in der die Auslieferungsaktion'
              echo 'stirbt: **Abruf über den Datenkanal, DANACH ein Steuerbefehl — in'
              echo 'derselben Sitzung.** Die Aktion holt ihre Zustandsdatei und setzt'
              echo 'danach `MKD` ab; `_openDir` selbst öffnet gar keine Datenverbindung'
              echo '(`basic-ftp` 6.2.1, Z. 686–689), der Reset kommt also von davor.'
              echo
              echo '**Ein Reset an dieser Stelle ist im Trockenlauf unsichtbar**, weil'
              echo 'danach kein Steuerbefehl mehr kommt — genau die beobachtete Lage:'
              echo 'Probelauf grün, echter Lauf rot.'
              echo
              echo 'Die Zeile **„`PWD` NACH dem Abruf, dieselbe Sitzung"** ist das'
              echo 'Ergebnis. **FEHLGESCHLAGEN wäre der Treffer.** Steht dort'
              echo '`KEINE 257-Antwort gesehen`, misst dieser Lauf nichts.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 tools/kette/zielprobe.py --selbstprobe
          python3 tools/kette/zielprobe.py \
            --basis "$BASIS" \
            --ftp-server "$FTP_SERVER" \
            --ftp-konto "$FTP_USERNAME" \
            --ftp-pass "$FTP_PASSWORD" \
            --ftp-pfad "${{ vars.FTP_ZIELPFAD || './httpdocs/' }}" \
            $OHNE $MENGE $SITZUNG

      - name: Backup-Tor — Komplett-Backup zu Ende laufen lassen
        # Der Probelauf verändert den Server nicht und braucht deshalb kein
        # Backup — ein Komplett-Backup je Probelauf wäre teuer und sagte
        # über den gemessenen Weg nichts.
        if: ${{ !inputs.probelauf }}
        # Erst die Selbstprobe, dann das Tor: Ein Tor, das immer aufgeht,
        # sieht von aussen aus wie eines, das geprüft hat.
        run: |
          python3 tools/kette/tor.py --selbstprobe
          python3 tools/kette/tor.py backup --basis "$BASIS" --token "$JOBS_TOKEN"

      - name: Wartung einschalten
        # KEINE WARTUNG IM PROBELAUF: Sie ist der einzige Schritt, der
        # Nutzerinnen aussperrt — für eine Messung, die nichts schreibt.
        if: ${{ !inputs.probelauf }}
        run: python3 tools/kette/tor.py wartung-an --basis "$BASIS" --token "$JOBS_TOKEN"

      - name: Handbuch und „Was ist NAdoku" nach server/doku kopieren
        if: ${{ !inputs.probelauf }}
        run: |
          # Dieselbe Begruendung wie beim Staging-Schritt oben (P5b/AP8). Er
          # steht ZWEIMAL da und nicht einmal: Die beiden Laeufe sind
          # verschiedene Jobs auf verschiedenen Laeufern, jeder mit eigenem
          # Auschecken -- was der eine kopiert, sieht der andere nicht.
          set -euo pipefail
          mkdir -p server/doku
          cp docs/Handbuch.md docs/Was-ist-NAdoku.md server/doku/
          if [ -d docs/bilder ]; then cp -r docs/bilder server/doku/; fi
          echo "Kopiert:"; ls -l server/doku/

      - name: Gesprächslauf — Riegel und Ansage
        # OHNE `if`, UND DAS IST DER PUNKT. Ein Riegel, der nur laeuft, wenn
        # die Lage schon stimmt, ist keiner. Dieser Schritt prueft immer.
        run: |
          set -euo pipefail
          if [ "${{ inputs.probelauf_gespraech }}" != "true" ]; then
            exit 0
          fi
          if [ "${{ inputs.probelauf }}" != "true" ]; then
            echo "::error::Der Gespraechslauf laeuft NUR im Probelauf. Er schaltet den Trockenlauf ab; ohne das Haekchen `probelauf` waere das eine echte Auslieferung ohne Tag."
            exit 1
          fi
          echo "::warning::GESPRAECHSLAUF — die Auslieferungsaktion schreibt ECHT, aber in .zielprobe-gespraech/ und NICHT in den Webroot."
          {
            echo '### Gesprächslauf (F3, Prüfpunkt 18a)'
            echo
            echo 'Die Auslieferungsaktion läuft in dieser Runde **echt** — kein'
            echo 'Trockenlauf — und schreibt ihren FTP-Dialog mit (`log-level: verbose`).'
            echo 'Nach acht Trennversuchen ist das die einzige verbliebene Messung: Jede'
            echo 'hat gezeigt, dass `curl` kann, woran die Aktion stirbt.'
            echo
            echo '**Zwei Riegel halten den Preis klein:**'
            echo
            echo '1. `server-dir` zeigt auf **`.zielprobe-gespraech/`** und nicht auf den'
            echo '   Webroot. Die Anwendung bleibt unberührt: kein Wartungsmodus, kein'
            echo '   halb ausgelieferter Stand. Der **führende Punkt** ist Absicht —'
            echo '   `.htaccess` antwortet auf jeden Pfad mit führendem Punkt mit 403,'
            echo '   also liegt dort keine zweite, abrufbare Kopie der Anwendung.'
            echo '2. `state-name` zeigt auf eine **eigene** Zustandsdatei INNERHALB des'
            echo '   Probeverzeichnisses. Der Gesprächslauf kann die der echten'
            echo '   Auslieferung damit nicht anfassen.'
            echo
            echo '**Erwartet:** derselbe `ECONNRESET` wie im echten Lauf — und diesmal'
            echo 'steht davor, bei welchem FTP-Befehl und mit welcher Serverantwort.'
            echo
            echo '**Danach von Hand:** `.zielprobe-gespraech/` entfernen. Das Werkzeug'
            echo 'kann das nicht — es räumt einzelne Probedateien weg, keine Bäume, und'
            echo 'ein Werkzeug, das Verzeichnisbäume auf dem Produktivserver löscht,'
            echo 'soll es nicht geben.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zustandsdatei der Aktion bereitstellen (AP4, F-KH-U-25)
        # VORERST NUR IM GESPRAECHSLAUF, UND DAS IST ABSICHT. Die Abhilfe ist
        # gefunden, aber noch nicht bewiesen: Der Gespraechslauf gegen das
        # Probeverzeichnis ist der Beweis, und er faellt ohne einen Finger an
        # der laufenden Anlage. Erst wenn er durchlaeuft, wird dieser Schritt
        # fuer die echte Auslieferung scharf gestellt -- vorher waere es ein
        # Eingriff auf Verdacht.
        if: ${{ inputs.probelauf_gespraech }}
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 tools/kette/zustand.py --selbstprobe
          python3 tools/kette/zustand.py \
            --ftp-server "$FTP_SERVER" \
            --ftp-konto "$FTP_USERNAME" \
            --ftp-pass "$FTP_PASSWORD" \
            --ftp-pfad ".zielprobe-gespraech/" \
            --zustandspfad ".deploy-state-gespraech.json"
          {
            echo '### Zustandsdatei bereitgestellt (AP4)'
            echo
            echo 'Der Schritt davor legt die Zustandsdatei an, falls sie fehlt. Ohne'
            echo 'sie sendet die Aktion `RETR` auf einen Namen, den es nicht gibt —'
            echo 'der Datenkanal steht dann schon, der Server schließt ihn, und'
            echo '`basic-ftp` liest `ECONNRESET` auf dem Datensocket (F-KH-U-25).'
            echo
            echo '**Läuft der Abgleich jetzt durch, ist die Abhilfe bewiesen** — und'
            echo 'zwar ohne einen Finger an der laufenden Anlage: Es geht in'
            echo '`.zielprobe-gespraech/`, nicht in den Webroot.'
            echo
            echo 'Danach liegen dort rund **9,7 MB in 62 Verzeichnissen**, die von Hand'
            echo 'zu entfernen sind (Prüfpunkt 20).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: server/ per FTPS auf Produktiv synchronisieren
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          protocol:   ftps
          port:       21
          local-dir:  ./server/
          # IM GESPRAECHSLAUF IN EIN PROBEVERZEICHNIS (Pruefpunkt 18a). Die
          # Aktion muss nicht in den Webroot schreiben, um `ensureDir` zu
          # erreichen -- sie muss nur IRGENDWOHIN echt schreiben. Alles
          # Entscheidende bleibt gleich: derselbe Client, derselbe Server,
          # dieselbe Sitzung, echtes `ensureDir`, 688 Dateien in 62
          # Verzeichnissen. Was entfaellt: Wartungsmodus, halber Stand ueber
          # der laufenden Anwendung, Rueckweg.
          #
          # DER FUEHRENDE PUNKT IST ABSICHT: `.htaccess` antwortet auf jeden
          # Pfad mit fuehrendem Punkt mit 403 (gemessen in F-KH-U-13, als die
          # Zielprobe sich damit selbst ausgesperrt hat). Ohne ihn laege hier
          # eine zweite, oeffentlich abrufbare Kopie der Anwendung.
          server-dir: ${{ inputs.probelauf_gespraech && '.zielprobe-gespraech/' || vars.FTP_ZIELPFAD || './httpdocs/' }}
          # TROCKENLAUF IM PROBELAUF (E-KH-08). Die Aktion verbindet sich,
          # vergleicht und sagt, was sie täte — sie schreibt nichts. Damit
          # misst der Probelauf genau den Weg, an dem F3 hängt, ohne eine
          # einzige Datei zu bewegen.
          #
          # DER GESPRAECHSLAUF SCHALTET IHN AB (Pruefpunkt 18a) -- er MUSS echt
          # schreiben, sonst erreicht die Aktion `ensureDir` nie:
          # `syncProvider.js` beginnt `createFolder` mit
          # `if (this.dryRun === true) { return; }`. Genau deshalb hat kein
          # Probelauf F3 je ausgeloest, und genau deshalb braucht es ihn.
          dry-run: ${{ inputs.probelauf == true && inputs.probelauf_gespraech != true }}
          # DER MITSCHNITT (Pruefpunkt 18a). `verbose` setzt
          # `client.ftp.verbose = true` und schreibt damit den FTP-Dialog von
          # `basic-ftp` mit -- jeden Befehl, jede Serverantwort. Nachgelesen
          # in `deploy.js` Z. 74, nicht geraten (die Lehre aus F-KH-U-15).
          #
          # DAS PASSWORT STEHT NICHT DARIN: `FtpContext.js` Z. 191/192 ersetzt
          # `PASS …` durch `> PASS ###`, bevor irgendetwas geschrieben wird.
          # Dass GitHub Geheimnisse ohnehin maskiert, ist der zweite Riegel
          # und nicht der einzige.
          log-level: ${{ inputs.probelauf_gespraech && 'verbose' || 'standard' }}
          # Wie im Staging-Job (Nr. 213) — Begründung steht dort. Der
          # Dateiname ist ein anderer, und genau darauf kommt es an.
          #
          # UND DER GESPRAECHSLAUF BEKOMMT EINE EIGENE, INNERHALB DES
          # PROBEVERZEICHNISSES. Ohne das zeigte `../` von dort aus in den
          # Webroot -- der Gespraechslauf legte also eine Zustandsdatei mitten
          # in die laufende Anlage. So kann er die der echten Auslieferung
          # nicht einmal sehen, und seine eigene verschwindet mit dem
          # Probeverzeichnis.
          state-name: ${{ inputs.probelauf_gespraech && '.deploy-state-gespraech.json' || vars.FTP_STATE_PFAD || '../.deploy-state-produktion.json' }}
          # Wortgleich wie im Staging-Job — Begründung steht dort.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            config.php
            install.php
            install.lock
            wartung.lock
            ueberlast.json
            sicherungen/**
            sicherungen/
            apk/**
            apk/
            .sitzungen/**
            .sitzungen/

      - name: Zustand — Migration ausstehend?
        if: ${{ !inputs.probelauf }}
        # R66 SAGT: KEIN SELBST-UPDATE. Die Installation ändert ihren Code nie
        # selbst, und sie fährt auch keine Migration von selbst. Steht eine
        # aus, BLEIBT DIE WARTUNG AN und der Lauf endet GRÜN mit dem Hinweis —
        # grün, weil das Ausliefern gelungen ist; der Hinweis, weil jetzt ein
        # Mensch an der Reihe ist. Ein roter Lauf sagte hier etwas Falsches.
        run: |
          python3 tools/kette/tor.py zustand --basis "$BASIS" --token "$JOBS_TOKEN"
          offen=$(python3 tools/kette/tor.py zustand --basis "$BASIS" --token "$JOBS_TOKEN" --frage migration)
          echo "Migration ausstehend: $offen"
          if [ "$offen" = ja ]; then
            echo "::warning::Migration ausstehend — die Wartung BLEIBT AN."
            {
              echo '## Migration ausstehend'
              echo
              echo 'Die Dateien sind oben, die Wartung ist **an** und bleibt es.'
              echo 'Jetzt von Hand: **Betrieb → Updates** öffnen, die ausstehenden'
              echo 'Migrationen ausführen, danach dort **Wartung beenden**.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 tools/kette/tor.py wartung-aus --basis "$BASIS" --token "$JOBS_TOKEN"
          echo 'Keine Migration ausstehend — Wartung wieder aus.' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  zeiger:
    name: zeiger
    # DER ZEIGER SAGT, WAS AUF PRODUKTIV LIEGT (AP2/E-KH-13).
    #
    # WOGEGEN. Die Integritaetswache vergleicht den Produktivserver mit einem
    # Stand aus dem Repositorium. Bis zum 20.09.2026 nahm sie dafuer `main` --
    # und `main` ist fast immer weiter als das, was ausgeliefert wurde. Sie
    # wurde deshalb seit dem 17.09. taeglich rot, zuletzt mit 2 abweichenden
    # und 6 nicht erreichbaren Dateien, allesamt aus P5a und P5b (Befund B6).
    # Eine Wache, die regelmaessig grundlos rot wird, wird abgeschaltet; dann
    # ist der Angriff, gegen den es sie gibt, unbeobachtet.
    #
    # WARUM NICHT DAS JUENGSTE `web-v*`-TAG. Es ist nicht der ausgelieferte
    # Stand: Ein Tag kann gesetzt und die Freigabe nie erteilt worden sein,
    # das Backup-Tor kann zugegangen sein, und nach einem Ruecksetzen liegt
    # ein AELTERER Stand oben als der juengste Tag. Der Zeiger bewegt sich
    # ausschliesslich, wenn tatsaechlich ausgeliefert wurde -- rueckwaerts
    # eingeschlossen, denn ein Ruecksetzen ist eine Auslieferung.
    needs: produktion
    # ZWEI BEDINGUNGEN, UND DIE ZWEITE IST TEUER BEZAHLT.
    #
    # (1) `needs` ALLEIN REICHT NICHT: Ein uebersprungener Job gilt GitHub als
    # erfuellte Abhaengigkeit. Ohne `result == 'success'` bewegte ein Lauf
    # ohne Tag den Zeiger auf einen Stand, der nie auf Produktiv war.
    #
    # (2) EIN PROBELAUF IST AUCH ERFOLGREICH -- UND LIEFERT NICHTS AUS.
    # Genau das ist am 20.09.2026 passiert (Lauf 35534695781): Der Probelauf
    # lief durch, `produktion` meldete `success`, und der Zeiger wanderte auf
    # `9f62d55` -- einen Commit, der nie auf dem Server lag. Die
    # Integritaetswache haette am naechsten Morgen Produktiv gegen 20.26.0
    # gehalten, waehrend dort 20.24.2 liegt: taeglicher Falschalarm, also
    # genau der Zustand, den AP2 beseitigt hat.
    #
    # DER KOMMENTAR UEBER (1) STAND SCHON DA, ALS (2) GEBAUT WURDE. Die
    # Bedingung war gegen den uebersprungenen Job gerichtet; der Probelauf kam
    # ein Paket spaeter und ging durch die Tuer daneben. Wer hier etwas
    # hinzufuegt, das `produktion` erfolgreich beenden laesst, ohne
    # auszuliefern, ergaenzt diese Zeile -- sonst wiederholt sich derselbe
    # Fehler ein drittes Mal.
    if: needs.produktion.result == 'success' && !inputs.probelauf
    runs-on: ubuntu-latest
    # HIER UND NUR HIER `contents: write`. Der Job mit den FTPS-Geheimnissen
    # (`produktion`) bleibt bei `read`: Er darf ausliefern, aber nichts ins
    # Repositorium schreiben. Dieser hier darf schreiben, kennt aber weder
    # Zugangsdaten noch Umgebung -- es gibt kein `environment:`, weil die
    # Freigabe schon vor `produktion` eingeholt wurde und ein zweites Tor
    # nach getaner Auslieferung den Zeiger nur hinter dem Stand zurueckliesse.
    #
    # KEINE FREMD-AKTION in diesem Job ausser `checkout`. Ein Schreibrecht
    # auf das Repositorium ist das Einzige, was diese Kette zu vergeben hat.
    permissions:
      contents: write
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7
        with:
          # Volle Historie: Ohne sie kennt der Laeufer den bisherigen Zeiger
          # nicht und koennte nicht sagen, wohin er sich bewegt.
          fetch-depth: 0

      - name: Zeiger `produktion` auf diesen Stand setzen
        env:
          ZIEL: ${{ github.sha }}
        run: |
          # ZWEITER RIEGEL AN DER STELLE, WO DER SCHADEN ENTSTEHT.
          # Die `if`-Zeile des Jobs sollte das schon verhindern — sie hat es
          # am 20.09.2026 nicht getan, weil sie den Probelauf nicht kannte.
          # Ein Riegel an der Bedingung UND einer an der Tat: Wer die
          # Bedingung kuenftig erweitert und diese Zeile vergisst, bekommt
          # einen roten Lauf statt eines falschen Zeigers.
          if [ "${{ inputs.probelauf }}" = "true" ]; then
            echo "::error::Der Zeiger wird im PROBELAUF NICHT bewegt — es ist nichts ausgeliefert worden. Dass dieser Schritt überhaupt läuft, heißt: die Bedingung des Jobs ist kaputt."
            exit 1
          fi
          vorher=$(git rev-parse --verify --quiet origin/produktion || echo 'keiner')
          echo "Zeiger vorher:  $vorher"
          echo "Zeiger nachher: $ZIEL  (Tag: ${GITHUB_REF_NAME})"
          # ERZWUNGEN IST HIER RICHTIG UND SONST NIRGENDS. Ein Ruecksetzen
          # legt einen AELTEREN Commit auf den Server; ein Push ohne Zwang
          # lehnte das als Rueckschritt ab, und der Zeiger bliebe auf einem
          # Stand stehen, der nicht mehr oben liegt. Genau dann waere die
          # Wache blind fuer den Unterschied. Auf diesem Zweig entwickelt
          # niemand -- es gibt nichts zu ueberschreiben als den Zeiger selbst.
          git push --force origin "$ZIEL:refs/heads/produktion"
          {
            echo '## Zeiger `produktion` bewegt'
            echo
            echo '| | Commit |'
            echo '|---|---|'
            echo "| vorher | \`$vorher\` |"
            echo "| nachher | \`$ZIEL\` (\`${GITHUB_REF_NAME}\`) |"
            echo
            echo 'Die Integritaetswache vergleicht ab jetzt gegen diesen Stand.'
          } >> "$GITHUB_STEP_SUMMARY"
