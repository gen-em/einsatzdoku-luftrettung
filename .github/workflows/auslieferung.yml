name: Auslieferung

# ZWEI WEGE, ZWEI UMGEBUNGEN (Konzept P5a, E-P5a-10; Rahmenplan R67/E-PV-3).
#
# Bis zu dieser Fassung hiess diese Datei `deploy.yml` und hatte genau einen
# Weg: Push auf `main` mit Änderung unter `server/` → FTPS auf **Produktiv**.
# Keine Zwischenstufe, kein Prüftor, kein Rollback-Weg — in `CLAUDE.md` 3
# stand dazu der Satz „Es gibt keine Zwischenstufe und keine Testumgebung".
# Das endet hier.
#
#   staging      Push auf `main`   → Umgebung `staging`, danach Stufe 2
#   produktion   Tag `web-vX.Y.Z`  → Umgebung `produktion` mit
#                                    PFLICHTFREIGABE, davor das Backup-Tor
#
# WARUM KEIN `paths`-FILTER MEHR. Der alte Lauf beschränkte sich auf
# Änderungen unter `server/**`. Ein `on.push` kann Zweige UND Tags auslösen,
# aber `paths` gilt dann für beides — und für einen Tag-Push ist „welche
# Dateien haben sich geändert" keine sinnvolle Frage. Der Filter fällt
# deshalb weg. Er kostet wenig: Die FTPS-Aktion überträgt ohnehin nur, was
# sich geändert hat, und **Staging soll `main` spiegeln**, auch wenn nur
# `docs/` gewandert ist.
#
# WAS DIE PFLICHTFREIGABE LEISTET UND WAS NICHT. Sie ist eine Eigenschaft der
# GitHub-Umgebung („required reviewers"), nicht dieser Datei — wer sie dort
# abschaltet, hat sie abgeschaltet. Sie leistet: Zwischen „Tag gesetzt" und
# „Dateien auf Produktiv" steht ein Mensch. Sie leistet nicht: irgendeine
# Aussage über den Inhalt. Dafür sind die Prüftore da.
#
# DAS BACKUP-TOR STEHT IN `tools/kette/tor.py` und nicht hier (E-P5a-12).
# Eine Bedingung, die einen Deploy verhindern soll, gehört dorthin, wo eine
# `--selbstprobe` sie nachweisen kann — genau das verlangt die Abnahme von
# AP1. Fünf Lagen prüft sie, darunter „meldet nie fertig" und „Stand ist von
# gestern".
#
# ROLLBACK ist ein Lauf mit dem vorigen Tag (E-PV-3 (d)). Deshalb trägt der
# Tag die Fassung und nicht die Uhrzeit.
#
# WER DIESEN LAUF UMBENENNT, LIEST `integritaet.yml`. Sie hängt per
# `workflow_run` am NAMEN dieses Laufs. Eine Umbenennung hier hängt sie ab —
# still, ohne Fehlermeldung (Fund F4 des Konzepts).
#
# ------------------------------------------------------------------------
# DIE DREI GEHEIMNISSE HEISSEN IN BEIDEN UMGEBUNGEN GLEICH
# ------------------------------------------------------------------------
#
# `FTP_SERVER`, `FTP_USERNAME`, `FTP_PASSWORD` — und die UMGEBUNG entscheidet,
# welcher Wert ankommt. Das ist die Bauart, fuer die es Umgebungen gibt, und
# sie hat einen Vorzug, den sprechende Namen nicht haben: **Ein Job kann die
# Zugangsdaten der falschen Seite nicht erwischen, weil es die anderen in
# seiner Umgebung gar nicht gibt.** Mit `NADOKU_STAGING_*` und
# `NADOKU_PRODUKTION_*` waere ein kopierter Job, der den falschen Praefix
# stehen laesst, ein Deploy auf die falsche Anlage — und niemand saehe es,
# bis er es sieht.
#
# SIE GEHOEREN AN DIE UMGEBUNG, NICHT AN DIE ORGANISATION. Ein
# Organisationsgeheimnis mit "All repositories" ist von jedem Arbeitslauf in
# jedem Repositorium der Organisation lesbar; die Pflichtfreigabe an
# `produktion` waere damit eine Formalie.
#
# DER RIEGEL UNTEN IST DER WICHTIGERE TEIL. GitHub setzt ein Geheimnis, das es
# nicht gibt, auf LEER und bricht nicht ab. Die FTPS-Aktion lief damit mit
# leerem Benutzernamen los und scheiterte erst an der Gegenstelle — mit einer
# Meldung ueber die Anmeldung, nicht ueber den fehlenden Eintrag. Wer den
# Namen eines Geheimnisses vertippt, sucht den Fehler dann beim Hoster.
#
# UND `FTP_SERVER` HEISST SO, WEIL DER WERT EIN HOSTNAME IST. Ein Feld namens
# `..._URL` laedt dazu ein, `ftps://…/staging` einzutragen; die Aktion setzt
# den Wert unveraendert als Server ein, und die Namensaufloesung gelingt nie.
# Der Riegel prueft es deshalb mit.

on:
  push:
    branches: [ main ]
    tags: [ 'web-v*' ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  staging:
    name: staging
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Sind die drei Geheimnisse der Umgebung `staging` da?
        # Siehe Kopf: ein fehlendes Geheimnis ist LEER, nicht rot.
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # AUSGESCHRIEBENE `if`-BLOECKE UND KEINE `&&`-KETTEN. Unter `set -e`,
          # und GitHub setzt es, ist `[ -z "$X" ] && y=1` als LETZTE Zeile eines
          # Skripts ein Abbruch mit Code 1, sobald die Bedingung nicht zutrifft
          # — also genau dann, wenn alles in Ordnung ist. Die Falle ist bekannt
          # und kostet eine halbe Stunde; drei Zeilen mehr kosten nichts.
          fehlt=""
          if [ -z "${FTP_SERVER:-}" ];   then fehlt="$fehlt FTP_SERVER"; fi
          if [ -z "${FTP_USERNAME:-}" ]; then fehlt="$fehlt FTP_USERNAME"; fi
          if [ -z "${FTP_PASSWORD:-}" ]; then fehlt="$fehlt FTP_PASSWORD"; fi
          if [ -n "$fehlt" ]; then
            echo "::error::Umgebung staging: es fehlt$fehlt. Sie gehoeren als ENVIRONMENT SECRETS an die Umgebung, nicht als Repositoriums- oder Organisationsgeheimnis."
            exit 1
          fi
          # Der Wert ist ein HOSTNAME, keine Adresse. Die FTPS-Aktion setzt ihn
          # unveraendert als Server ein; ein `ftps://` davor, ein Pfad dahinter
          # oder ein `:21` am Ende (die Aktion hat `port:` getrennt) ergibt eine
          # Namensaufloesung, die nie gelingt — und eine Fehlermeldung ueber die
          # Anmeldung statt ueber den Eintrag.
          case "$FTP_SERVER" in
            *://*|*/*|*:*)
              echo "::error::FTP_SERVER traegt ein Schema, einen Pfad oder einen Port. Erwartet wird der blosse Hostname, z. B. ftp.example.de."
              exit 1 ;;
          esac
          echo "Drei Geheimnisse vorhanden; der Host sieht wie ein Hostname aus."

      - name: server/ per FTPS auf Staging synchronisieren
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          protocol:   ftps
          port:       21
          local-dir:  ./server/
          # Das Verzeichnis der Subdomain. Umgebungsvariable und kein
          # Geheimnis: Es ist ein Pfad, keine Zugangsberechtigung.
          server-dir: ${{ vars.FTP_ZIELPFAD || './staging/' }}
          # DIE ZUSTANDSDATEI GEHOERT NICHT IN DEN WEBROOT (Nr. 213).
          #
          # Ohne diese Zeile legt die Aktion `.ftp-deploy-sync-state.json`
          # in `server-dir` ab -- also dorthin, wo der Webserver ausliefert.
          # Darin steht je Datei Pfad, Groesse und Hash. Kein Geheimnis, aber
          # die ganze Struktur und der Versionsstand jeder einzelnen Datei.
          #
          # `../` HEBT SIE EINE EBENE HERAUS, und das geht nur, weil der
          # FTP-Zugang eine Ebene UEBER dem Webroot landet -- `server-dir`
          # sagt es selbst (`./staging/`). Erlaubt der Kaefig das nicht,
          # bricht die Auslieferung; dann traegt man `FTP_STATE_PFAD` als
          # Variable ein und zeigt wieder nach innen. Die Punktdatei-Sperre
          # in `server/.htaccess` faengt sie dort ab -- deshalb ist der
          # Rueckbau eine Variable und kein Notfall.
          #
          # ZWEI NAMEN, NICHT EINER: Teilen sich Staging und Produktion einen
          # FTP-Zugang, landeten beide Staende in derselben Datei und
          # ueberschrieben einander -- die Kette lieferte dann jedes Mal
          # alles neu aus oder, schlimmer, uebersaehe Aenderungen.
          state-name: ${{ vars.FTP_STATE_PFAD || '../.deploy-state-staging.json' }}
          # DIE AUSNAHMELISTE IST WORTGLEICH DIE DES ALTEN `deploy.yml` UND
          # BLEIBT ES. Jede Zeile hat eine Geschichte, und jede fehlende
          # Zeile hat eine teurere:
          #   config.php, install.lock   liegen nur auf dem Server
          #   sicherungen/               entstehen nur dort (A8.2)
          #   wartung.lock               der Schalter des Wartungsmodus
          #                              (E-S5W-02) — und der Deploy ist
          #                              genau das, was währenddessen läuft
          #   ueberlast.json             der Zähler der Verbindungsgrenze
          #                              (P5a/AP9, E-P5a-50) — ein Zustand
          #                              dieser Installation, kein Quelltext
          #   apk/                       die Android-Pakete (E-S4-16)
          # sicherungen/ und apk/ stehen zweimal, weil die Aktion Datei- und
          # Verzeichnismuster getrennt prüft.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            config.php
            install.lock
            wartung.lock
            ueberlast.json
            sicherungen/**
            sicherungen/
            apk/**
            apk/

  stufe2:
    name: Prüfung Stufe 2
    needs: staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_URL:   ${{ vars.STAGING_URL }}
      STAGING_KONTO: ${{ secrets.STAGING_KONTO }}
      STAGING_PASS:  ${{ secrets.STAGING_PASS }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Antwortet Staging wie eine eingerichtete Installation?
        # SEIT DEM 16.09.2026, UND ZWAR AUS EINEM KONKRETEN ANLASS: Solange
        # `STAGING_KONTO` leer war, uebersprangen die beiden Schritte unten
        # und sagten es. Sobald das Geheimnis eingetragen ist — und es wird
        # eingetragen, BEVOR die Anlage steht —, greift der Zweig nicht mehr,
        # und die Kreislaeufe laufen gegen eine Adresse, die noch nichts
        # ausliefert. Sie scheitern dann mit einem Python-Rueckverfolg ueber
        # eine fehlende Anmeldeseite, und niemand liest daraus, dass schlicht
        # `install.php` noch nicht gelaufen ist.
        #
        # ER UEBERSPRINGT NICHT, ER BRICHT AB. Ein Stand, der auf Staging
        # nicht laeuft, ist nicht freigabefaehig — das ist die Aussage von
        # Stufe 2, und sie soll rot sein. Neu ist nur, dass sie sagt, WARUM.
        #
        # ER FRAGT `login.php` UND NICHT `/`. Eine frische Subdomain liefert
        # beim Hoster eine „Domain Default page" mit HTTP 200 aus — gemessen
        # am 16.09.2026 an `staging.nadoku.gen-em.org`. Wer nur den Code
        # prueft, haelt eine leere Subdomain fuer eine laufende Anwendung.
        # Derselbe Griff faengt den teuersten Einrichtungsfehler mit:
        # **ein falscher `FTP_ZIELPFAD`.** Liegen die Dateien im falschen
        # Verzeichnis, gibt es dort keine `login.php`, und das faellt hier auf
        # und nicht erst, wenn jemand die fremde Seite sucht.
        run: |
          if [ -z "${STAGING_URL:-}" ]; then
            echo "::warning::STAGING_URL fehlt — Stufe 2 ÜBERSPRUNGEN, nicht gemessen."
            echo '**Stufe 2: ÜBERSPRUNGEN** (keine STAGING_URL) — nicht gemessen.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          antwort=$(curl -sS -o /tmp/staging-login.html -L --max-time 30 \
                         -w '%{http_code} %{url_effective}' "$STAGING_URL/login.php" || echo '000 -')
          code=${antwort%% *}
          ziel=${antwort#* }
          echo "login.php: HTTP $code · gelandet bei $ziel"
          case "$ziel" in
            *install.php*)
              echo "::error::Die Dateien liegen oben, die Anlage ist aber noch nicht eingerichtet — der Aufruf landet auf install.php. Rahmenplan 6a, Schritte 6 bis 8."
              exit 1 ;;
          esac
          if [ "$code" = "000" ]; then
            echo "::error::$STAGING_URL antwortet nicht. Steht die Subdomain schon? (Rahmenplan 6a, Schritte 1 bis 3.)"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::$STAGING_URL/login.php antwortet mit $code. Bei 404 liegen die Dateien im falschen Verzeichnis — FTP_ZIELPFAD prüfen (Rahmenplan 6a, Schritt 4)."
            exit 1
          fi
          if ! grep -q 'AGPL-3.0' /tmp/staging-login.html; then
            echo "::error::Unter $STAGING_URL/login.php antwortet etwas, das nicht nach dieser Anwendung aussieht (die Fusszeile fehlt). Eine leere Subdomain liefert beim Hoster eine Standardseite mit 200 aus."
            exit 1
          fi
          echo "Staging liefert die Anmeldeseite der Anwendung aus."

      - name: Punktdateien gesperrt, .well-known offen?
        # WARUM DIESER SCHRITT ES BEWEIST UND EIN BLOSSER 404 ES NICHT TAT
        # (Nr. 213, 16.09.2026).
        #
        # `RewriteRule ... [F]` antwortet **403, ob die Datei da ist oder
        # nicht** -- mod_rewrite laeuft vor der Dateisuche. Genau daran
        # haengt die Aussagekraft: Ein 404 hiesse nur „dort liegt nichts"
        # und wuerde auch von einer leeren Subdomain kommen. Der Befund, der
        # diesen Schritt ausgeloest hat, wurde zuerst genau so
        # fehlgedeutet -- die Abfrage gegen ein noch leeres Staging gab 404,
        # und das sah nach Entwarnung aus.
        #
        # DIE ZWEITE ZEILE IST DIE WICHTIGERE. `.well-known/` traegt die
        # ACME-Herausforderung. Antwortet sie 403, ist die
        # Zertifikatserneuerung tot -- und zwar lautlos, bis das Zertifikat
        # in bis zu 90 Tagen ablaeuft. Diese Pruefung ist das einzige, was
        # zwischen einer zu breiten Sperre und einer abgelaufenen Anlage
        # steht.
        run: |
          if [ -z "${STAGING_URL:-}" ]; then
            echo "::warning::STAGING_URL fehlt — Punktdatei-Prüfung ÜBERSPRUNGEN, nicht gemessen."
            echo '**Punktdateien: ÜBERSPRUNGEN** (keine STAGING_URL) — nicht gemessen.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          fehler=0

          for pfad in ".ftp-deploy-sync-state.json" ".deploy-state-staging.json" ".env" ".git/config"; do
            code=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "$STAGING_URL/$pfad" || echo '000')
            echo "  /$pfad → HTTP $code"
            if [ "$code" != "403" ]; then
              echo "::error::/$pfad antwortet $code statt 403. Die Punktdatei-Sperre in server/.htaccess greift nicht — liest dieser Webserver .htaccess überhaupt? Ein 404 ist KEINE Entwarnung: er kommt auch von einer leeren Adresse."
              fehler=1
            fi
          done

          wk=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' \
                    "$STAGING_URL/.well-known/acme-challenge/kettenpruefung" || echo '000')
          echo "  /.well-known/acme-challenge/kettenpruefung → HTTP $wk (erwartet 404, NICHT 403)"
          if [ "$wk" = "403" ]; then
            echo "::error::.well-known/ ist mitgesperrt. Die Zertifikatserneuerung (ACME) schlägt damit fehl, und zwar lautlos bis zum Ablauf. Die Ausnahme (?!well-known/) in server/.htaccess prüfen."
            fehler=1
          fi

          if [ "$fehler" != "0" ]; then exit 1; fi
          {
            echo '**Punktdateien:** 4 Pfade → 403 (gesperrt), `.well-known/acme-challenge/` → '"$wk"' (offen).'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Punktdateien gesperrt, .well-known offen."

      - name: Kreisläufe csv und edbak gegen Staging
        # BRAUCHT EIN PRÜFKONTO auf Staging (Umgebungsgeheimnis). Fehlt es,
        # wird der Schritt ÜBERSPRUNGEN UND GESAGT — ein Lauf, der ohne
        # Zugangsdaten grün meldet, hat nichts gemessen (`CLAUDE.md` 6).
        run: |
          if [ -z "${STAGING_URL:-}" ] || [ -z "${STAGING_KONTO:-}" ]; then
            echo "::warning::Prüfkonto auf Staging fehlt — Kreisläufe ÜBERSPRUNGEN, nicht gemessen."
            echo '**Kreisläufe: ÜBERSPRUNGEN** (kein Prüfkonto) — nicht gemessen.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pip -q install cffi cryptography
          python3 tools/referenzdatensatz/vergleich/kreislauf.py \
                  --basis "$STAGING_URL" --konto "$STAGING_KONTO" --passwort "$STAGING_PASS"

      - name: Bilderlauf gegen Staging
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: |
          if [ -z "${STAGING_URL:-}" ] || [ -z "${STAGING_KONTO:-}" ]; then
            echo "::warning::Prüfkonto auf Staging fehlt — Bilderlauf ÜBERSPRUNGEN, nicht gemessen."
            echo '**Bilderlauf: ÜBERSPRUNGEN** (kein Prüfkonto) — nicht gemessen.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes playwright@1.56 install chromium
          node tools/screenshots/aufnehmen.mjs \
               --basis "$STAGING_URL" --konto "$STAGING_KONTO" --passwort "$STAGING_PASS"

      # DER MESSSTAND STAND HIER UND KONNTE NIE LAUFEN (Backlog Nr. 206,
      # behoben in P5a/AP9, E-P5a-53).
      #
      # Der Schritt rief `serverprobe.py --basis "$STAGING_URL"` auf. Diese
      # Kennzeichnung gibt es nicht — `serverprobe.py` kennt `--konto`,
      # `--ausgabe`, `--wartung-fahren` und `--optimieren` —, also wäre jeder
      # Tag-Lauf hier mit „unrecognized arguments" abgebrochen. Und die
      # Kennzeichnung fehlt nicht aus Versehen: Die Serverprobe misst
      # TABELLENGRÖSSEN, SPEICHERSPITZEN und den Waisen-Vollscan, und dafür
      # braucht sie die Datenbank selbst. Über HTTP ist davon nichts zu
      # sehen. Eine Adresse als Ziel war ein Denkfehler, kein Tippfehler.
      #
      # Ersatzlos gestrichen und nicht ersetzt: Der Messstand ist ein
      # MANUELLES Regressionsmittel (R35) und läuft lokal vor einer
      # Auslieferung, nicht in der Kette. Seine Zahlen stehen in
      # `tools/messstand/ausgangsmessung.md`, und was von ihnen auf der
      # Zielanlage gilt, steht dort auf der Plattformkarte
      # (Betrieb → Status → Plattform, seit P5a/AP2) — einschließlich
      # `post_max_size`, der Zahl, um die es in Backlog Nr. 37 geht.
      - name: Messstand — wo seine Zahlen stehen
        if: startsWith(github.ref, 'refs/tags/web-v')
        run: |
          {
            echo '**Messstand: läuft nicht in der Kette** — er misst die Datenbank'
            echo 'selbst (Tabellengrößen, Speicherspitzen) und ist über HTTP nicht'
            echo 'zu haben. Er ist ein manuelles Regressionsmittel (R35); seine'
            echo 'Zahlen stehen in `tools/messstand/ausgangsmessung.md`, die Grenzen'
            echo 'der Zielanlage auf Betrieb → Status → Plattform.'
          } >> "$GITHUB_STEP_SUMMARY"

  produktion:
    name: produktion
    if: startsWith(github.ref, 'refs/tags/web-v')
    runs-on: ubuntu-latest
    # DIE UMGEBUNG IST DAS TOR. Pflichtfreigabe durch die Betreiberin (T1 aus
    # E-PV-3); die FTPS-Zugangsdaten und JOBS_TOKEN sind ihre Geheimnisse und
    # stehen nicht mehr als Repositoriums-Secrets herum.
    environment: produktion
    env:
      BASIS:      ${{ vars.PRODUKTION_URL }}
      JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Sind die drei Geheimnisse der Umgebung `produktion` da?
        # HIER WIEGT ER SCHWERER ALS AUF STAGING, UND DESHALB STEHT ER GANZ
        # OBEN: Weiter unten haette der Lauf schon das Komplett-Backup
        # angestossen und die Wartung EINGESCHALTET. Braeche er dann an der
        # FTPS-Anmeldung ab, staende die Anwendung zu, und jemand muesste
        # sie von Hand wieder aufmachen — wegen eines vertippten Namens.
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # AUSGESCHRIEBENE `if`-BLOECKE UND KEINE `&&`-KETTEN. Unter `set -e`,
          # und GitHub setzt es, ist `[ -z "$X" ] && y=1` als LETZTE Zeile eines
          # Skripts ein Abbruch mit Code 1, sobald die Bedingung nicht zutrifft
          # — also genau dann, wenn alles in Ordnung ist. Die Falle ist bekannt
          # und kostet eine halbe Stunde; drei Zeilen mehr kosten nichts.
          fehlt=""
          if [ -z "${FTP_SERVER:-}" ];   then fehlt="$fehlt FTP_SERVER"; fi
          if [ -z "${FTP_USERNAME:-}" ]; then fehlt="$fehlt FTP_USERNAME"; fi
          if [ -z "${FTP_PASSWORD:-}" ]; then fehlt="$fehlt FTP_PASSWORD"; fi
          if [ -n "$fehlt" ]; then
            echo "::error::Umgebung produktion: es fehlt$fehlt. Sie gehoeren als ENVIRONMENT SECRETS an die Umgebung, nicht als Repositoriums- oder Organisationsgeheimnis."
            exit 1
          fi
          # Der Wert ist ein HOSTNAME, keine Adresse. Die FTPS-Aktion setzt ihn
          # unveraendert als Server ein; ein `ftps://` davor, ein Pfad dahinter
          # oder ein `:21` am Ende (die Aktion hat `port:` getrennt) ergibt eine
          # Namensaufloesung, die nie gelingt — und eine Fehlermeldung ueber die
          # Anmeldung statt ueber den Eintrag.
          case "$FTP_SERVER" in
            *://*|*/*|*:*)
              echo "::error::FTP_SERVER traegt ein Schema, einen Pfad oder einen Port. Erwartet wird der blosse Hostname, z. B. ftp.example.de."
              exit 1 ;;
          esac
          echo "Drei Geheimnisse vorhanden; der Host sieht wie ein Hostname aus."

      - name: Tag gegen WEB_VERSION halten
        # F-P5a-1: Der Tag heisst `web-vX.Y.Z` und ist gleich `WEB_VERSION`.
        # Eine Auslieferung, deren Tag etwas anderes sagt als die Fusszeile
        # der ausgelieferten Anwendung, ist beim nächsten Rollback ein Rätsel.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ver=$(php -r "require 'server/version.php'; echo WEB_VERSION;")
          echo "Tag: $tag · WEB_VERSION: $ver"
          if [ "$tag" != "web-v$ver" ]; then
            echo "::error::Tag $tag passt nicht zu WEB_VERSION $ver (erwartet web-v$ver)."
            exit 1
          fi

      - name: Grüner Staging- und Stufe-1-Lauf auf diesem Stand?
        # Ein Tag darf nur ausliefern, was auf Staging schon stand und dort
        # grün war (E-P5a-13). Gefragt wird nach dem COMMIT, nicht nach dem
        # Zweig: Ein Tag kann auf einem Stand sitzen, der nie auf `main` war.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${GITHUB_SHA}"
          echo "Commit: $sha"
          pruef=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pruefung.yml/runs?head_sha=$sha&status=success" \
                   --jq '.workflow_runs | length' 2>/dev/null || echo 0)
          stg=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/auslieferung.yml/runs?head_sha=$sha&status=success" \
                   --jq '[.workflow_runs[] | select(.event == "push")] | length' 2>/dev/null || echo 0)
          echo "Grüne Stufe-1-Läufe auf diesem Commit: $pruef"
          echo "Grüne Staging-Läufe auf diesem Commit:  $stg"
          if [ "$pruef" -lt 1 ]; then
            echo "::error::Kein grüner Stufe-1-Lauf auf $sha — dieser Stand ist nicht freigabefähig."
            exit 1
          fi
          if [ "$stg" -lt 1 ]; then
            echo "::error::Kein grüner Staging-Lauf auf $sha — dieser Stand stand nie auf Staging."
            exit 1
          fi

      - name: Backup-Tor — Komplett-Backup zu Ende laufen lassen
        # Erst die Selbstprobe, dann das Tor: Ein Tor, das immer aufgeht,
        # sieht von aussen aus wie eines, das geprüft hat.
        run: |
          python3 tools/kette/tor.py --selbstprobe
          python3 tools/kette/tor.py backup --basis "$BASIS" --token "$JOBS_TOKEN"

      - name: Wartung einschalten
        run: python3 tools/kette/tor.py wartung-an --basis "$BASIS" --token "$JOBS_TOKEN"

      - name: server/ per FTPS auf Produktiv synchronisieren
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          protocol:   ftps
          port:       21
          local-dir:  ./server/
          server-dir: ${{ vars.FTP_ZIELPFAD || './httpdocs/' }}
          # Wie im Staging-Job (Nr. 213) — Begründung steht dort. Der
          # Dateiname ist ein anderer, und genau darauf kommt es an.
          state-name: ${{ vars.FTP_STATE_PFAD || '../.deploy-state-produktion.json' }}
          # Wortgleich wie im Staging-Job — Begründung steht dort.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            config.php
            install.lock
            wartung.lock
            ueberlast.json
            sicherungen/**
            sicherungen/
            apk/**
            apk/

      - name: Zustand — Migration ausstehend?
        # R66 SAGT: KEIN SELBST-UPDATE. Die Installation ändert ihren Code nie
        # selbst, und sie fährt auch keine Migration von selbst. Steht eine
        # aus, BLEIBT DIE WARTUNG AN und der Lauf endet GRÜN mit dem Hinweis —
        # grün, weil das Ausliefern gelungen ist; der Hinweis, weil jetzt ein
        # Mensch an der Reihe ist. Ein roter Lauf sagte hier etwas Falsches.
        run: |
          python3 tools/kette/tor.py zustand --basis "$BASIS" --token "$JOBS_TOKEN"
          offen=$(python3 tools/kette/tor.py zustand --basis "$BASIS" --token "$JOBS_TOKEN" --frage migration)
          echo "Migration ausstehend: $offen"
          if [ "$offen" = ja ]; then
            echo "::warning::Migration ausstehend — die Wartung BLEIBT AN."
            {
              echo '## Migration ausstehend'
              echo
              echo 'Die Dateien sind oben, die Wartung ist **an** und bleibt es.'
              echo 'Jetzt von Hand: **Betrieb → Updates** öffnen, die ausstehenden'
              echo 'Migrationen ausführen, danach dort **Wartung beenden**.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 tools/kette/tor.py wartung-aus --basis "$BASIS" --token "$JOBS_TOKEN"
          echo 'Keine Migration ausstehend — Wartung wieder aus.' >> "$GITHUB_STEP_SUMMARY"
