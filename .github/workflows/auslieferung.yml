name: Auslieferung

# Der Name ist eine Kupplung: `integritaet.yml` hängt per `workflow_run` an
# „Auslieferung“, und eine Umbenennung hängt die Wache still ab.

on:
  # Kein `paths`-Filter: Das Tor verlangt einen grünen Lauf auf genau dem
  # getaggten Commit, und auch `docs/` geht hinaus (als `server/doku/`).
  push:
    branches: [ main ]
    tags: [ 'web-v*', 'android-v*', 'uhr-v*' ]
  workflow_dispatch:
    inputs:
      probelauf:
        description: >-
          PROBELAUF — nichts ausliefern, nur den Weg messen (E-KH-08).
          Fährt `produktion` mit Pflichtfreigabe, aber ohne Tag-Vergleich,
          ohne Backup, ohne Wartung und ohne Schreiben außer der Probedatei;
          der Abgleich läuft als Trockenlauf.
        type: boolean
        default: false
      probelauf_ohne_sitzung:
        description: >-
          Nur zusammen mit PROBELAUF: die Zielprobe OHNE Wiederverwendung der
          TLS-Sitzung auf dem Datenkanal fahren. Das ist der Trennversuch zu
          F3 — gelingt der Lauf MIT und scheitert er OHNE, verlangt der Server
          die Wiederverwendung. Im Normalbetrieb bleibt dies aus.
        type: boolean
        default: false
      probelauf_mengenprobe:
        description: >-
          Nur zusammen mit PROBELAUF: statt der beiden Rundläufe eine
          MENGENPROBE mit dieser Zahl Verzeichnissen (1–500, leer = aus).
          Sie legt sie in EINER FTP-Sitzung an — die Nachstellung dessen, was
          die Auslieferungsaktion tut (688 Dateien, 62 Verzeichnisse in einer
          Sitzung). Die Zielprobe kann das bauartbedingt nicht messen: Sie
          ruft `curl` je Operation einmal auf. Empfehlung für den ersten
          Versuch: 80.
        type: string
        default: ""
      probelauf_sitzungsprobe:
        description: >-
          Nur zusammen mit PROBELAUF: statt der beiden Rundläufe eine
          SITZUNGSPROBE — abrufen und DANACH einen Steuerbefehl absetzen, in
          DERSELBEN FTP-Sitzung. Das ist die Reihenfolge, in der die
          Auslieferungsaktion stirbt (F-KH-U-23): Sie holt ihre Zustandsdatei
          über den Datenkanal und setzt danach `MKD` ab. Ein Reset dazwischen
          ist im Trockenlauf unsichtbar, weil danach kein Steuerbefehl mehr
          kommt. Schreibt nur die Probedatei und räumt sie wieder weg.
        type: boolean
        default: false
      probelauf_gespraech:
        description: >-
          Nur zusammen mit PROBELAUF: GESPRÄCHSLAUF. Die Auslieferungsaktion
          läuft ECHT (kein Trockenlauf) und schreibt ihren FTP-Dialog mit
          (log-level verbose) — aber in ein gesperrtes Probeverzeichnis
          `.zielprobe-gespraech/` und NICHT in den Webroot. Sie erreicht damit
          `ensureDir` und stirbt voraussichtlich dort; diesmal steht im
          Protokoll, bei welchem Befehl und mit welcher Serverantwort. Die
          Anwendung bleibt unberührt — kein Wartungsmodus, kein halber Stand.
          ACHTUNG: Das Probeverzeichnis bleibt danach stehen und wird VON HAND
          entfernt (Prüfdokument, Prüfpunkt 18a).
        type: boolean
        default: false
      app_probelauf:
        description: >-
          APP-PROBELAUF (PK-08) — `android` oder `uhr` bauen und signieren,
          hinter der Pflichtfreigabe, aber NICHTS ablegen: Die APK-Ablage
          nennt nur, was sie ablegen und löschen würde. `aus` ist der
          gewöhnliche Lauf.
        type: choice
        options: [ aus, android, uhr ]
        default: aus

permissions:
  contents: read
  # Braucht `ausliefern-lauf.yml` (Tor der grünen Läufe); ein aufgerufener Lauf
  # bekommt nie mehr Rechte als sein Aufrufer.
  actions: read

# Ein Lauf je Gruppe — Web-Tag, Android, Uhr, sonst Staging; ein Web-Probelauf
# teilt die Gruppe mit Staging —, wartend statt abbrechend (ein Abbruch ließe
# einen halben Stand bei Wartung oder eine stehende Jobpause zurück); GitHub
# hält je Gruppe nur einen wartenden Lauf. Die Apps haben eigene Gruppen, weil
# ein Lauf, der auf die Freigabe wartet, seine Gruppe so lange belegt.
concurrency:
  group: >-
    auslieferung-${{
      (startsWith(github.ref, 'refs/tags/android-v') || inputs.app_probelauf == 'android') && 'android'
      || (startsWith(github.ref, 'refs/tags/uhr-v') || inputs.app_probelauf == 'uhr') && 'uhr'
      || startsWith(github.ref, 'refs/tags/') && 'produktion'
      || 'staging' }}
  cancel-in-progress: false

# GitHub fährt `run:` ohne `pipefail` — eine Pipe meldet dann nur ihr letztes
# Glied, und `prüfe | tee datei` kann nie rot werden.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  staging:
    name: staging
    # Beide Probeläufe gehören dazu: Sie fahren ohne Tag und lieferten sonst
    # nach Staging aus, samt Wartung und Komplett-Backup.
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.probelauf && (inputs.app_probelauf || 'aus') == 'aus' }}
    uses: ./.github/workflows/ausliefern-lauf.yml
    with:
      umgebung: staging
    secrets: inherit
  stufe2:
    name: Prüfung Stufe 2
    needs: staging
    # Wieder auf 26.04 wie alle Jobs (Nr. 236), seit Nr. 393. Vom 20.10.2026
    # an lief dieser Job als einziger auf 24.04 (F-DM-13): Playwright 1.56
    # kannte 26.04 nicht und lud die WebKit-Fassung für 24.04, die gegen
    # `libicuuc.so.74`, `libxml2.so.2`, `libvpx.so.9` und `libx264` gebaut
    # ist — Bibliotheken, die es auf 26.04 unter keinem Namen gibt. Seit 1.63
    # führt Playwright 26.04 als eigene Plattform mit eigener Paketliste und
    # eigenem WebKit-Build; Firefox lädt dort nach Playwrights eigener
    # Zuordnung den Build für 24.04.
    runs-on: ubuntu-26.04
    # Ohne Zeitgrenze liefe ein hängender Job sechs Stunden, und so lange wartet
    # jeder weitere Lauf dieser Umgebung in seiner Gruppe. 40 statt 20 seit
    # R87: Kreislauf und Rückwegprobe laufen dreimal (am 19.10.2026 in
    # Chromium allein 49 s und 144 s), dazu zwei Engines samt Bibliotheken.
    timeout-minutes: 40
    environment: staging
    # GitHub setzt ein fehlendes Geheimnis still auf leer — deshalb prüfen die
    # Schritte ihre Werte mit `-z`, bevor sie sie benutzen.
    env:
      STAGING_URL:   ${{ vars.STAGING_URL }}
      STAGING_KONTO: ${{ secrets.STAGING_KONTO }}
      STAGING_PASS:  ${{ secrets.STAGING_PASS }}
      STAGING_TOTP:  ${{ secrets.STAGING_TOTP }}
      JOBS_TOKEN:    ${{ secrets.JOBS_TOKEN }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Antwortet Staging wie eine eingerichtete Installation?
        # Gefragt wird `login.php` samt Fußzeile, nicht `/`: Eine leere
        # Subdomain liefert beim Hoster eine Standardseite mit HTTP 200.
        run: |
          if [ -z "${STAGING_URL:-}" ]; then
            echo "::error::STAGING_URL fehlt — Stufe 2 kann nicht messen, und ÜBERSPRINGEN IST SEIT AP6 ROT (B5, E-KH-12). Eintragen unter Settings -> Environments -> staging -> Variables."
            echo '**Stufe 2: NICHT GEMESSEN** (keine `STAGING_URL`) — der Lauf ist deshalb rot.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          antwort=$(curl -sS -o /tmp/staging-login.html -L --max-time 30 \
                         -w '%{http_code} %{url_effective}' "$STAGING_URL/login.php" || echo '000 -')
          code=${antwort%% *}
          ziel=${antwort#* }
          echo "login.php: HTTP $code · gelandet bei $ziel"
          case "$ziel" in
            *install.php*)
              icode=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "$STAGING_URL/install.php" || echo '000')
              if [ "$icode" = "404" ]; then
                echo "::error::Die Anlage ist noch nicht eingerichtet, und install.php liegt nicht oben — sie steht seit Nr. 214 in der Ausnahmeliste und wird bewusst NICHT ausgeliefert. Für eine leere Anlage die Datei server/install.php EINMAL von Hand per FTP hochladen, einrichten, danach wieder löschen. Rahmenplan 6a, Schritte 6 bis 8."
              else
                echo "::error::Die Dateien liegen oben, die Anlage ist aber noch nicht eingerichtet — der Aufruf landet auf install.php (HTTP $icode). Rahmenplan 6a, Schritte 6 bis 8."
              fi
              exit 1 ;;
          esac
          if [ "$code" = "000" ]; then
            echo "::error::$STAGING_URL antwortet nicht. Steht die Subdomain schon? (Rahmenplan 6a, Schritte 1 bis 3.)"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::$STAGING_URL/login.php antwortet mit $code. Bei 404 liegen die Dateien im falschen Verzeichnis — FTP_ZIELPFAD prüfen (Rahmenplan 6a, Schritt 4)."
            exit 1
          fi
          if ! grep -q 'AGPL-3.0' /tmp/staging-login.html; then
            echo "::error::Unter $STAGING_URL/login.php antwortet etwas, das nicht nach dieser Anwendung aussieht (die Fusszeile fehlt). Eine leere Subdomain liefert beim Hoster eine Standardseite mit 200 aus."
            exit 1
          fi
          echo "Staging liefert die Anmeldeseite der Anwendung aus."

      - name: Punktdateien gesperrt, .well-known offen?
        # Seit R17-19 EINE Stelle für Staging und Produktiv: Teil 3 der
        # Integritätswache (F-R17-18). Bis dahin stand die Prüfung hier als
        # Bash, und gegen Produktiv lief sie nie. Erwartet: Punktpfade 403
        # (nicht 404 — die Sperre greift vor der Dateisuche), `.well-known/`
        # nicht 403, keine Kopie der `config.php` mit 200.
        run: |
          if [ -z "${STAGING_URL:-}" ]; then
            echo "::error::STAGING_URL fehlt — die Punktdatei-Prüfung kann nicht messen, und ÜBERSPRINGEN IST SEIT AP6 ROT (B5, E-KH-12). Eintragen unter Settings -> Environments -> staging -> Variables."
            echo '**Punktdateien: NICHT GEMESSEN** (keine `STAGING_URL`) — der Lauf ist deshalb rot.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 tools/integritaetswache/wache.py --selbstprobe > /dev/null
          rc=0
          python3 tools/integritaetswache/wache.py "$STAGING_URL" --teil punktpfade \
            > /tmp/punktpfade.txt 2>&1 || rc=$?
          cat /tmp/punktpfade.txt
          {
            echo '**Punktdateien (Staging):**'
            grep -E '^  Teil 3' /tmp/punktpfade.txt | sed 's/^ *//' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Kreislauf edbak gegen Staging
        run: |
          if [ -z "${STAGING_URL:-}" ] || [ -z "${STAGING_KONTO:-}" ] || [ -z "${STAGING_PASS:-}" ]; then
            echo "::error::Prüfkonto auf Staging fehlt — der Kreislauf kann nicht messen, und ÜBERSPRINGEN IST SEIT AP6 ROT (B5, E-KH-12). Erwartet werden STAGING_KONTO und STAGING_PASS in der Umgebung staging."
            echo '**Kreislauf: NICHT GEMESSEN** (kein Prüfkonto) — der Lauf ist deshalb rot.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "${STAGING_TOTP:-}" ]; then
            echo "::error::STAGING_TOTP fehlt — das Prüfkonto hat Verwaltungsrechte und damit einen Pflicht-Zweitfaktor (P5c/AP5). Ohne das Geheimnis kommt der Kreislauf nicht über den Code-Schritt, und ÜBERSPRINGEN IST ROT (E-KH-12). Das Geheimnis zeigt das Einrichtungstor auf Staging (Base32)."
            echo '**Kreislauf: NICHT GEMESSEN** (kein `STAGING_TOTP`) — der Lauf ist deshalb rot.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "${JOBS_TOKEN:-}" ]; then
            echo "::error::JOBS_TOKEN der Umgebung staging fehlt — der Kreislauf kann nicht messen, und ÜBERSPRINGEN IST SEIT AP6 ROT (B5, E-KH-12). Gemeint ist das Kettentoken: auf Staging unter Betrieb -> Hintergrundjobs, Karte Auslieferungskette (nicht Ausloeser)."
            echo '**Kreislauf: NICHT GEMESSEN** (kein `JOBS_TOKEN`) — der Lauf ist deshalb rot. Gemeint ist das Kettentoken: auf Staging unter Betrieb → Hintergrundjobs, Karte „Auslieferungskette“.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # FESTE FASSUNGEN MIT HASHES (R17-19, F-R17-20). Bis dahin
          # `pip -q install cffi cryptography` und `npm install playwright@…`
          # — die Fassung des Tages, in einem Job mit Staging-Passwort,
          # `STAGING_TOTP` und `JOBS_TOKEN`. Jetzt prüft pip jede Datei gegen
          # ihren SHA-256 und npm gegen die Integritätswerte der Sperrdatei.
          # `--ignore-installed`: Bringt das Abbild eine Fassung per apt mit,
          # kann pip sie nicht deinstallieren (kein RECORD) und bräche ab; so
          # liegt die gepinnte daneben und gewinnt. `--only-binary :all:`
          # (Gegenprüfung R17-19): Ohne Rad baute pip aus dem Quellstand, und
          # dessen Build-Abhängigkeiten prüft `--require-hashes` nicht.
          pip -q install --require-hashes --only-binary :all: --ignore-installed -r tools/kette/stufe2-anforderungen.txt
          # DIE FASSUNG STEHT EINMAL, in `tools/sandbox/aufbauen.sh` (Nr. 393):
          # Stufe 2 muss dieselben Engines messen wie der Prüfstand. Die
          # Sperrdatei trägt dieselbe Zahl ein zweites Mal — mit den
          # Integritätswerten, die eine Fassungszeile nicht hat. Gehen beide
          # auseinander, ist der Schritt rot, statt still eine andere Fassung
          # zu messen (R17-19, nach dem Merge von Nr. 393).
          PW_FASSUNG=$(sed -n 's/^PW_FASSUNG="\([0-9.]*\)"$/\1/p' tools/sandbox/aufbauen.sh)
          [ -n "$PW_FASSUNG" ] \
            || { echo "::error::PW_FASSUNG nicht in tools/sandbox/aufbauen.sh gefunden"; exit 1; }
          PW_SPERRE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["packages"]["node_modules/playwright"]["version"])' \
                        tools/kette/stufe2-npm/package-lock.json)
          if [ "$PW_SPERRE" != "$PW_FASSUNG" ]; then
            echo "::error::Die Sperrdatei tools/kette/stufe2-npm/package-lock.json nennt Playwright $PW_SPERRE, aufbauen.sh $PW_FASSUNG — Sperrdatei neu erzeugen (tools/kette/LIESMICH.md)."
            exit 1
          fi
          echo "Playwright $PW_FASSUNG (Sperrdatei gleich)"
          # `--ignore-scripts`: Kein Paket der Sperrdatei braucht ein
          # Installationsskript; eines, das künftig dazukäme, liefe sonst mit
          # den Geheimnissen dieses Jobs.
          npm ci --prefix tools/kette/stufe2-npm --ignore-scripts --no-audit --no-fund --silent
          export PLAYWRIGHT_MODUL="$PWD/tools/kette/stufe2-npm/node_modules/playwright/index.mjs"
          [ -f "$PLAYWRIGHT_MODUL" ] \
            || { echo "::error::Playwright-Modul fehlt unter $PLAYWRIGHT_MODUL"; exit 1; }
          # DREI ENGINES (R87, Konzept DM/DM-04). Bis zum 19.10.2026 holte
          # dieser Schritt nur Chromium.
          #
          # Engines samt Systembibliotheken über `--with-deps`. Vom
          # 20.10.2026 an stand hier kurz eine Namensersetzung für Ubuntu
          # 26.04 (F-DM-12, Lauf 132 rot); sie konnte nicht tragen, weil
          # WebKit aus 1.56 die Bibliotheken von 24.04 in genau ihrer Fassung
          # braucht (F-DM-13). Seit Nr. 393 kennt Playwright 26.04 selbst.
          # Das Programm des Moduls aus der Sperrdatei, nicht `npx playwright@…`
          # — sonst zöge npx eine zweite Kopie ohne Integritätsprüfung
          # (F-R17-20). Über `.bin/`, nicht `node …/cli.js`: Der Riegel in
          # `tools/kettenaufrufe/` hielte einen Pfad unter `tools/` mit `.js`
          # für ein Werkzeug des Projekts, und das liegt erst nach `npm ci` da.
          tools/kette/stufe2-npm/node_modules/.bin/playwright install --with-deps chromium firefox webkit
          rot=""
          for motor in chromium firefox webkit; do
            for art in edbak; do
              echo "--- Kreislauf $art · $motor ---"
              MOTOR=$motor python3 tools/referenzdatensatz/vergleich/kreislauf.py \
                      --art "$art" --frisch \
                      --basis "$STAGING_URL" \
                      --admin-email "$STAGING_KONTO" \
                      --admin-passwort "$STAGING_PASS" \
                      --admin-totp "$STAGING_TOTP" \
                      --jobs-token "$JOBS_TOKEN" \
                || { echo "::error::Kreislauf $art gegen Staging in $motor gescheitert."; rot="$rot $motor"; }
            done
          done
          echo "**Kreislauf edbak:** chromium, firefox, webkit —${rot:- alle grün}${rot:+ rot in$rot}" >> "$GITHUB_STEP_SUMMARY"
          [ -z "$rot" ] || exit 1

      - name: Rückwegprobe gegen Staging
        # Lebt von den Installationen des Kreislaufs und steht deshalb dahinter;
        # `PLAYWRIGHT_MODUL` überlebt keinen Schritt und wird neu gesetzt.
        run: |
          if [ -z "${STAGING_URL:-}" ] || [ -z "${STAGING_KONTO:-}" ] || [ -z "${STAGING_PASS:-}" ] || [ -z "${STAGING_TOTP:-}" ]; then
            echo "::error::Prüfkonto, Passwort oder STAGING_TOTP fehlt — die Rückwegprobe kann nicht messen, und ÜBERSPRINGEN IST ROT (E-KH-12)."
            echo '**Rückwegprobe: NICHT GEMESSEN** — der Lauf ist deshalb rot.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          export PLAYWRIGHT_MODUL="$PWD/tools/kette/stufe2-npm/node_modules/playwright/index.mjs"
          [ -f "$PLAYWRIGHT_MODUL" ] \
            || { echo "::error::Playwright-Modul fehlt unter $PLAYWRIGHT_MODUL"; exit 1; }
          # Je Engine einmal (R87); `rueckweg/probe.mjs` liest MOTOR über
          # `tools/motor.mjs`.
          rot=""
          for motor in chromium firefox webkit; do
            echo "--- Rückwegprobe · $motor ---"
            MOTOR=$motor node tools/proben/rueckweg/probe.mjs --basis "$STAGING_URL" --admin "$STAGING_KONTO" \
                 --admin-pw "$STAGING_PASS" --admin-totp "$STAGING_TOTP" \
              || { echo "::error::Rückwegprobe gegen Staging in $motor gescheitert."; rot="$rot $motor"; }
          done
          echo "**Rückwegprobe:** chromium, firefox, webkit —${rot:- alle grün}${rot:+ rot in$rot}" >> "$GITHUB_STEP_SUMMARY"
          [ -z "$rot" ] || exit 1

      # Ein roter Schritt hier hält jeden Tag auf: Das Tor der grünen Läufe
      # verlangt den ganzen Auslieferungslauf grün, nicht nur `staging`.
      #
      # PLATZ FÜR NR. 234 — „Deploy, Anmeldung, `update.php`“ in einem Zug gegen
      # Staging (E-PK-21). Benannt und nicht gebaut; ein Schritt, der sich
      # selbst überspringt, meldete grün ohne Messung (`Pruefablauf.md` 8).

  produktion:
    name: produktion
    if: >-
      startsWith(github.ref, 'refs/tags/web-v')
      || inputs.probelauf
    # Die Pflichtfreigabe hängt am `environment:` in `ausliefern-lauf.yml`;
    # fehlt es dort, geht ein Tag ungefragt auf Produktiv (Probelauf zeigt es).
    uses: ./.github/workflows/ausliefern-lauf.yml
    with:
      umgebung: produktion
      probelauf:               ${{ inputs.probelauf               || false }}
      probelauf_ohne_sitzung:  ${{ inputs.probelauf_ohne_sitzung  || false }}
      probelauf_mengenprobe:   ${{ inputs.probelauf_mengenprobe   || '' }}
      probelauf_sitzungsprobe: ${{ inputs.probelauf_sitzungsprobe || false }}
      probelauf_gespraech:     ${{ inputs.probelauf_gespraech     || false }}
    secrets: inherit
  rueckfall:
    # Heißt nie `staging…`: Das Tor der grünen Läufe erkennt den Staging-Job am
    # Namen, und ein Tag-Lauf zählte sich sonst selbst als Nachweis.
    name: Rückfallstand (Staging)
    # `!inputs.probelauf` bleibt: Ein Komplett-Backup je Probelauf verdrängte
    # auf Staging still die Rückfallstände echter Auslieferungen.
    if: ${{ startsWith(github.ref, 'refs/tags/web-v') && !inputs.probelauf }}
    runs-on: ubuntu-26.04
    environment: staging
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Komplett-Backup auf Staging anstossen und zu Ende laufen lassen
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          JOBS_TOKEN:  ${{ secrets.JOBS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_URL:-}" ]; then
            echo "::error::Die Variable STAGING_URL ist leer. Ohne sie kann kein Rückfallstand auf Staging angelegt werden."
            exit 1
          fi
          if [ -z "${JOBS_TOKEN:-}" ]; then
            echo "::error::Das Geheimnis JOBS_TOKEN der Umgebung staging ist leer."
            exit 1
          fi
          python3 tools/kette/tor.py --selbstprobe
          python3 tools/kette/tor.py backup --basis "$STAGING_URL" --token "$JOBS_TOKEN"

      - name: Den Dateinamen neben den Tag schreiben
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          JOBS_TOKEN:  ${{ secrets.JOBS_TOKEN }}
        run: |
          set -euo pipefail
          # Eigene Zuweisung, damit `set -e` den Rückgabewert von `tor.py`
          # trägt; sonst stünde „unbekannt“ grün neben dem Tag.
          datei=$(python3 tools/kette/tor.py zustand --basis "$STAGING_URL" \
                    --token "$JOBS_TOKEN" --frage komplett)
          tag="${GITHUB_REF_NAME}"
          echo "Tag: $tag · Rückfallstand auf Staging: $datei"
          {
            echo "## Rückfallstand auf Staging"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Ausgeliefertes Tag | \`$tag\` |"
            echo "| Komplett-Stand auf Staging | \`$datei\` |"
            echo
            echo 'Diesen Stand braucht man, um **Staging auf den Stand des Tags'
            echo 'zurückzusetzen** — der Hinweg eines Hotfixes. Eingespielt wird er'
            echo 'von einer angemeldeten Administratorin über `wiederherstellen.php`;'
            echo 'die Kette setzt nichts aus der Ferne zurück (E-KH-16). Die'
            echo 'Schrittfolge steht im Runbook in `docs/Technik.md`.'
            echo
            echo '**Er wird verdrängt.** Staging bewahrt nur eine begrenzte Zahl'
            echo 'von Komplett-Ständen auf (Betrieb → Komplettsicherung →'
            echo '„Stände aufbewahren"). Wer diesen Stand in ein paar Tagen noch'
            echo 'braucht, lädt ihn jetzt herunter.'
          } >> "$GITHUB_STEP_SUMMARY"

  zeiger:
    name: zeiger
    needs: produktion
    # Auch ein Probelauf endet mit `success`: Jeder Weg ohne Auslieferung gehört
    # in diese Bedingung, sonst zeigt der Zeiger auf nie Ausgeliefertes.
    if: needs.produktion.result == 'success' && !inputs.probelauf
    runs-on: ubuntu-26.04
    # Nur dieser Job schreibt ins Repositorium; deshalb keine Fremd-Aktion außer
    # `checkout`, und `produktion` mit den FTPS-Geheimnissen bleibt bei `read`.
    permissions:
      contents: write
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Voll, weil ein flacher Checkout `origin/produktion` nicht kennt.
          fetch-depth: 0

      - name: Zeiger `produktion` auf diesen Stand setzen
        env:
          ZIEL: ${{ github.sha }}
        run: |
          # Zweiter Riegel neben dem `if` des Jobs: Wer die Bedingung erweitert
          # und diesen vergisst, bekommt Rot statt eines falschen Zeigers.
          if [ "${{ inputs.probelauf }}" = "true" ]; then
            echo "::error::Der Zeiger wird im PROBELAUF NICHT bewegt — es ist nichts ausgeliefert worden. Dass dieser Schritt überhaupt läuft, heißt: die Bedingung des Jobs ist kaputt."
            exit 1
          fi
          vorher=$(git rev-parse --verify --quiet origin/produktion || echo 'keiner')
          echo "Zeiger vorher:  $vorher"
          echo "Zeiger nachher: $ZIEL  (Tag: ${GITHUB_REF_NAME})"
          # `--force` ist hier richtig und sonst nirgends: Ein Zurücksetzen legt
          # einen älteren Commit oben auf, und ohne Zwang lehnte Git das ab.
          git push --force origin "$ZIEL:refs/heads/produktion"
          {
            echo '## Zeiger `produktion` bewegt'
            echo
            echo '| | Commit |'
            echo '|---|---|'
            echo "| vorher | \`$vorher\` |"
            echo "| nachher | \`$ZIEL\` (\`${GITHUB_REF_NAME}\`) |"
            echo
            echo 'Die Integritaetswache vergleicht ab jetzt gegen diesen Stand.'
          } >> "$GITHUB_STEP_SUMMARY"
  # ---------------------------------------------------------------------------
  app-tor:
    # DAS TOR DER APP-TAGS (R17-19, F-R17-17, E-R17-33). Bis Web 23.0.3 bauten
    # `android-v*` und `uhr-v*` jeden Commit, der Tag = Fassung trug und die
    # Freigabe bekam — auch einen nie geprüften. Jetzt wie beim Web: grüner
    # Job `Stufe 1` auf demselben Baum, und bei einem Tag liegt der Commit auf
    # `main`. Kein Geheimnis, keine Umgebung: Das Tor braucht nur `gh api`.
    # Heißt nicht `staging…`, sonst zählte das Tor der grünen Läufe ihn mit.
    name: App-Tor (Stufe 1, Abstammung)
    if: >-
      startsWith(github.ref, 'refs/tags/android-v')
      || startsWith(github.ref, 'refs/tags/uhr-v')
      || (inputs.app_probelauf || 'aus') != 'aus'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Grüner Stufe-1-Lauf auf diesem Baum — und liegt der Tag auf main?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/kette/freigabe.py --selbstprobe > /dev/null
          baum=$(git rev-parse 'HEAD^{tree}' 2>/dev/null || true)
          python3 tools/kette/baumsuche.py --baum "${baum:-}" --fenster 50 --ausgabe stufe1.json
          # Ein Tag MUSS auf `main` liegen; der App-Probelauf läuft von einem
          # Arbeitszweig und legt nichts ab — dort nur Stufe 1.
          case "$GITHUB_REF" in
            refs/tags/*)
              abstammung=pflicht
              vergleich=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" \
                           --jq '.status' 2>/dev/null || true) ;;
            *)
              abstammung=aus
              vergleich="" ;;
          esac
          python3 tools/kette/freigabe.py app-urteil \
            --baum "${baum:-}" \
            --stufe1-laeufe stufe1.json \
            --vergleich-main "${vergleich:-}" \
            --abstammung "$abstammung"
  # ---------------------------------------------------------------------------
  android-bau:
    # BAUEN OHNE GEHEIMNISSE (R17-19, F-R17-03, E-R17-32). Dieser Job hat
    # KEINE Umgebung und KEIN Geheimnis — mit Absicht. Bis Web 23.0.3 lief
    # Gradle im selben Schritt wie die vier `APK_*`-Werte und erbte sie;
    # `System.getenv()` genügte jedem Plugin. Ein eigener Schritt hätte das
    # nicht geheilt: Ein Hintergrundprozess aus dem Bau lebt auf demselben
    # Läufer in den nächsten Schritt hinein und liest dessen Umgebung über
    # `/proc`. Signiert wird deshalb im Job `android`, auf einem frischen
    # Läufer, ohne Gradle. `appbau.sh android-bauen` baut nicht, sobald ein
    # `APK_*` in seiner Umgebung steht, und startet Gradle nur mit einer
    # Positivliste (`env -i`).
    name: Android-Bau (unsigniert)
    needs: app-tor
    if: startsWith(github.ref, 'refs/tags/android-v') || inputs.app_probelauf == 'android'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    outputs:
      pruefsummen: ${{ steps.bau.outputs.pruefsummen }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Ohne: Der Checkout legte das Lauf-Token in `.git/config`, und Gradle
        # läuft im selben Baum — `env -i` schützt die Umgebung, nicht die Datei
        # (Gegenprüfung R17-19). Gebraucht wird es hier nicht.
        with:
          persist-credentials: false

      - name: Java 21 für AGP 9
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Selbstprobe des Baus
        run: bash tools/kette/appbau.sh --selbstprobe

      - name: Unsigniert bauen — Gradle mit Positivliste, ohne Schlüssel
        id: bau
        run: |
          case "$GITHUB_REF" in
            refs/tags/android-v*) fassung="${GITHUB_REF_NAME#android-v}" ;;
            *)                    fassung=datei ;;
          esac
          bash tools/kette/appbau.sh android-bauen "$fassung" unsigniert
          {
            echo 'pruefsummen<<ENDE_DER_SUMMEN'
            cat unsigniert/pruefsummen.txt
            echo 'ENDE_DER_SUMMEN'
          } >> "$GITHUB_OUTPUT"

      - name: Unsignierte APKs an den Signaturjob übergeben
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-unsigniert
          path: |
            unsigniert/handy-release-unsigned.apk
            unsigniert/uhr-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
  # ---------------------------------------------------------------------------
  android:
    name: Android-Auslieferung
    # Einmal je Fassung, hinter der Pflichtfreigabe der Umgebung `produktion`
    # (E-PK-23); nicht `staging…` heißen, sonst zählte das Tor der grünen Läufe
    # diesen Job mit. Seit R17-19 signiert er nur noch, was `android-bau`
    # gebaut hat — Gradle läuft hier nicht (E-R17-32).
    needs: [app-tor, android-bau]
    if: startsWith(github.ref, 'refs/tags/android-v') || inputs.app_probelauf == 'android'
    runs-on: ubuntu-26.04
    environment: produktion
    timeout-minutes: 20
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false   # `gh run download` nimmt GH_TOKEN, nicht .git/config

      # `apksigner` ist ein Java-Werkzeug; dieselbe Fassung wie beim Bau.
      - name: Java 21 für apksigner
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Selbstproben von Bau und Ablage
        run: |
          bash tools/kette/appbau.sh --selbstprobe
          python3 tools/kette/apkablage.py --selbstprobe

      - name: Unsignierte APKs holen und gegen die Prüfsummen des Baus halten
        # `gh run download` statt einer weiteren Fremd-Aktion; die Prüfsummen
        # kommen über die Ausgabe des Bau-Jobs, nicht aus dem Artefakt selbst.
        env:
          GH_TOKEN: ${{ github.token }}
          PRUEFSUMMEN: ${{ needs.android-bau.outputs.pruefsummen }}
        run: |
          if [ -z "${PRUEFSUMMEN:-}" ]; then
            echo "::error::Der Bau-Job hat keine Prüfsummen ausgegeben — ohne sie wird nichts signiert."
            exit 1
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name android-unsigniert --dir eingang
          printf '%s\n' "$PRUEFSUMMEN" > eingang/pruefsummen.txt
          (cd eingang && sha256sum -c pruefsummen.txt)
          if [ "$(grep -c . eingang/pruefsummen.txt)" != 2 ]; then
            echo "::error::Erwartet sind zwei Prüfsummen (Handy und Wear OS)."
            exit 1
          fi

      - name: Signieren, Zertifikat prüfen
        # Signiert wird mit `apksigner`, außerhalb von Gradle (E-PK-63), auf
        # einem Läufer, auf dem Gradle nie lief (E-R17-32).
        env:
          APK_SPEICHER_B64:        ${{ secrets.APK_SPEICHER_B64 }}
          APK_SPEICHER_PASSWORT:   ${{ secrets.APK_SPEICHER_PASSWORT }}
          APK_SCHLUESSEL_NAME:     ${{ secrets.APK_SCHLUESSEL_NAME }}
          APK_SCHLUESSEL_PASSWORT: ${{ secrets.APK_SCHLUESSEL_PASSWORT }}
          APK_ZERTIFIKAT_SHA256:   ${{ vars.APK_ZERTIFIKAT_SHA256 }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/android-v*) fassung="${GITHUB_REF_NAME#android-v}" ;;
            *)                    fassung=datei ;;
          esac
          bash tools/kette/appbau.sh android-signieren "$fassung" eingang ausgabe

      - name: Nach server/apk/ ablegen, ältere Fassungen löschen
        # Gelöscht wird erst, wenn die neue Datei zurückgeholt und gleich ist
        # und ihren Namen trägt — nie davor (E-PK-59).
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_ZIELPFAD: ${{ vars.FTP_ZIELPFAD }}
          PROBELAUF:    ${{ inputs.app_probelauf == 'android' }}
        run: |
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_ZIELPFAD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v der Umgebung produktion fehlt — nichts abgelegt."
              exit 1
            fi
          done
          schalter=""
          if [ "$PROBELAUF" = "true" ]; then schalter="--probelauf"; fi
          zahl=0
          for datei in ausgabe/nadoku-[0-9]*.apk ausgabe/nadoku-uhr-*.apk; do
            case "$datei" in
              ausgabe/nadoku-uhr-*) art=uhr ;;
              *)                    art=handy ;;
            esac
            if [ ! -f "$datei" ]; then
              echo "::error::$datei fehlt — der Bau hat nicht beide APKs hinterlassen."
              exit 1
            fi
            python3 tools/kette/apkablage.py --art "$art" --datei "$datei" \
                --ftp-server "$FTP_SERVER" --ftp-konto "$FTP_USERNAME" \
                --ftp-pass "$FTP_PASSWORD" --ftp-pfad "$FTP_ZIELPFAD" \
                --zusammenfassung "$GITHUB_STEP_SUMMARY" $schalter
            zahl=$((zahl + 1))
          done
          if [ "$zahl" != 2 ]; then
            echo "::error::$zahl APKs statt 2 (Handy und Wear OS)."
            exit 1
          fi
  # ---------------------------------------------------------------------------
  uhr:
    name: Uhr-Auslieferung (Garmin)
    # Das Paket bleibt ein Artefakt dieses Laufs; in den Connect-IQ-Store lädt
    # es die Betreiberin von Hand (E-PK-61).
    # Seit R17-19 hinter dem App-Tor (F-R17-17).
    needs: app-tor
    if: startsWith(github.ref, 'refs/tags/uhr-v') || inputs.app_probelauf == 'uhr'
    runs-on: ubuntu-26.04
    environment: produktion
    timeout-minutes: 90
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `monkeyc` nimmt das Java vom PATH; ohne Festlegung wechselte es mit dem
      # Abbild (24.04: 17, 26.04: 25). 17 ist das, womit `uhr-v3.1.0` gebaut
      # wurde (Nr. 236).
      - name: Java 17 für das Connect-IQ-SDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Connect-IQ-SDK und alle Gerätedateien
        # `CIQ_ZIELE=alle`: `monkeyc -e` baut für jedes Gerät im Manifest, und
        # ein fehlendes Gerät bricht das Paket ab.
        env:
          CIQ_GERAETE_URL: ${{ secrets.CIQ_GERAETE_URL }}
        run: |
          if [ -z "${CIQ_GERAETE_URL:-}" ]; then
            echo "::error::CIQ_GERAETE_URL fehlt — ohne Gerätedateien kein Paket."
            exit 1
          fi
          CIQ_ZIELE=alle bash tools/uhr-pruefstand/pruefstand.sh aufbau-uebersetzen

      - name: Selbstprobe des Baus
        run: bash tools/kette/appbau.sh --selbstprobe

      - name: Store-Paket bauen und signieren
        env:
          UHR_ENTWICKLERSCHLUESSEL_B64: ${{ secrets.UHR_ENTWICKLERSCHLUESSEL_B64 }}
        run: |
          export PATH="$HOME/.ciq-pruefstand/sdk/bin:$PATH"
          case "$GITHUB_REF" in
            refs/tags/uhr-v*) fassung="${GITHUB_REF_NAME#uhr-v}" ;;
            *)                fassung=datei ;;
          esac
          bash tools/kette/appbau.sh uhr "$fassung" ausgabe

      - name: Paket als Artefakt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nadoku-${{ github.ref_name }}
          path: ausgabe/*.iq
          if-no-files-found: error
          retention-days: 90
