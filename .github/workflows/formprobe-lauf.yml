# WEGWERF-MESSMITTEL (AP5). Wird nach der Messung geloescht.
#
# FRAGE: Traegt ein AUFGERUFENER Arbeitslauf seine eigene `environment:`-Zeile
# -- und zwar als AUSDRUCK --, und loesen dann die Umgebungsgeheimnisse und
# Umgebungsvariablen DIESER Umgebung auf? Nur wenn ja, kann AP5 die Form
# "wiederverwendbarer Arbeitslauf" waehlen, ohne die Pflichtfreigabe zu
# verlieren: Loest das Geheimnis auf, hat GitHub den Job als Auslieferung in
# diese Umgebung behandelt -- und dann greifen auch ihre Schutzregeln.
name: Formprobe Lauf
on:
  workflow_call:
    inputs:
      umgebung:
        required: true
        type: string
      mit_umgebung:
        required: true
        type: boolean
jobs:
  mit:
    if: ${{ inputs.mit_umgebung }}
    runs-on: ubuntu-latest
    # DER AUSDRUCK IST DER KERN DER MESSUNG. Eine literale Zeile waere
    # gemessen und nutzlos -- AP5 braucht genau diese Form.
    environment: ${{ inputs.umgebung }}
    steps:
      - name: Loesen die Werte im aufgerufenen Lauf auf?
        # DIESELBEN SIEBEN WIE IN DER GEGENPROBE, damit der Vergleich einer
        # ist. Runde 1 hat hier nur drei gemessen und war deshalb nicht
        # aussagefaehig, als sich herausstellte, dass FTP_SERVER auch von
        # aussen kommt.
        env:
          G1: ${{ secrets.FTP_SERVER }}
          G2: ${{ secrets.FTP_USERNAME }}
          G3: ${{ secrets.FTP_PASSWORD }}
          G4: ${{ secrets.JOBS_TOKEN }}
          V1: ${{ vars.FTP_ZIELPFAD }}
          V2: ${{ vars.STAGING_URL }}
          V3: ${{ vars.FTP_STATE_PFAD }}
        run: |
          sag() { if [ -n "$2" ]; then echo "$1: BELEGT"; else echo "$1: LEER"; fi; }
          echo "D0 Umgebung laut Ausdruck: ${{ inputs.umgebung }}"
          sag "D1 secrets.FTP_SERVER  " "${G1:-}"
          sag "D2 secrets.FTP_USERNAME" "${G2:-}"
          sag "D3 secrets.FTP_PASSWORD" "${G3:-}"
          sag "D4 secrets.JOBS_TOKEN  " "${G4:-}"
          sag "D5 vars.FTP_ZIELPFAD   " "${V1:-}"
          sag "D6 vars.STAGING_URL    " "${V2:-}"
          sag "D7 vars.FTP_STATE_PFAD " "${V3:-}"
  ohne:
    if: ${{ !inputs.mit_umgebung }}
    runs-on: ubuntu-latest
    # KEIN `environment:`. Die Gegenprobe: Ist FTP_SERVER wirklich ein
    # UMGEBUNGSgeheimnis, muss es hier LEER sein -- auch mit `secrets: inherit`.
    steps:
      - name: Gegenprobe -- dieselben Werte ohne environment
        # RUNDE 2. Runde 1 hat gezeigt, dass FTP_SERVER auch OHNE `environment:`
        # aufloest -- es gibt also einen gleichnamigen Wert auf Repositoriums-
        # oder Organisationsebene. Damit ist Runde 1 fuer die Bindungsfrage
        # unbrauchbar: Dass im aufgerufenen Lauf MIT `environment:`-Ausdruck
        # etwas ankam, belegt noch nicht, dass die Umgebung gebunden hat --
        # es koennte der Wert von aussen gewesen sein.
        #
        # DESHALB HIER AUCH DIE VARIABLEN. Kommt `vars.FTP_ZIELPFAD` hier LEER
        # und dort BELEGT, ist die Bindung bewiesen; kommt sie hier ebenfalls
        # belegt, beweist die Runde wieder nichts, und die Bindung braucht
        # einen anderen Nachweis.
        #
        # UND DIE UEBRIGEN DREI GEHEIMNISSE, weil der Befund aus Runde 1 nur
        # fuer eines von vieren gemessen ist.
        env:
          G1: ${{ secrets.FTP_SERVER }}
          G2: ${{ secrets.FTP_USERNAME }}
          G3: ${{ secrets.FTP_PASSWORD }}
          G4: ${{ secrets.JOBS_TOKEN }}
          V1: ${{ vars.FTP_ZIELPFAD }}
          V2: ${{ vars.STAGING_URL }}
          V3: ${{ vars.FTP_STATE_PFAD }}
        run: |
          # NIE EIN WERT, NUR BELEGT/LEER.
          sag() { if [ -n "$2" ]; then echo "$1: BELEGT -- liegt AUSSERHALB der Umgebung"; else echo "$1: LEER (so gehoert es sich)"; fi; }
          sag "E1 secrets.FTP_SERVER  " "${G1:-}"
          sag "E2 secrets.FTP_USERNAME" "${G2:-}"
          sag "E3 secrets.FTP_PASSWORD" "${G3:-}"
          sag "E4 secrets.JOBS_TOKEN  " "${G4:-}"
          sag "E5 vars.FTP_ZIELPFAD   " "${V1:-}"
          sag "E6 vars.STAGING_URL    " "${V2:-}"
          sag "E7 vars.FTP_STATE_PFAD " "${V3:-}"
