# WEGWERF-MESSMITTEL (AP5). Wird nach der Messung geloescht.
#
# WARUM ES DAS GIBT: Das Konzept sagt, die Form von AP5 -- wiederverwendbarer
# Arbeitslauf ODER zusammengesetzte Aktion -- werde "nach Messung" gewaehlt,
# unter der Bedingung, dass Umgebungsgeheimnisse und Pflichtfreigabe erhalten
# bleiben. `docs.github.com` ist von diesem Laeufer aus gesperrt; geraten wird
# an der Auslieferungskette nicht. Also misst dieser Lauf es.
#
# ER FAEHRT NUR GEGEN `staging`. Die Umgebung `produktion` hat die
# Pflichtfreigabe der Betreiberin; eine Messung, die sie zum Klicken zwingt,
# waere ein Missbrauch des Tors.
#
# ER SCHREIBT NICHTS -- kein FTP, kein Upload, keine Datei auf einem Server.
name: Formprobe
# NUR AUF DIESEM ZWEIG, UND NUR ueber `push`. `workflow_dispatch` schiede aus:
# Ein Arbeitslauf, den es auf dem Standardzweig nicht gibt, steht nicht in der
# Liste und ist nicht ausloesbar. Der Zweig loest `auslieferung.yml` nicht aus
# (die haengt an `main` und an Tags) -- dieser Push liefert also nichts aus.
on:
  push:
    branches: [ claude/fervent-dirac-xirsqw ]
permissions:
  contents: read
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  a_aktion_direkt:
    name: A -- Aktion, Kontexte direkt
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - id: direkt
        # DER FEHLSCHLAG IST EIN ERGEBNIS, KEIN UNFALL. Loest `secrets` in
        # einer zusammengesetzten Aktion nicht auf, faellt sie beim Laden --
        # und dieser Schalter haelt die uebrigen Messungen am Leben.
        continue-on-error: true
        uses: ./.github/actions/formprobe-direkt
      - name: Ausgang der direkten Aktion
        run: echo "A-ERGEBNIS formprobe-direkt outcome=${{ steps.direkt.outcome }}"

  b_aktion_eingang:
    name: B -- Aktion, ueber Eingaben
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - id: eingang
        continue-on-error: true
        uses: ./.github/actions/formprobe-eingang
        with:
          geheim:    ${{ secrets.FTP_SERVER }}
          variable:  ${{ vars.FTP_ZIELPFAD }}
          probelauf: 'true'
      - name: Ausgang der Eingabe-Aktion
        run: echo "B-ERGEBNIS formprobe-eingang outcome=${{ steps.eingang.outcome }}"

  c_lauf_mit_umgebung:
    name: C -- aufgerufener Lauf MIT environment
    uses: ./.github/workflows/formprobe-lauf.yml
    with:
      umgebung: staging
      mit_umgebung: true
    secrets: inherit

  d_lauf_ohne_umgebung:
    name: D -- aufgerufener Lauf OHNE environment
    uses: ./.github/workflows/formprobe-lauf.yml
    with:
      umgebung: staging
      mit_umgebung: false
    secrets: inherit

  e_needs:
    name: E -- needs auf einen aufgerufenen Lauf
    needs: c_lauf_mit_umgebung
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "F1 needs auf einen aufgerufenen Lauf -- haelt"
