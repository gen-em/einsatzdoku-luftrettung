# WEGWERF-MESSMITTEL (AP5). Wird nach der Messung geloescht.
#
# WARUM ES DAS GIBT: Das Konzept sagt, die Form von AP5 -- wiederverwendbarer
# Arbeitslauf ODER zusammengesetzte Aktion -- werde "nach Messung" gewaehlt,
# unter der Bedingung, dass die Umgebungsbindung und die Pflichtfreigabe
# erhalten bleiben. `docs.github.com` ist von diesem Laeufer aus gesperrt;
# geraten wird an der Auslieferungskette nicht.
#
# ER FAEHRT NUR GEGEN `staging`. Die Umgebung `produktion` hat die
# Pflichtfreigabe der Betreiberin; eine Messung, die sie zum Klicken zwingt,
# waere ein Missbrauch des Tors.
#
# ER SCHREIBT NICHTS -- kein FTP, kein Upload, keine Datei auf einem Server.
#
# RUNDE 1 (Lauf 35549413032) hat drei Fragen abschliessend beantwortet; ihre
# Messmittel sind deshalb wieder entfernt:
#
#   A  Loesen `secrets`/`vars` INNERHALB einer zusammengesetzten Aktion auf?
#      NEIN, und zwar LAUT -- die Aktion laedt gar nicht erst:
#        "Unrecognized named-value: 'secrets'. Located at position 1 within
#         expression: secrets.FTP_SERVER"
#        "Unrecognized named-value: 'vars'. ..."
#        "Failed to load .../formprobe-direkt/action.yml"
#      Kein stilles Leerbleiben; das ist der einzige Trost daran.
#   B  Ueber Eingaben geht es, verschachteltes `uses:` in der Aktion laeuft
#      ("C5 verschachteltes uses: GELAUFEN"), `if:` in der Aktion ebenso.
#   E  `needs:` auf einen aufgerufenen Lauf haelt.
#
# OFFEN UND EINZIGER ZWECK DIESER RUNDE: Runde 1 hat nebenbei gezeigt, dass
# `secrets.FTP_SERVER` auch OHNE `environment:` aufloest -- es gibt einen
# gleichnamigen Wert auf Repositoriums- oder Organisationsebene. Damit ist
# Runde 1 fuer die eigentliche Frage WERTLOS: Dass im aufgerufenen Lauf mit
# `environment:`-AUSDRUCK etwas ankam, belegt nicht, dass die Umgebung
# gebunden hat -- es kann der Wert von aussen gewesen sein.
#
# Diese Runde misst dieselben SIEBEN Werte einmal MIT und einmal OHNE
# `environment:`. Ein Wert, der drinnen belegt und draussen leer ist, ist der
# Beweis der Bindung. Nebenbei faellt ab, wie weit der Befund aus Runde 1
# reicht -- gemessen war er fuer eines von vier Geheimnissen.
name: Formprobe
# NUR AUF DIESEM ZWEIG, UND NUR ueber `push`. `workflow_dispatch` schiede aus:
# Ein Arbeitslauf, den es auf dem Standardzweig nicht gibt, steht nicht in der
# Liste und ist nicht ausloesbar. Der Zweig loest `auslieferung.yml` nicht aus
# (die haengt an `main` und an Tags) -- dieser Push liefert also nichts aus.
on:
  push:
    branches: [ claude/fervent-dirac-xirsqw ]
permissions:
  contents: read
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  c_lauf_mit_umgebung:
    name: C -- aufgerufener Lauf MIT environment
    uses: ./.github/workflows/formprobe-lauf.yml
    with:
      umgebung: staging
      mit_umgebung: true
    secrets: inherit

  d_lauf_ohne_umgebung:
    name: D -- aufgerufener Lauf OHNE environment
    uses: ./.github/workflows/formprobe-lauf.yml
    with:
      umgebung: staging
      mit_umgebung: false
    secrets: inherit
