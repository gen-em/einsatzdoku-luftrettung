# Stufe 1 — der Riegel vor dem Merge (Station C, docs/Pruefablauf.md 2.3): Sie liest den
# Prüfbericht aus Station B gegen und fährt die billigen Riegel. Android und Uhr baut Station B.
name: Prüfung

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

# Ohne pipefail zählt nur das letzte Glied einer Pipe — `prüfung | tee` wäre nie rot; GitHub setzt es nicht selbst.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  schon-gemessen:
    name: Schon gemessen?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read       # fehlt es, scheitert die Abfrage, und jeder Push auf main misst still neu
    outputs:
      messen: ${{ steps.vergleich.outputs.messen }}
    steps:
      - name: Code auschecken
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Baum gegen die grünen PR-Läufe halten
        id: vergleich
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          messen() {
            echo "messen=ja" >> "$GITHUB_OUTPUT"
            echo "Messen: ja — $1"
            echo "**Schon gemessen?** Nein — $1. Stufe 1 misst." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # Ein PR misst immer: Dort prüft das Ruleset, und ein übersprungenes „Stufe 1" gälte ihm als grün.
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            messen "kein Push auf \`main\` ($GITHUB_EVENT_NAME)"
          fi

          baum=$(git rev-parse 'HEAD^{tree}' 2>/dev/null || true)
          [ -n "$baum" ] || messen "eigener Baum nicht ermittelt"
          echo "Eigener Baum: $baum"

          FENSTER=30
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pruefung.yml/runs?event=pull_request&status=success&per_page=$FENSTER" \
             --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' > kandidaten.txt 2>/dev/null \
             || messen "Liste der PR-Läufe nicht abrufbar"
          echo "Kandidaten: $(grep -c . kandidaten.txt || true) grüne PR-Läufe"

          while read -r lauf kopf; do
            [ -n "$lauf" ] || continue
            lb=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$kopf" --jq '.tree.sha' 2>/dev/null || true)
            [ "$lb" = "$baum" ] || continue
            # Grün muss der Job „Stufe 1" sein, nicht der Lauf — ein Lauf ist auch mit übersprungenem Job grün.
            fertig=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$lauf/jobs" \
                       --jq '[.jobs[] | select(.name == "Stufe 1") | select(.conclusion == "success") | .completed_at][0] // empty' \
                       2>/dev/null || true)
            if [ -n "$fertig" ]; then
              echo "messen=nein" >> "$GITHUB_OUTPUT"
              zeile="Baum \`${baum:0:7}\` bereits gemessen: Lauf $lauf (\`pull_request\`, \`${kopf:0:7}\`), Job \`Stufe 1\` grün am ${fertig/T/ } — nicht noch einmal gemessen."
              echo "Messen: nein — $zeile"
              echo "**Schon gemessen?** Ja. $zeile Lauf: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$lauf" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Lauf $lauf: gleicher Baum, aber Job \`Stufe 1\` nicht grün — zählt nicht"
          done < kandidaten.txt

          messen "kein grüner PR-Lauf mit Baum \`${baum:0:7}\` unter den letzten $FENSTER"

  # Der Jobname „Stufe 1" ist Kupplung: Das Ruleset, das Produktionstor in ausliefern-lauf.yml und „Schon gemessen?" suchen ihn wörtlich.
  pruefung:
    name: Stufe 1
    needs: schon-gemessen
    # Ein per `if` übersprungener Job gilt dem Ruleset als grün — darum !cancelled() und != 'nein'.
    if: ${{ !cancelled() && needs.schon-gemessen.outputs.messen != 'nein' }}
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0    # die Gegenlesung braucht origin/main und den PR-Kopf

      - name: Fassungen nennen — was misst hier eigentlich?
        # Erst zuweisen, dann ausgeben: Ein Fehler in `$(…)` als echo-Argument bliebe grün.
        run: |
          web=$(php -r "require 'server/version.php'; echo WEB_VERSION;")
          uhr=$(grep -oE 'APP_VERSION *= *"[0-9.]+"' watch/source/Const.mc | grep -oE '[0-9.]+')
          android=$(grep -oE '^version=[0-9.]+' android/version.properties | cut -d= -f2)
          echo "PHP:     $(php -v | head -1)"
          echo "Python:  $(python3 -V)"
          echo "Node:    $(node -v)"
          echo "Web:     $web"
          echo "Uhr:     $uhr"
          echo "Android: $android"

      - name: PHP-Syntax über server/ und tools/
        id: php
        # Gezählt wie im Prüfstand (versioniert, server/); 0 Dateien ist rot, nicht grün.
        run: |
          n=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null
            n=$((n+1))
          done < <(find server tools -name '*.php' -type f)
          s=$(git ls-files 'server/*.php' 'server/**/*.php' | wc -l)
          [ "$n" -gt 0 ] && [ "$s" -gt 0 ] || { echo "::error::Keine PHP-Datei gefunden -- gemessen wurde nichts."; exit 1; }
          echo "PHP-Dateien ohne Syntaxfehler: $n (davon versioniert unter server/: $s)"
          echo "zahl=php:$s/0" >> "$GITHUB_OUTPUT"

      - name: Quelltext — acht Prüfungen, ein Läufer
        # Selbstprobe zuerst: Eine Prüfung, die kaputt ist und darum nichts findet, meldete sonst grün.
        run: |
          bash tools/quelltext/pruefen.sh --selbstprobe
          rc=0
          bash tools/quelltext/pruefen.sh alle > /tmp/quelltext.txt 2>&1 || rc=$?
          cat /tmp/quelltext.txt
          { echo '```'; tail -20 /tmp/quelltext.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Kontraste der Token
        run: python3 tools/screenshots/kontrast.py

      - name: Liegt ein Umgebungswert eine Ebene höher noch einmal?
        # Läuft absichtlich in einem Job ohne `environment:` — nur dort ist ein Wert eine Ebene höher sichtbar.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
          FTP_ZIELPFAD: ${{ vars.FTP_ZIELPFAD }}
          FTP_STATE_PFAD: ${{ vars.FTP_STATE_PFAD }}
        run: |
          gefunden=""
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD JOBS_TOKEN FTP_ZIELPFAD FTP_STATE_PFAD; do
            if [ -n "${!name:-}" ]; then echo "  $name: BELEGT — liegt AUSSERHALB der Umgebungen"; gefunden="$gefunden $name"
            else echo "  $name: leer (so gehört es sich)"; fi
          done
          if [ -n "$gefunden" ]; then
            echo "::error::Diese Namen liegen außerhalb der Umgebungen:$gefunden. Damit kann die Geheimnisprüfung der Auslieferungskette nicht mehr fehlschlagen — fehlt der Umgebungswert, greift still der von oben (E-KH-28, F-KH-U-32). Löschen unter Settings -> Secrets and variables -> Actions; die Einträge unter Environments bleiben stehen."
            echo "## Ein Umgebungswert liegt eine Ebene höher:$gefunden — unter Repository/Organization secrets löschen, die unter Environments bleiben (E-KH-28)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Kein Umgebungswert liegt doppelt. Die Geheimnisprüfung der Kette kann fehlschlagen — und das ist ihr Zweck."

      - name: Kettenaufrufe — passt jeder Aufruf zu seinem Werkzeug?
        run: |
          python3 tools/kettenaufrufe/pruefen.py --probe
          python3 tools/kettenaufrufe/pruefen.py

      - name: Tore der Kette — geht das Backup-Tor auch zu?
        run: python3 tools/kette/tor.py --selbstprobe

      - name: Warten auf einen Download — sagt es, wenn keiner kommt?
        run: node tools/referenzdatensatz/browser/download_lib.mjs --selbstprobe

      - name: Das Tor der grünen Läufe — geht es zu, wenn es zugehen muss?
        run: python3 tools/kette/freigabe.py --selbstprobe

      - name: Python-Werkzeuge — lassen sie sich überhaupt übersetzen?
        run: |
          python3 - <<'PY'
          import pathlib, sys
          fehler = n = 0
          for p in sorted(pathlib.Path('tools').rglob('*.py')):
              n += 1
              try:
                  compile(p.read_text(encoding='utf-8'), str(p), 'exec')
              except SyntaxError as e:
                  fehler += 1
                  print(f"::error file={p},line={e.lineno}::{e.msg}")
          print(f"{n} Python-Werkzeuge geprüft, {fehler} mit Syntaxfehler")
          sys.exit(1 if fehler else 0)
          PY

      - name: Backlog — keine Nummer zweimal
        run: |
          doppelt=$(grep -oE '^[0-9]+\.' docs/Backlog.md | tr -d '.' | sort -n | uniq -d)
          if [ -n "$doppelt" ]; then
            echo "Doppelte Backlog-Nummern: $doppelt"
            exit 1
          fi
          echo "Doppelte Backlog-Nummern: 0"

      - name: Handbuch und „Was ist NAdoku" — rendern sie überhaupt?
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmark-gfm
          fehler=0
          for f in docs/Handbuch.md docs/Was-ist-NAdoku.md; do
            if [ ! -f "$f" ]; then
              echo "::error::$f fehlt — hilfe.php bzw. ueber.php zeigen dann „Dieses Dokument fehlt”."
              fehler=1; continue
            fi
            if cmark-gfm --validate-utf8 --to html "$f" > /dev/null; then
              echo "  $f rendert ($(wc -c < "$f") Bytes)"
            else
              echo "::error::$f rendert nicht."
              fehler=1
            fi
          done
          fremd=$(grep -nE '!\[[^]]*\]\((https?:)?//' docs/Handbuch.md docs/Was-ist-NAdoku.md || true)
          if [ -n "$fremd" ]; then
            echo "::error::Bild aus fremder Quelle im Handbuch — die Anwendung zeigt es nicht an (keine fremde Quelle zur Laufzeit, CLAUDE.md 4):"
            echo "$fremd"
            fehler=1
          fi
          exit $fehler

      - name: Spaltenregister — schema.sql gegen mf_missions_register()
        run: |
          php tools/spaltenregister/pruefen.php --selbstprobe
          php tools/spaltenregister/pruefen.php

      - name: Zentralisierung — hält jede Sache ihre eine Stelle?
        run: |
          php tools/zaehlung/zaehlen.php --selbstprobe
          php tools/zaehlung/zaehlen.php

      - name: Rechtstexte — hält der Filter die Angriffe ab?
        run: bash tools/proben/proben.sh rechtstexte

      - name: Prüfbericht gegenlesen — passt er zu diesem Stand?
        # Streng (E-PK-42): Baum im Bericht = Baum des PR-Kopfs; nach „Update branch" rot, die Meldung sagt den Weg.
        # Die Riegel davor sind grün, sonst liefe dieser Schritt nicht; --alle-riegel hält die Liste gleich.
        if: github.event_name == 'pull_request'
        env:
          KOPF: ${{ github.event.pull_request.head.sha }}
          PHP_ZAHL: ${{ steps.php.outputs.zahl }}
        run: |
          python3 tools/pruefstand/bericht.py lesen --commit "$KOPF" --basis origin/main --alle-riegel \
            --riegel "syntax-php=$PHP_ZAHL" --riegel wortliste=0 --riegel vollstaendigkeit=0 \
            --riegel linkprobe=0 --riegel installweiche=0 --riegel sitzungshaertung=0 \
            --riegel cspprobe=0 --riegel jobregister=0 --riegel migrationsregister=0 \
            --riegel kontraste=0 --riegel kettenaufrufe=0 --riegel zaehlung=0 \
            --riegel spaltenregister=0 --riegel rechtstexte=0

  # Fassungen bewusst fest: mysql:8.4.0 reserviert MANUAL (Nr. 238), mariadb:10.6 ist PLATTFORM_MARIADB_MIN — nicht anheben.
  schema:
    name: Schema gegen ${{ matrix.db.name }}
    needs: schon-gemessen
    # Wie bei Stufe 1: scheitert „Schon gemessen?", misst dieser Job trotzdem, statt still zu entfallen.
    if: ${{ !cancelled() && needs.schon-gemessen.outputs.messen != 'nein' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: MySQL 8.4.0
            image: mysql:8.4.0
            klient: mysql
            # Nur über TCP: Über den Socket meldet sich schon der temporäre Einrichtungsserver gesund (F-TB-12).
            gesund: mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -pschemaprobe
          - name: MariaDB 10.6
            image: mariadb:10.6
            klient: mariadb
            gesund: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: schemaprobe
          MARIADB_ROOT_PASSWORD: schemaprobe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.gesund }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Datenbank-Klient bereitstellen
        run: |
          if command -v ${{ matrix.db.klient }} >/dev/null 2>&1; then
            echo "${{ matrix.db.klient }} ist da: $(${{ matrix.db.klient }} --version)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq mariadb-client
            echo "nachgeladen: $(${{ matrix.db.klient }} --version)"
          fi

      - name: Selbstprobe — zählt die Probe einen Fehlschlag überhaupt?
        # --klient auch hier: Ohne ihn prüft die Selbstprobe den Vorgabewert mariadb, den der MySQL-Läufer nicht hat.
        run: php tools/schemaprobe/probe.php --selbstprobe --klient ${{ matrix.db.klient }}

      - name: Schemaprobe — schema.sql und die Migrationen
        run: |
          php tools/schemaprobe/probe.php \
              --datenbank nadoku_schemaprobe \
              --host 127.0.0.1 --port 3306 \
              --benutzer root --passwort schemaprobe \
              --klient ${{ matrix.db.klient }} \
            | tee /tmp/schemaprobe.txt
          {
            echo "### Schemaprobe — ${{ matrix.db.name }}"
            echo '```'
            tail -1 /tmp/schemaprobe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
