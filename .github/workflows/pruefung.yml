name: Prüfung

# STUFE 1 DES PRÜFTORS (Konzept P5a, E-P5a-13; Rahmenplan R67/E-PV-3 (e)).
#
# WAS SIE IST. Die Prüfmittel, die OHNE laufende Installation auskommen —
# Syntax, Wortliste, Vollständigkeit, Kontraste, Backlog-Nummern,
# Migrationsregister, die Android-Bauläufe und, wenn die Adresse da ist, das
# Übersetzen der Uhr-App für alle Zielgeräte. Sie laufen bei JEDEM Push auf
# JEDEM Zweig und bei jedem Pull Request.
#
# WAS SIE NICHT IST. Kein Ersatz für die Browserprüfung (`CLAUDE.md` 6) und
# kein Ersatz für Stufe 2: Kreisläufe, Bilderlauf und Messstand brauchen eine
# Installation und laufen deshalb im Staging-Lauf (`auslieferung.yml`).
#
# ROT = KEIN MERGE. Das entscheidet nicht diese Datei, sondern der Zweigschutz
# auf `main` mit `pruefung` als Pflichtprüfung (Zuarbeit, Rahmenplan
# Abschnitt 6). Ohne ihn ist dieser Lauf eine Auskunft und keine Schranke.
#
# KEIN STILLES ÜBERSPRINGEN. Fehlt einem Schritt seine Voraussetzung — der
# Uhr-Prüfstand braucht `CIQ_GERAETE_URL`, und die steht bewusst nicht im
# Repositorium —, sagt er das mit einer Zeile und einer Zusammenfassung. Ein
# Schritt, der ohne Voraussetzung grün meldet, ist schlimmer als ein roter:
# Er sieht aus wie eine Prüfung.

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ein zweiter Push auf denselben Zweig macht den ersten Lauf gegenstandslos.
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

# ALLE run-BLOECKE MIT `pipefail` (16.09.2026, gemessen).
#
# GitHub faehrt run-Bloecke mit `bash -e {0}` — OHNE pipefail. Der
# Rueckgabewert einer Pipe ist damit der des LETZTEN Glieds, und ein
# gescheitertes erstes Glied faellt lautlos durch. Im Schritt "Wortliste"
# stand `python3 wortliste.py | tee /tmp/wortliste.txt`: `tee` gibt immer 0,
# also konnte dieser Schritt NIE ROT WERDEN. Nachgemessen:
# `bash -e -c 'python3 -c "import sys;sys.exit(1)" | tee /dev/null; echo $?'`
# ergibt 0.
#
# Ein Pruefmittel, das nicht scheitern kann, ist kein Pruefmittel — es ist
# eine gruene Zahl ohne Aussage. Deshalb hier, an EINER Stelle je Lauf, und
# nicht als Flicken an der einen Pipe: Die naechste Pipe kommt bestimmt.
#
# GEMESSEN, WAS DADURCH ROT WIRD: von zehn Pipes in den drei Laeufen trifft
# es genau eine — `grep -oE "WEB_VERSION..." | head -1` im Schritt
# "Fassungen nennen". Die war ohnehin kaputt (das Muster verlangte ein Komma
# hinter dem Namen, `version.php` schreibt `const WEB_VERSION = '…'`) und ist
# im selben Zug berichtigt.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  pruefung:
    name: Stufe 1
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7
        with:
          # VORAUSSETZUNG DER BEREICHSERKENNUNG (Schritt danach). Die Vorgabe
          # holt EINEN Commit; ohne Historie gibt es nichts zu vergleichen,
          # und die Erkennung fiele bei jedem Lauf auf „alles messen" zurueck
          # — richtig, aber wirkungslos. Kostet wenige Sekunden.
          fetch-depth: 0

      - name: Fassungen nennen — was misst hier eigentlich?
        # ZUERST UND IMMER. Eine Zahl ohne die Fassung, die sie erzeugt hat,
        # ist in einem Monat nicht mehr nachvollziehbar (`CLAUDE.md` 6).
        run: |
          echo "PHP:    $(php -v | head -1)"
          echo "Python: $(python3 -V)"
          echo "Node:   $(node -v)"
          echo "Java:   $(java -version 2>&1 | head -1)"
          # DEN STANDARD-JDK DES LAEUFERS FESTHALTEN. Weiter unten stellt
          # `setup-java` fuer den Android-Schritt auf Java 21 um — und zwar
          # global, fuer ALLE folgenden Schritte. Die Uhr uebersetzt danach;
          # sie laeuft seit jeher auf dem JDK des Laeufers, und das ist ein
          # 35-Minuten-Schritt, den hier niemand nebenbei umstellt. Also wird
          # der Wert gemerkt und der Uhr-Schritt ausdruecklich darauf
          # zurueckgesetzt (E-KH-24).
          echo "JAVA_HOME_LAEUFER=${JAVA_HOME:-}" >> "$GITHUB_ENV"
          # DREI ZAEHLUNGEN, DREI AUSLIEFERUNGEN (CLAUDE.md 2) — der
          # Schrittname sagt "Fassungen", also muessen alle drei dastehen.
          #
          # Bis zum 16.09.2026 stand hier ein grep-Muster, das ein KOMMA hinter
          # dem Namen verlangte (`WEB_VERSION', '…'`) — die Schreibweise von
          # `define()`. `server/version.php` schreibt aber
          # `const WEB_VERSION = '20.15.2';`. Das Muster traf nichts, `echo`
          # gibt trotzdem 0 zurueck, und der Schritt lief gruen, ohne die
          # Fassung je genannt zu haben. Jetzt fragt PHP die Konstante selbst:
          # Das haengt nicht an der Schreibweise und scheitert hoerbar, wenn es
          # sie nicht gibt.
          echo "Web:     $(php -r "require 'server/version.php'; echo WEB_VERSION;")"
          echo "Uhr:     $(grep -oE 'APP_VERSION *= *"[0-9.]+"' watch/source/Const.mc | grep -oE '[0-9.]+')"
          echo "Android: $(grep -oE '^version=[0-9.]+' android/version.properties | cut -d= -f2)"

      - name: Welche Bereiche sind berührt?
        # WARUM ES DIESEN SCHRITT GIBT (gemessen 17.09.2026). Der Lauf braucht
        # 42 min 28 s; davon sind 7:15 der Android-Bau und 34:46 das
        # Uebersetzen der Uhr-App fuer alle Zielgeraete. Die uebrigen 13
        # Schritte zusammen brauchen 23 Sekunden. Von den letzten 60 Commits
        # auf `main` fasst KEINER `android/` an und EINER `watch/` — 59 von 60
        # Laeufen messen also 42 Minuten lang Code, den niemand angefasst hat.
        #
        # DREI EIGENSCHAFTEN MACHEN DEN SPRUNG UNKRITISCH:
        #
        # (1) AUF `main` WIRD IMMER ALLES GEMESSEN. Der schlimmste Fehler
        #     dieses Schritts waere, faelschlich zu ueberspringen; auf `main`
        #     kann das nicht passieren. Und `main` ist der Stand, den ein Tag
        #     ausliefert — Tor 3 des Produktionslaufs verlangt einen gruenen
        #     Stufe-1-Lauf auf genau diesem Commit.
        # (2) IM ZWEIFEL WIRD GEMESSEN. Jeder Weg, auf dem der
        #     Vergleichsstand nicht zu ermitteln ist — neuer Zweig,
        #     Force-Push, fehlende Historie, `workflow_dispatch` —, endet bei
        #     „alles". Ein Filter, der bei Unklarheit ueberspringt, ist genau
        #     die Luecke, gegen die es ihn nicht gibt.
        # (3) EINE AUSLASSUNG NENNT IHREN GEGENSTAND. Ein uebersprungener
        #     Schritt laeuft nicht und kann daher selbst nichts melden —
        #     deshalb schreibt DIESER Schritt die Zeile in die
        #     Zusammenfassung, mit Bereich und Vergleichsstand. „Kein stilles
        #     Ueberspringen" (`CLAUDE.md` 6) gilt hier wie beim fehlenden SDK.
        #
        # UND DIE GRENZE, DIE NICHT VERSCHOBEN WIRD: Dieser Filter gilt fuer
        # ANDROID UND UHR. Beide werden von der Kette nicht ausgeliefert — der
        # FTPS-Schritt laedt `server/` hoch, die Signatur der Apps liegt
        # ausserhalb der CI (E-S4-16); eine ausgelassene Messung erreicht hier
        # keinen Server. Fuer einen `server/`-Schritt gilt das NICHT: Der
        # entscheidet ueber ausgelieferten Code, und eine Bedingung, die
        # darueber entscheidet, gehoert in ein Werkzeug mit `--selbstprobe`
        # (E-P5a-12, das Backup-Tor ist das Muster). Wer diesen Filter auf
        # PHP-Syntax, CSP oder Sitzungshaertung ausdehnt, aendert seine Natur.
        id: bereiche
        env:
          VORHER_SHA: ${{ github.event.before }}
        run: |
          alles() {
            echo "android=ja" >> "$GITHUB_OUTPUT"
            echo "uhr=ja"     >> "$GITHUB_OUTPUT"
            echo "Bereichserkennung: ALLES messen — $1"
            echo "**Bereiche:** alles gemessen ($1)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # (1) main misst immer alles.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            alles "Push auf main"
          fi

          # Vergleichsstand je Anlass.
          vorher=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # Bei einem PR checkt die Aktion den MERGE-Commit aus. Dessen
              # merge-base mit dem Zielzweig ist der Zielzweig selbst, der
              # Diff dagegen also genau die Aenderung des PR.
              git fetch --no-tags --quiet origin                   "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"                   2>/dev/null || true
              vorher=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD 2>/dev/null || echo '')
              ;;
            push)
              kandidat="${VORHER_SHA:-}"
              case "$kandidat" in
                ''|0000000000000000000000000000000000000000) kandidat="" ;;
              esac
              # Nach einem Force-Push kann das Vorher unerreichbar sein.
              #
              # ZWEI SCHICHTEN, JEDE FUER SICH AUSREICHEND — nachgemessen
              # am 17.09.2026 mit drei Mutationen:
              #
              #   nur `cat-file` entwaffnet     -> Lage bleibt richtig
              #                                    (der `__FEHLER__`-Zweig
              #                                    unten faengt sie)
              #   nur `__FEHLER__` entwaffnet   -> Lage bleibt richtig
              #                                    (diese Zeile faengt sie)
              #   BEIDE entwaffnet              -> Lage faellt um: nein/nein
              #
              # Im unmutierten Lauf faengt DIESE Zeile: Das Protokoll sagt
              # „Vergleichsstand nicht ermittelbar", nicht „git diff
              # gescheitert". Keine der beiden ist ueberfluessig, und keine
              # einzelne Mutation kann die Luecke oeffnen — wer die Zeile
              # streicht, weil „die andere es ja auch faengt", nimmt der
              # Bauform genau diese Eigenschaft.
              if [ -n "$kandidat" ] && git cat-file -e "${kandidat}^{commit}" 2>/dev/null; then
                vorher="$kandidat"
              fi
              ;;
          esac

          # (2) Im Zweifel messen.
          if [ -z "$vorher" ]; then
            alles "Vergleichsstand nicht ermittelbar (Anlass $GITHUB_EVENT_NAME)"
          fi

          dateien=$(git diff --name-only "$vorher" HEAD 2>/dev/null || echo '__FEHLER__')
          if [ "$dateien" = "__FEHLER__" ]; then
            alles "git diff gegen $vorher gescheitert"
          fi

          anzahl=$(printf '%s\n' "$dateien" | grep -c . || true)
          echo "Vergleichsstand: $vorher · geänderte Dateien: $anzahl"

          hat() { printf '%s\n' "$dateien" | grep -qE "$1"; }

          # Wer den Prüflauf selbst ändert, fährt beides.
          if hat '^\.github/workflows/pruefung\.yml$'; then
            alles "der Prüflauf selbst ist geändert"
          fi

          android=nein
          uhr=nein
          if hat '^android/'; then android=ja; fi
          if hat '^(watch/|tools/uhr-pruefstand/)'; then uhr=ja; fi

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "uhr=$uhr"         >> "$GITHUB_OUTPUT"
          echo "android=$android · uhr=$uhr"

          # (3) Die Auslassung nennt ihren Gegenstand.
          kurz=$(git rev-parse --short "$vorher")
          {
            if [ "$android" = nein ]; then
              echo "**Android: NICHT BERÜHRT** — 0 von $anzahl geänderten Dateien liegen unter \`android/\` (gegenüber \`$kurz\`); nicht gemessen."
            fi
            if [ "$uhr" = nein ]; then
              echo "**Uhr Stufe I: NICHT BERÜHRT** — 0 von $anzahl geänderten Dateien liegen unter \`watch/\` oder \`tools/uhr-pruefstand/\` (gegenüber \`$kurz\`); nicht gemessen."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: PHP-Syntax über server/
        # `php -l` je Datei. Ein Syntaxfehler in einer Datei, die nur auf einem
        # selten begangenen Weg geladen wird, fällt sonst erst dort auf — und
        # „dort" heisst nach einem Deploy auf Produktiv.
        run: |
          set -e
          n=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null
            n=$((n+1))
          done < <(find server tools -name '*.php' -type f)
          echo "PHP-Dateien ohne Syntaxfehler: $n"
          echo "PHP-Syntax: $n Dateien, 0 Fehler" >> "$GITHUB_STEP_SUMMARY"

      - name: Wortliste — sind Land und Luft neutral benannt?
        # Erwartet werden null Treffer ausserhalb der Ausnahmeliste UND null
        # ungenutzte Ausnahmen; beides steckt im Rückgabewert.
        run: |
          # DER RUECKGABEWERT WIRD AUFGEFANGEN, NICHT VERSCHLUCKT.
          #
          # Bis zum 16.09.2026 stand hier `wortliste.py | tee …`. Ohne
          # `pipefail` ist der Wert einer Pipe der des LETZTEN Glieds, und
          # `tee` gibt immer 0 — dieser Schritt konnte NIE ROT WERDEN.
          #
          # `pipefail` steht jetzt oben, und damit wuerde die Pipe richtig rot.
          # Nur: Bei `bash -e` bricht der Block dann an DIESER Zeile ab, und
          # die Zusammenfassung unten bliebe leer — ausgerechnet in dem Lauf,
          # in dem man sie lesen will. Deshalb der Umweg ueber `$rc`: erst
          # schreiben, dann scheitern.
          rc=0
          python3 tools/wortliste/wortliste.py > /tmp/wortliste.txt 2>&1 || rc=$?
          cat /tmp/wortliste.txt
          {
            echo '```'
            tail -20 /tmp/wortliste.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Wortliste: Treffer außerhalb der Ausnahmen, ungenutzte Ausnahmen oder durchgerutschte Fallen (Rückgabewert $rc)."
            exit "$rc"
          fi

      - name: Vollständigkeit des Stylesheets
        # GEGEN EINE SCHWELLE, NICHT GEGEN NULL — und das war hier von Anfang
        # an falsch (behoben mit Web 20.8.0). Dieses Werkzeug misst einen
        # ALTBESTAND aus P3: Unicode-Zeichen im Markup, `style=`-Attribute in
        # JavaScript, Emoji. „0 Befunde" ist ein Ziel, kein erreichbarer
        # Zustand — der Stand lag schon bei der Einführung dieses Laufs bei
        # 340. Der Schritt verlangte trotzdem `exit 0` und war damit bei JEDEM
        # Push rot; ein Tor, das immer rot ist, sagt nichts mehr.
        #
        # Die Schwelle wirkt in BEIDE Richtungen: Wächst der Altbestand, ist
        # das ein Befund. Schrumpft er, ebenfalls — dann ist die Zahl hier
        # nachzuziehen, sonst bekommt er stillschweigend wieder Luft.
        #
        # 367 (Web 20.9.1). Der Weg dahin, weil er eine Lehre enthaelt:
        #
        # 371 stand hier waehrend des Umzugs auf den Mailkatalog — dieselben
        # Texte lagen im Katalog UND noch in den alten Aufrufern, und das
        # Werkzeug liest ganze Dateien, nicht nur Markup (Backlog Nr. 184).
        # Mit dem letzten Umzug fiel der Doppelbestand weg.
        #
        # DANN STAND HIER 366, UND DAS WAR FALSCH GEMESSEN. Die Zahl entstand
        # mitten in AP5, VOR den letzten Kommentar- und Dokumentationszeilen
        # desselben Pakets; committet wurde ein Stand mit 367. Der Lauf auf
        # `main` war damit rot, und zwar wegen UNTERSCHREITUNG — das Werkzeug
        # hat genau das getan, wofuer die Schwelle in beide Richtungen wirkt.
        # `CLAUDE.md` 6 sagt es als Regel: „Die Pruefmittel laufen zuletzt,
        # nicht zwischendurch. Ein Werkzeug, das vor der letzten Aenderung
        # lief, misst einen Stand, den es nicht mehr gibt."
        #
        # Gemessen am 16.09.2026 gegen den ausgecheckten Stand (eigener
        # Arbeitsbaum, nicht der Arbeitskopie): 50 + 10 + 299 + 8 = 367.
        #
        # 372 MIT AP6 (Web 20.10.0): +5 Pfeile „Betrieb -> Status" in den neuen
        # sichtbaren Texten. Die Zahl zaehlt Unicode-Zeichen im Markup und kann
        # Prosa nicht von einem Symbol unterscheiden (Backlog Nr. 184) — der
        # Pfeil in „Verwaltung -> Installation" ist die Hausschreibweise und
        # steht so an hundert Stellen. Was AP6 an ZIERDE mitgebracht hatte —
        # fuenf Auslassungszeichen in Kommentaren und Probenbeschriftungen —
        # ist wieder entfernt, statt die Zahl damit wachsen zu lassen.
        #
        # 387 MIT P5b (Web 20.21.1): +10. Gleiche Rechnung, gleiche Reihenfolge.
        # P5b brachte zunaechst +18; ZWOELF davon waren Zierde in Kommentaren
        # und in einem error_log() und sind entfernt (Pfeil zu "->",
        # Auslassung zu "..."). Die verbleibenden ZEHN stehen in SICHTBAREM
        # Text: „Unter Einstellungen -> Konto", „unter Betrieb -> Updates die
        # Migration ausfuehren", „Du wirst abgemeldet ...". Sie zu aendern
        # hiesse, den Hausstil an zehn Stellen zu brechen, damit eine Zahl
        # gleich bleibt, die ohnehin das Falsche misst.
        #
        # WAS SIE MISST, IST JETZT AUSGEZAEHLT (Backlog Nr. 227): von 319
        # Befunden sind 195 „...", 104 Pfeile — zusammen 299 Satzzeichen in
        # Prosa. Nur ZWANZIG sind Zeichen, die wirklich statt eines Symbols
        # stehen. Solange die Liste beide Sorten in einen Topf wirft, kann
        # diese Schwelle nur steigen. Der Weg heraus steht in Nr. 227.
        #
        # 388 MIT P5b/AP3: +1. Der Pfeil in „Verwaltung -> NutzerInnen" im Text
        # der Sammelmail an die Verwaltung (konto_lib.php) — sichtbarer Text,
        # Hausschreibweise, dieselbe Form wie „Betrieb -> Status" zwei Dateien
        # weiter in ratelimit_lib.php. Nach derselben Regel behandelt wie die
        # zehn davor: Zierde raus, sichtbarer Text bleibt.
        #
        # 398 MIT P5b/AP9: +10, alle zehn in drei neuen Dateien. Nachgezaehlt
        # mit `--ausfuehrlich` gegen denselben Lauf auf HEAD, nicht geschaetzt:
        #   api/schluesselblatt_pruefen.php  5  (2 Pfeile, 3 Auslassungen)
        #   notfallblatt.php                 4  (Pfeile in „Einstellungen ->
        #                                       Konto" und im Bedienweg)
        #   blatt_dialog.php                 1  („Betrieb -> Schluesselblatt")
        # Sieben Pfeile und drei Auslassungspunkte, alle in sichtbarem Text,
        # alle in der Hausschreibweise der elf davor.
        #
        # MEIN ERSTER EINTRAG HIER WAR FALSCH: Ich hatte die zehn auf fuenf
        # Dateien verteilt, ohne nachzuzaehlen — `einstellungen.php`,
        # `erststart_karte.php` und `rueckfrage_dialog.php` steuern in
        # Wahrheit KEINEN Befund bei. Eine Aufschluesselung, die nicht
        # gemessen ist, ist schlimmer als keine: Sie sieht aus wie ein Beleg.
        #
        # Die drei anderen Gruppen stehen unveraendert: 50 ohne Gegenstueck,
        # 10 style="...", 8 Emoji — dieses Paket hat keine davon hinzugefuegt.
        run: python3 tools/vollstaendigkeit/pruefen.py --hoechstens 398

      - name: Kontraste der Token
        run: python3 tools/screenshots/kontrast.py

      - name: Kettenaufrufe — passt jeder Aufruf zu seinem Werkzeug?
        # WARUM DAS IN STUFE 1 GEHOERT (Nr. 217, 17.09.2026).
        #
        # Die Kette ruft Werkzeuge dieses Projekts auf. Ob ein Aufruf zur
        # Schnittstelle passt, zeigte sich bisher erst, wenn der Schritt LIEF —
        # und viele laufen selten: Stufe 2 erst mit eingerichtetem Staging, der
        # Produktionslauf erst beim ersten Tag. Am 16./17.09.2026 sind drei
        # Aufrufe beim jeweils ERSTEN echten Lauf gescheitert, alle drei mit
        # gueltigem YAML und sauberer Shell-Syntax.
        #
        # Diese Pruefung liest den Quelltext der Werkzeuge und FUEHRT KEINES
        # AUS. Sie kostet Sekunden und faengt genau die Klasse Fehler, die
        # sonst erst der Ernstfall zeigt.
        run: |
          python3 tools/kettenaufrufe/pruefen.py --probe
          python3 tools/kettenaufrufe/pruefen.py

      - name: Tore der Kette — geht das Backup-Tor auch zu?
        # WARUM DIESE SELBSTPROBE IN STUFE 1 GEHOERT (17.09.2026).
        #
        # Sie lief bisher NUR im Job `produktion` von `auslieferung.yml`, also
        # erst beim Tag — unmittelbar vor dem Backup-Tor, das sie nachweisen
        # soll. Fuer das Tor selbst ist das der richtige Ort und bleibt es.
        # Aber seit Web 20.16.0 haengen dort auch die fuenf Faelle des
        # Unterbefehls `pause`, und der laeuft in STUFE 2. Wer ihn kaputt
        # macht, bekam von Stufe 1 ein Gruen, von Stufe 2 je nach Staging
        # irgendetwas — und die Probe, die es gemerkt haette, lief erst bei
        # der Auslieferung.
        #
        # Sie braucht kein Netz und keine Installation (Attrappen statt
        # Abrufe) und kostet Sekunden. Erwartet: 11 von 11.
        run: python3 tools/kette/tor.py --selbstprobe

      - name: Python-Werkzeuge — lassen sie sich überhaupt übersetzen?
        # ANLASS, 20.09.2026: Ein deutsches Schlusszeichen in einer
        # doppelt gequoteten Zeichenkette hat `tools/kette/zustand.py`
        # unuebersetzbar gemacht -- gemerkt hat es erst der Produktivlauf,
        # und der war damit umsonst. Die Aenderung war eine Meldung, und
        # die Selbstprobe war VORHER gelaufen; genau davor warnt
        # `CLAUDE.md` 6 ("Die Pruefmittel laufen zuletzt").
        #
        # DIESER SCHRITT IST DER RIEGEL DAZU. Er kostet eine Sekunde und
        # faengt jeden Syntaxfehler in JEDEM Werkzeug, auch in denen, die
        # keine Selbstprobe haben und die niemand mehr faehrt.
        #
        # `ast.parse` statt `py_compile`: Es schreibt nichts und braucht
        # kein Ausgabeziel.
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          fehler = n = 0
          for p in sorted(pathlib.Path('tools').rglob('*.py')):
              n += 1
              try:
                  ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
              except SyntaxError as e:
                  fehler += 1
                  print(f"::error file={p},line={e.lineno}::{e.msg}")
          print(f"{n} Python-Werkzeuge geprüft, {fehler} mit Syntaxfehler")
          sys.exit(1 if fehler else 0)
          PY

      - name: Backlog — keine Nummer zweimal
        # Die Zeile stammt aus dem Kopf des Rahmenplans (Abschnitt 2.2).
        run: |
          doppelt=$(grep -oE '^[0-9]+\.' docs/Backlog.md | tr -d '.' | sort -n | uniq -d)
          if [ -n "$doppelt" ]; then
            echo "Doppelte Backlog-Nummern: $doppelt"
            exit 1
          fi
          echo "Doppelte Backlog-Nummern: 0"

      - name: Handbuch und „Was ist NAdoku" — rendern sie überhaupt?
        # P5b/AP8, E-P5b-22. Seit Web 20.23.0 rendert die ANWENDUNG diese
        # beiden Dateien (`hilfe.php`, `ueber.php`). Damit ist ein
        # Markdown-Fehler darin kein Schönheitsfehler mehr, sondern eine
        # kaputte Seite — und zwar eine oeffentliche, die jemand VOR der
        # Anmeldung sieht.
        #
        # `cmark-gfm --validate-utf8` ist hier der billigste ehrliche Test:
        # Er faellt bei ungueltigem UTF-8 und bei Eingaben, die der Parser
        # nicht verarbeiten kann. Er prueft NICHT, ob der Text stimmt — das
        # tut die Wortliste einen Schritt weiter oben, und gegenlesen muss
        # ihn ohnehin ein Mensch.
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq cmark-gfm
          fehler=0
          for f in docs/Handbuch.md docs/Was-ist-NAdoku.md; do
            if [ ! -f "$f" ]; then
              echo "::error::$f fehlt — hilfe.php bzw. ueber.php zeigen dann „Dieses Dokument fehlt”."
              fehler=1; continue
            fi
            if cmark-gfm --validate-utf8 --to html "$f" > /dev/null; then
              echo "  $f rendert ($(wc -c < "$f") Bytes)"
            else
              echo "::error::$f rendert nicht."
              fehler=1
            fi
          done
          # DIE ZWEITE PRUEFUNG IST DIE WICHTIGERE: ein Bild aus fremder
          # Quelle. `DokuMarkdown::inlineImage()` weist es zur Laufzeit ab,
          # aber dann steht im Handbuch eine Stelle, die nicht tut, was ihre
          # Autorin wollte — besser, es faellt hier auf.
          fremd=$(grep -nE '!\[[^]]*\]\((https?:)?//' docs/Handbuch.md docs/Was-ist-NAdoku.md || true)
          if [ -n "$fremd" ]; then
            echo "::error::Bild aus fremder Quelle im Handbuch — die Anwendung zeigt es nicht an (keine fremde Quelle zur Laufzeit, CLAUDE.md 4):"
            echo "$fremd"
            fehler=1
          fi
          exit $fehler

      - name: Die Weiche in install.php — traegt sie noch?
        # `install.php` beginnt mit einer Versionspruefung. Die nuetzt nur,
        # solange die Datei auf der alten Fassung ueberhaupt noch UEBERSETZT
        # werden kann — PHP uebersetzt eine Datei ganz, bevor es die erste
        # Zeile ausfuehrt. Eine `match`-Anweisung weiter unten, und die
        # Besucherin auf PHP 8.0 bekommt statt der Erklaerung einen Parse
        # Error. Gemessen wird mit dem Tokenizer, nicht mit `grep`.
        run: |
          php tools/installweiche/pruefen.php --selbstprobe
          php tools/installweiche/pruefen.php

      - name: Migrationsregister — schema.sql gegen migration_lib.php
        # Selbstprobe zuerst: Ein grüner Lauf einer Prüfung, die immer grün
        # meldet, sieht genauso aus wie einer, der nichts gefunden hat.
        run: |
          php tools/migrationsregister/pruefen.php --selbstprobe
          php tools/migrationsregister/pruefen.php

      - name: CSP — Inline-Skripte ohne Nonce
        # Seit Web 20.7.0 gilt `script-src 'self' 'nonce-…'` ohne
        # `'unsafe-inline'`. Ein vergessener Nonce legt eine Seite STILL
        # lahm: kein PHP-Fehler, kein Protokolleintrag — der Knopf tut
        # nichts, und die Meldung steht in der Konsole derjenigen, der es
        # passiert. Gemessen mit dem Tokenizer über ein Markup-Bild, weil
        # `<script src="<?= asset(…) ?>">` in drei Stücke zerfällt und ein
        # naives `grep` deshalb null von 108 Stellen fände.
        run: |
          php tools/cspprobe/pruefen.php --selbstprobe
          php tools/cspprobe/pruefen.php

      - name: Sitzungshärtung — `use_strict_mode` vor jedem `session_start()`
        # Die Zeile ist unscheinbar und steht neben dem Aufruf, den sie
        # schuetzt. Ein neuer Weg, der sie vergisst, sieht genauso aus wie
        # einer, der sie hat — und es passiert nichts, was auffiele. Bis
        # Web 20.9.1 stand sie an genau zwei Stellen, und zwar ausgerechnet
        # den beiden, die KEINE Anmeldesitzung tragen (Backlog Nr. 205).
        # Gemessen mit dem Tokenizer, nicht mit `grep`: Die erste Fassung
        # dieser Pruefung meldete zwei Befunde, und beide waren Kommentare.
        run: |
          php tools/sitzungshaertung/pruefen.php --selbstprobe
          php tools/sitzungshaertung/pruefen.php

      - name: Jobregister — steht in Technik.md noch, was in jobs_lib.php steht?
        # ZUARBEIT AUS SCHRITT 16 (Backlog Nr. 208). Das Werkzeug liegt seit
        # Web 20.26.0 vor und hing nicht — Schritt 16 fasst `.github/` nicht
        # an, deshalb hängt es hier.
        #
        # WOGEGEN: Die Tabelle „Der Katalog" in `docs/Technik.md` 4.97a wurde
        # VON HAND gegen `server/jobs_lib.php` gepflegt, und sie lief
        # auseinander — gemessen vor der Behebung: 11 Jobs im Code gegen 9 im
        # Register, 16 Räumschritte gegen „dreizehn". Eine Dokumentation, die
        # in der Zahl irrt, ist schlimmer als keine: Sie wird geglaubt.
        #
        # OHNE BEDINGUNG UND OHNE INSTALLATION. Es liest beide Seiten mit dem
        # PHP-Tokenizer und rechnet in Millisekunden — es gibt keinen Grund,
        # es an eine Bereichserkennung zu hängen.
        run: |
          php tools/jobregister/pruefen.php --selbstprobe
          php tools/jobregister/pruefen.php

      - name: Java 21 für die Android-Module
        if: steps.bereiche.outputs.android == 'ja'
        # WARUM AUSDRÜCKLICH. Bis hierher lief der Android-Bau auf dem JDK, das
        # das Läuferabbild gerade mitbringt — eine Zahl, die sich ohne unser
        # Zutun ändert. Ein Gradle-Lauf, der auf dem Entwicklungsrechner (Java
        # 21) grün ist und in der Kette auf einem anderen JDK rot wird, ist ein
        # Fehlschlag ohne Aussage. `setup-java` schreibt die Zahl fest.
        #
        # DIE MODULE ZIELEN AUF 17 (`JavaVersion.VERSION_17` in beiden
        # `build.gradle.kts`) — das bleibt so. 17 ist das Ziel des erzeugten
        # Bytecodes, 21 ist das JDK, das Gradle selbst ausführt; das eine sagt
        # nichts über das andere.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android — bauen, prüfen, linten
        id: androidbau
        if: steps.bereiche.outputs.android == 'ja'
        # 0 Lint-Fehler und 0 Fehlschläge; der Rückgabewert von Gradle trägt
        # beides. Das Android-SDK bringt der Läufer mit (ANDROID_HOME ist
        # gesetzt); ist es das ausnahmsweise nicht, wird der Schritt
        # AUSDRÜCKLICH übersprungen und sagt es.
        working-directory: android
        run: |
          if [ -z "${ANDROID_HOME:-}" ] && [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "::warning::Android-SDK fehlt auf diesem Läufer — Bauläufe ÜBERSPRUNGEN, nicht bestanden."
            echo '**Android: ÜBERSPRUNGEN** (kein SDK auf dem Läufer) — nicht gemessen.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Android — Berichte des Fehlschlags mitnehmen
        # WARUM ES DIESEN SCHRITT GIBT (gemessen 20.09.2026, Lauf #98). Der
        # Android-Schritt meldete „Execution failed for task
        # ':handy:testDebugUnitTest'" und danach nur noch den Rat, es mit
        # `--info` zu versuchen. WELCHER Prüffall gefallen war, stand nirgends
        # — die Kette weiß es, schreibt es in `build/reports/tests/` und wirft
        # den Läufer danach weg. Ein roter Lauf, der seinen Gegenstand nicht
        # nennt, kostet einen zweiten Lauf, nur um ihn zu erfahren.
        #
        # `if: failure()` UND NICHT `always()`: Bei Grün gibt es nichts zu
        # lesen, und jedes Artefakt kostet Speicherplatz und Zeit.
        # `reports/**` trägt beides — die HTML-Berichte der Prüffälle UND die
        # Lint-Ergebnisse (`lint-results-*.html`), die daneben liegen;
        # `test-results/**` die JUnit-XML für maschinelles Lesen.
        #
        # AN DEN ANDROID-SCHRITT GEBUNDEN, nicht an `failure()` allein: Ein
        # Fehlschlag weiter oben (Wortliste, `php -l`) überspringt den
        # Android-Bau, und dann gibt es keinen Ordner `build/` — das Artefakt
        # wäre leer und die Warnung darüber verwirrend.
        if: failure() && steps.androidbau.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: android-berichte
          path: |
            android/*/build/reports/**
            android/*/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

      - name: Uhr Stufe I — für alle Zielgeräte übersetzen
        if: steps.bereiche.outputs.uhr == 'ja'
        # BRAUCHT `CIQ_GERAETE_URL`. Die Adresse steht bewusst nicht im
        # Repositorium (`tools/uhr-pruefstand/LIESMICH.md`, Abschnitt
        # „Quelle"): Es ist öffentlich, die Dateien gehören Garmin. Sie kommt
        # als Umgebungsgeheimnis herein; fehlt sie, wird der Schritt
        # ÜBERSPRUNGEN UND GESAGT — nie ein stilles Grün (E-P5a-13).
        env:
          CIQ_GERAETE_URL: ${{ secrets.CIQ_GERAETE_URL }}
        run: |
          # ZURÜCK AUF DAS JDK DES LÄUFERS (E-KH-24). Lief der Android-Schritt
          # vorher, hat `setup-java` JAVA_HOME und PATH global auf Java 21
          # umgestellt. `monkeyc` ist ein Shell-Vorspann, der `java` vom PATH
          # nimmt — er bekäme die 21 ungefragt mit. Dieser Schritt übersetzt
          # für alle Zielgeräte und dauert rund 35 Minuten; ein Fehlschlag
          # darin, verursacht von einer Änderung am Android-Bau, wäre teuer und
          # schwer zuzuordnen. Also ausdrücklich zurück, und gesagt, worauf.
          if [ -n "${JAVA_HOME_LAEUFER:-}" ]; then
            export JAVA_HOME="$JAVA_HOME_LAEUFER"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          echo "Uhr übersetzt mit: $(java -version 2>&1 | head -1)"
          if [ -z "${CIQ_GERAETE_URL:-}" ]; then
            echo "::warning::CIQ_GERAETE_URL nicht gesetzt — Uhr Stufe I ÜBERSPRUNGEN, nicht bestanden."
            echo '**Uhr Stufe I: ÜBERSPRUNGEN** (kein `CIQ_GERAETE_URL`) — nicht gemessen.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `aufbau-uebersetzen` UND NICHT `aufbau` (16.09.2026): Stufe I
          # uebersetzt nur. `aufbau` holt zusaetzlich die
          # Simulator-Bibliotheken (webkit2gtk, xvfb, xdotool) per
          # apt-get — das braucht auf einem Laeufer `sudo`, laedt .deb-
          # Pakete nach und kostet Minuten fuer etwas, das hier nie
          # startet. Der erste echte Lauf ist genau daran gescheitert:
          # "FEHLER: apt-get fehlgeschlagen".
          CIQ_ZIELE=alle tools/uhr-pruefstand/pruefstand.sh aufbau-uebersetzen
          python3 tools/uhr-pruefstand/geraeteklassen.py "$HOME/.Garmin/ConnectIQ/Devices" \
                  --vertreter 5 --liste /tmp/vertreter.txt --alle-liste /tmp/auswahl.txt
          tools/uhr-pruefstand/pruefstand.sh reihe /tmp/auswahl.txt

  # ---------------------------------------------------------------------------
  # EIGENER AUFTRAG, WEIL DIENSTBEHÄLTER JOB-WEIT SIND. GitHub bindet
  # `services:` an den Auftrag, nicht an den Schritt; eine Matrix über zwei
  # Datenbankfassungen geht deshalb nur als eigener Auftrag. Er kostet nichts,
  # was Stufe 1 verlangsamt: Beide Läufe starten parallel zur `pruefung`.
  #
  # WOGEGEN (Backlog Nr. 238). Am 20.09.2026 scheiterte die Einrichtung auf
  # dem neuen Staging-Webspace an `1064 … near 'manual TINYINT(1) …'` — MySQL
  # führt MANUAL von 8.4.0 bis 8.4.10 als reserviertes Wort. Dahinter lag ein
  # zweiter Fehler, den erst das Beheben des ersten sichtbar machte:
  # `DEFAULT UTC_TIMESTAMP()` ohne Klammern, von MySQL auf JEDER Fassung
  # abgewiesen. Die Anwendung ließ sich seit Web 20.16.5 auf MySQL überhaupt
  # nicht einrichten.
  #
  # BEIDE HATTEN DIESELBE URSACHE, und sie ist nicht SQL: Entwickelt und
  # geprüft wurde gegen MariaDB, ausgeliefert wird gegen MySQL. Deshalb steht
  # hier eine MATRIX und kein einzelner Lauf — eine Fassung belegt nichts über
  # die andere, und genau diese Verwechslung war der Fehler.
  #
  # DIE BEIDEN FASSUNGEN SIND NICHT BELIEBIG GEWÄHLT:
  #   mysql:8.4.0    die Fassung, an der es gescheitert ist (und die letzte,
  #                  die MANUAL noch reserviert — ab 8.4.11 ist es wieder frei)
  #   mariadb:10.6   die dokumentierte Untergrenze (`docs/Technik.md` 7,
  #                  `plattform_lib.php` PLATTFORM_MARIADB_MIN)
  schema:
    name: Schema gegen ${{ matrix.db.name }}
    runs-on: ubuntu-latest
    strategy:
      # KEIN `fail-fast`. Scheitert eine Fassung, will man wissen, ob die
      # andere auch scheitert — das ist der Unterschied zwischen „unser
      # Schema ist kaputt" und „unser Schema passt zu einer Fassung nicht".
      fail-fast: false
      matrix:
        db:
          - name: MySQL 8.4.0
            image: mysql:8.4.0
            klient: mysql
            pass_env: MYSQL_ROOT_PASSWORD
            gesund: mysqladmin ping -uroot -pschemaprobe
          - name: MariaDB 10.6
            image: mariadb:10.6
            klient: mariadb
            pass_env: MARIADB_ROOT_PASSWORD
            gesund: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          # Der Name der Variablen unterscheidet sich zwischen den Abbildern;
          # das jeweils andere wird schlicht ignoriert.
          MYSQL_ROOT_PASSWORD: schemaprobe
          MARIADB_ROOT_PASSWORD: schemaprobe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.gesund }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Datenbank-Klient bereitstellen
        # Der Läufer bringt den `mysql`-Klienten mit, den `mariadb`-Klienten
        # nicht immer. Er wird nur nachgeladen, wenn er fehlt — und wenn das
        # scheitert, scheitert der Schritt, statt still auf den anderen
        # Klienten auszuweichen (ein Lauf mit dem falschen Klienten misst
        # etwas anderes, als er behauptet).
        run: |
          if command -v ${{ matrix.db.klient }} >/dev/null 2>&1; then
            echo "${{ matrix.db.klient }} ist da: $(${{ matrix.db.klient }} --version)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq mariadb-client
            echo "nachgeladen: $(${{ matrix.db.klient }} --version)"
          fi

      - name: Selbstprobe — zählt die Probe einen Fehlschlag überhaupt?
        # Zuerst, aus demselben Grund wie beim Migrationsregister: Ein grüner
        # Lauf einer Prüfung, die immer grün meldet, sieht genauso aus wie
        # einer, der nichts gefunden hat.
        #
        # `--klient` MUSS MIT, obwohl die Selbstprobe keine Datenbank braucht:
        # Sie prüft unter anderem, ob der Klient aufrufbar ist, und ohne den
        # Schalter prüft sie den VORGABEWERT `mariadb` statt den, mit dem der
        # Lauf darunter arbeitet. Im ersten Kettenlauf ist genau das passiert
        # — der MySQL-Auftrag wurde rot gemeldet, weil auf dem Läufer kein
        # `mariadb` liegt, während der eigentliche Lauf grün gewesen wäre.
        run: php tools/schemaprobe/probe.php --selbstprobe --klient ${{ matrix.db.klient }}

      - name: Schemaprobe — schema.sql und die Migrationen
        run: |
          php tools/schemaprobe/probe.php \
              --datenbank nadoku_schemaprobe \
              --host 127.0.0.1 --port 3306 \
              --benutzer root --passwort schemaprobe \
              --klient ${{ matrix.db.klient }} \
            | tee /tmp/schemaprobe.txt
          {
            echo "### Schemaprobe — ${{ matrix.db.name }}"
            echo '```'
            tail -1 /tmp/schemaprobe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
