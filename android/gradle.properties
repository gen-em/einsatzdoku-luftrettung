# Speicher fuer den Gradle-Prozess. Ohne die Angabe nimmt Gradle einen kleinen
# Vorgabewert; der Kotlin-Uebersetzer und die Ressourcenverarbeitung von AGP
# laufen damit auf schwaecheren Maschinen in einen Speicherfehler, der wie ein
# Fehler im Bauskript aussieht.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# AndroidX statt der abgeloesten Support-Bibliothek. Ohne diese Zeile bricht
# AGP den Lauf ab, sobald eine AndroidX-Abhaengigkeit auftaucht.
android.useAndroidX=true

# Nicht-transitive R-Klassen: Jedes Modul sieht nur seine EIGENEN Ressourcen.
# Das ist die Vorgabe seit AGP 8 und haelt die Module auseinander.
android.nonTransitiveRClass=true

# Baulaeufe parallel und mit Zwischenspeicher. Beide Module haengen nicht
# voneinander ab (der gemeinsame Quelltext wird in beide EINGEBUNDEN, nicht
# ueber eine Modulgrenze geholt -- siehe LIESMICH.md), sie koennen also
# nebeneinander laufen.
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin-Uebersetzung in einem eigenen Prozess. Der Vorgabewert "daemon" haelt
# einen zweiten Prozess dauerhaft offen; im Container ist das verschenkter
# Speicher, und beim Bau in der CI (R40.4) ohnehin.
kotlin.compiler.execution.strategy=in-process

# RELEASE-PRUEFFAELLE BLEIBEN AN (AR-02, F-AR-08). AGP 9 legt Prueffaelle nur
# noch fuer die gepruefte Bauart an (debug) -- `testReleaseUnitTest` entfiele
# still, und mit ihm der Fall, der nur im Release laufen kann
# (`ServeradresseTest`, "nur im Release", Backlog Nr. 142). Ein Prueffall, der
# ohne Meldung verschwindet, ist ein stilles Ueberspringen.
android.onlyEnableUnitTestForTheTestedBuildType=false
