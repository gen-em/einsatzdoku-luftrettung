# ---------------------------------------------------------------------------
# Version der Android-Anwendung (Handy und Uhr).
#
# EINE Zaehlung fuer BEIDE Module (E-S4-02). Handy- und Uhr-Modul entstehen aus
# einem Baulauf, tragen dieselbe Anwendungs-ID und dieselbe Signatur (E-S4-01)
# und werden zusammen ausgeliefert -- zwei Nummern waeren zwei Wahrheiten ueber
# denselben Stand. Im Changelog traegt sie das Praefix "Android", neben "Web"
# (server/version.php) und "Uhr" (watch/source/Const.mc, Garmin).
#
# Zaehlweise wie im uebrigen Repositorium ("Haupt.Neben.Korrektur"):
#   Haupt      grundlegender Umbau -- Datenmodell des Puffers, Sendeweg,
#              Vertragsstand, oder spuerbar veraenderte Wege durch die App
#   Neben      neue Funktionen und Felder
#   Korrektur  Fehlerbehebung und Feinschliff
#
# WARUM DIE HAUPTNUMMER 0 IST. Die App ist bis zum Abschluss von Block B und C
# nicht benutzbar: Bis B2 kann sie sich nicht koppeln, bis B4 nichts senden.
# Eine 1.0.0 auf einem Stand, der noch nichts tut, waere eine falsche Zusage --
# und die erste 1.0.0 gehoert ohnehin an das Ende des Geraetetests (E-R45-7),
# nicht an den ersten Baulauf. Bis dahin zaehlt die Nebennummer die
# Arbeitspakete:
#
#   0.1.0  B1  Geruest, Probebau, Signaturkonzept, Farb-Token, Bildmarken
#   0.2.0  B2  Kopplung, Trennen, Schluesselablage
#   0.3.0  B3  Aufzeichnung und Dienstklammer
#   0.4.0  B4  Senden (Warteschlange, Chunks, Fehlerpfade)
#   0.5.0  B5  Phasen und Einsaetze am Handy
#   0.6.0  C1  Uhr-Modul: Geruest und Bedienbild
#   0.7.0  C2  Nachrichtenweg mit Quittung und Puffer
#   0.7.6  D2  Instrumentierte Prueffaelle -- Keystore und Data-Layer-Grenze
#   0.7.7  R58 Bedienhoehe 48 dp in beiden Modulen (Backlog Nr. 64)
#   0.8.0  E1  Ortungswaechter: die App sagt, ob sie wirklich aufzeichnet
#   0.8.1  E1  Bilderlauf fuer beide Module -- und was er sofort fand
#   0.9.0  E2  Dienstende und Nachsenden: was gesendet werden soll, wird
#              gesendet -- auch ohne Netz, auch nach einem Neustart
#   0.10.0 E3  Die Uhr erfaehrt es, ohne zu fragen
#   0.10.1     Phasenliste gekuerzt -- "Einsatz abschliessen" ist wieder da
#   0.11.0     Kopplung umgekehrt (Vertrag 1a), feste Serveradresse, App-Name,
#              Fenster-Insets -- der S4-Rest, Paket 1
#   0.11.1     Akku-Hinweis (Nr. 82), Versionscode-Versatz der Uhr (Nr. 98),
#              roundIcon ausgetragen (Nr. 81) -- der S4-Rest, Paket 3
#   0.12.0     Akkuwarnung bei 25/15/10 %, ab 15 % mit Angebot Dienstende
#
# 0.12.0 IST DIE NEBENNUMMER: Die App bekommt eine Funktion dazu, die sie nicht
# hatte -- sie beobachtet den Ladestand, waehrend sie aufzeichnet, und meldet
# sich bei drei Schwellen. Bis 0.11.1 sagte sie das Thema einmal beim ersten
# Dienstbeginn und danach nie wieder: ein Satz, den man im Januar liest und im
# Juli gebraucht haette.
#
# DREI SCHWELLEN, WEIL SIE VERSCHIEDENES BEDEUTEN. Bei 25 % ist noch alles
# offen (nachladen), bei 15 % wird es knapp, bei 10 % geht es zu Ende. Ab 15 %
# traegt die Meldung einen Knopf "Dienst beenden" -- denselben, den die
# Dauermeldung schon hat, es entsteht kein zweiter Weg. Bei 25 % fehlt er mit
# Absicht: Ein Knopf, der das Aufgeben anbietet, bevor es naheliegt, wird beim
# dritten Mal gedrueckt, ohne gelesen zu werden.
#
# JE STUFE EINMAL, nicht je Messung. Sonst stuende bei 24 % zwoelf Stunden
# dieselbe Meldung, und die letzte bei 10 % ginge darin unter. Am Kabel
# verschwindet die Warnung und die Stufe setzt sich zurueck -- ein zweites
# Absacken ist ein zweites Ereignis, und es ist das gefaehrlichere.
#
# DIE APP SCHALTET NICHTS AB, und das ist die eigentliche Entscheidung. Eine
# automatische Abschaltung bei X % waere die bequeme Loesung und die falsche:
# Sie beendete die Aufzeichnung STILL, mitten im Dienst, genau in dem
# Augenblick, in dem niemand auf das Handy sieht. Was in der Dokumentation
# fehlt, fehlt hinterher unwiederbringlich -- ein Dienst laesst sich nicht
# nachfahren. Paket E (0.8.0) ist gegen genau diese Art Stille gebaut worden.
#
# WAS BEWUSST NICHT KOMMT: ein Sparmodus, der den GPS-Takt streckt. Er stand
# zur Wahl und ist verworfen worden, und der Grund gehoert festgehalten, weil
# er sonst wiederkehrt: Der Track IST bereits ausgeduennt (`Ausduenner`, 15 m
# oder 10 s) -- das spart Speicher und Uebertragung, aber KEINEN Akku, denn
# das GPS laeuft trotzdem durch. Was Akku spart, waere `MINDESTABSTAND_MS`;
# wie viel, ist UNGEMESSEN, und die Ausduennung braucht Zwischenpunkte: Bei
# 30-s-Takt und 80 km/h greift die 15-m-Regel nie, und Strecke und Anstieg
# (Haversine zwischen den aufgezeichneten Punkten) fielen systematisch zu
# kurz aus. Dazu ist die Ausduennung wortgleich die der Garmin-Uhr, und an
# der Zahl haengen zwei Messungen (R19, Messstand S2).
#
# 0.11.1 IST EINE KORREKTURNUMMER, obwohl ein Dialog dazukommt. Der Hinweis auf
# den Stromverbrauch ist keine Funktion, sondern eine fehlende Auskunft: Die
# App zeichnet ueber den ganzen Dienst mit GPS auf und sagte es nirgends --
# schlimmer noch, der einzige Text zum Thema (die Akku-Freistellung) erklaerte,
# warum sie Strom ziehen DARF, nicht dass sie es in erheblichem Mass TUT. Wer
# nur den las, hielt den leeren Akku am Dienstende fuer einen Fehler.
#
# ZWEI ORTE, WEIL EINER NICHT REICHT (Backlog Nr. 82): ein zweiter Absatz im
# Akku-Dialog -- und, fuer alle, die den nie sehen, weil ihre Freistellung
# schon stand, ein einmaliger Hinweis nach dem ERSTEN Dienstbeginn. Beide
# einmal je Installation; eine Warnung, die man bei jedem Dienstbeginn
# wegklickt, wird nicht gelesen.
#
# KEINE ZAHL IM TEXT. "Etwa X Prozent" waere hilfreicher, ist aber ohne Messung
# am Geraet nicht zu verantworten -- und der Geraetetest steht aus. Ein
# geratener Wert waere schlimmer als keiner: Er wuerde geglaubt.
#
# DER VERSIONSCODE DER UHR SPRINGT EINMALIG (Nr. 98, R65): Play verlangt unter
# einer Anwendungs-ID je APK einen eindeutigen Code, und beide Module trugen
# denselben -- ohne Versatz gibt es kein Wear-OS-Release. Die Uhr rechnet
# jetzt +1 000 000; Versionsname und Zaehlung bleiben eins (E-S4-02). Der
# Versatz trifft nur das Modul, das ihn braucht -- eine fuehrende
# Formfaktor-Ziffer haette auch das Handy verschoben, wo kein Sprung noetig ist.
#
# 0.11.0 IST DIE NEBENNUMMER, UND DAS IST EINE ENTSCHEIDUNG GEGEN DIE 1.0.0.
# Der Weg durch die App aendert sich spuerbar -- der Kopplungsbildschirm ist
# vom Eingabeformular zur Anzeige geworden, ein Adressfeld und ein QR-Scanner
# sind ersatzlos entfallen. Nach der Zaehlweise oben spraeche das fuer die
# HAUPTnummer.
#
# Sie steigt trotzdem nicht, und der Grund steht seit B1 in dieser Datei: Die
# erste 1.0.0 gehoert an das ENDE des Geraetetests (E-R45-7), nicht an den
# Stand davor. Der Geraetetest steht aus -- es gab bis heute kein Telefon und
# keine Uhr. Eine 1.0.0 auf einem Stand, der nie auf Hardware lief, waere
# dieselbe falsche Zusage wie eine 1.0.0 auf einem Stand, der noch nichts tat.
#
# WAS 0.11.0 BRINGT. Die App konnte sich seit Web 13.0.0 (S5, R49) NICHT MEHR
# koppeln: Sie sendete einen Code, den der Server nicht mehr entgegennimmt,
# und zeigte dazu "Code unvollstaendig" -- eine Meldung, die in die Irre
# fuehrt. Jetzt bittet sie um eine Sitzung, ZEIGT den Code, fragt im
# Fuenf-Sekunden-Takt nach und bestaetigt das Konto, das der Server nennt.
# Damit steht das zweite Tor auch am Handy: Auf dem Bildschirm steht die
# maskierte Adresse des Kontos, und eine fremde Domain faellt auf.
#
# DREI BACKLOG-PUNKTE GEHEN MIT (R63): Die Serveradresse ist fest und liegt im
# Bauskript statt in einem Eingabefeld (Nr. 84) -- ein Selbsthoster aendert
# eine Zeile Gradle. Die App heisst am Handy "Gen-EM NAdoku", die Uhr bleibt
# "NAdoku" (Nr. 85). Und die Systemleisten ueberlappen die Oberflaeche nicht
# mehr (Nr. 86): `enableEdgeToEdge()` plus Inset-Polster an Kopfleiste und
# Wurzelflaeche. Die beiden Theme-Zeilen, die das leisten sollten, waren seit
# API 35 wirkungslos -- sie sind ausgetragen.
#
# DAS APK IST UM 1,81 MB KLEINER (9 658 567 auf 7 844 710 B). Mit dem
# Adress-QR entfallen ZXing, vier CameraX-Bausteine und die
# CAMERA-Berechtigung -- die einzige, die die App je zur Laufzeit erfragt hat.
# Die Liste der Fremdbestandteile geht damit von vier auf zwei.
#
# 0.10.1 IST EINE KORREKTURNUMMER, obwohl ein Bedienelement dazukommt. Der
# Knopf "Alle Phasen zeigen" ist keine Funktion, sondern der Preis fuer eine
# Behebung: Acht Phasenreihen zu 48 dp schoben "Einsatz abschliessen" auf
# 771-819 dp und damit unter die Faltkante eines 800-dp-Telefons (B-S5Z-16).
# Sichtbar sind jetzt die gesetzten Phasen und die naechste; gemessen liegt
# der Abschluss dadurch bei 515 dp (Einsatzbeginn) bis 759 dp (alle acht
# gesetzt) statt bei 819.
#
# 0.10.0 IST DIE NEBENNUMMER fuer eine kleine, aber eigenstaendige Funktion:
# Das Handy schickt den Ortungszustand jetzt bei JEDEM Wechsel ans Handgelenk,
# nicht mehr nur als Antwort auf einen Knopfdruck. Wer keinen Knopf drueckte,
# sah bis dahin "Dienst laeuft", waehrend das Handy laengst nichts mehr
# aufzeichnete.
#
# ZEHN IST EINE ZAHL UND KEIN SPRUNG: 0.10.0 folgt auf 0.9.0, nicht auf
# 0.1.0. Der Versionscode rechnet Haupt*10000 + Neben*100 + Korrektur und
# steigt damit von 900 auf 1000 -- Android vergleicht die Zahl, nicht die
# Zeichenkette.
#
# 0.9.0 IST DIE NEBENNUMMER, weil drei Funktionen dazukommen: der
# Nachsende-Job (JobScheduler), der Auslöser "Wiederverbindung" und der Knopf
# "Jetzt senden" samt Ergebniszeile. Der Kern ist aber eine Behebung, und zwar
# des einzigen BELEGTEN Fehlers dieses Pakets (Diagnose 1.3, H2): Das
# Dienstende startete seinen Sendelauf und stoppte den Vordergrunddienst
# sofort danach. Der Lauf lief dann in einem Prozess ohne Dienst weiter, den
# Android jederzeit abraeumen darf -- und weil es keinen zweiten Versuch gab,
# blieb der Diensttag im Web ohne Ende stehen, bis der naechste Dienst lief.
#
# 0.8.1 IST EINE KORREKTURNUMMER, obwohl das meiste daran ein Pruefmittel ist.
# Die App bekommt keine Funktion dazu; sie bekommt eine Warnung dorthin, wo sie
# zu sehen ist. Auf der 192-dp-Uhr lag die unterste Zeile im Phasenmodus unter
# dem Rand -- betroffen war neben der neuen Ortungswarnung auch die bestehende
# "wartet aufs Handy" (B-S5Z-17). Beide stehen jetzt in der Zustandszeile oben,
# ohne dass die Ansicht dabei waechst.
#
# 0.8.0 IST EINE NEUE FUNKTION UND DESHALB DIE NEBENNUMMER. Bis 0.7.7 stand
# "Aufzeichnung laeuft ... GPS an", sobald die FREIGABE erteilt war -- auch bei
# ausgeschaltetem Standort, ohne Empfang und bei zu grosser Streuung, also in
# drei Lagen, in denen im Puffer nichts landet (B-S5Z-07). Der Ortungswaechter
# misst jetzt, was ankommt; Zustandszeile, Dauermeldung und eine eigene
# Warnung mit Vibration folgen ihm, ein Dienstbeginn ohne eingeschalteten
# Standort ist gesperrt, und die Uhr erfaehrt den Zustand mit der Quittung.
#
# KEINE HAUPTNUMMER, obwohl sich der Weg durch die App aendert: Datenmodell,
# Puffer und Sendeweg sind unberuehrt, und was der Server sieht, ist Zeile fuer
# Zeile dasselbe. Was sich aendert, ist, was die App ueber sich SAGT.
#
# 0.7.7 IST EINE ZAHL, UND TROTZDEM EINE ENTSCHEIDUNG. `BEDIENHOEHE` im
# Handy-Modul steht auf 48 dp statt 44 -- der Plattformvorgabe von Android und
# nicht der Web-Zahl aus CLAUDE.md 5. Die Uhr fuehrte die 48 schon; die beiden
# Module waren an dieser Stelle uneins, und genau das war der Fund (B-S4-02).
# Jede Trefferflaeche der Handy-App waechst damit um vier Punkte.
#
# 0.7.6 AENDERT AN DER APP KEINE ZEILE. Sie bekommt einen zweiten Quellsatz
# (`src/androidTest/`), der auf einem Android-System laeuft statt in der JVM,
# und die dazu noetige Testabhaengigkeit. Nichts davon liegt im APK der
# Anwendung -- der Laeufer wird in ein eigenes Test-APK gepackt. Hochgestuft
# wird trotzdem (CLAUDE.md 2): Der Baum hat sich geaendert, und eine Fassung,
# unter der zwei verschiedene Staende laufen koennen, ist keine.
#
# VERSIONSCODE. Android vergleicht Fassungen ueber eine ganze Zahl, nicht ueber
# die Zeichenkette -- steht dort eine kleinere als auf dem Geraet, verweigert
# das System die Installation. Sie wird deshalb aus der Nummer GERECHNET
# (Haupt*10000 + Neben*100 + Korrektur) und nicht von Hand gefuehrt: Zwei
# Angaben, die von Hand synchron gehalten werden muessen, laufen frueher oder
# spaeter auseinander, und das faellt erst auf dem Geraet auf.
# ---------------------------------------------------------------------------
version=0.13.0
