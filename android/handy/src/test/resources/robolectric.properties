# Robolectric bildet EINEN Android-Stand nach, nicht alle. 34 ist bewusst
# gewaehlt: Es ist der Stand, ab dem die strengen Regeln fuer
# Vordergrunddienste gelten (der Grund fuer targetSdk in E-S4-03), und diese
# Robolectric-Fassung unterstuetzt ihn sicher. Die App laeuft auf 26 bis 36;
# ein Pruefstand kann davon immer nur einen nachstellen -- das gehoert in den
# Pruefstand geschrieben, nicht verschwiegen.
sdk=34
