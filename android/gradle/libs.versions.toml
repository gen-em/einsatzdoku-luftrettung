# ---------------------------------------------------------------------------
# Fremdbestandteile -- eine Liste, eine Nummer je Bestandteil.
#
# GRUNDSATZ: so wenige wie moeglich. HTTP laeuft ueber HttpURLConnection, JSON
# ueber org.json, der Puffer ueber SQLiteOpenHelper -- alles drei Bordmittel
# von Android und deshalb hier NICHT aufgefuehrt. Was hier steht, sind die zwei
# zugelassenen Fremdbestandteile und ihr Pruefwerkzeug:
#
#   AndroidX / Compose        Apache-2.0   Oberflaeche, Lebenszyklus
#   play-services-wearable    proprietaer  ausschliesslich der Data Layer
#
# KEIN QR-SCAN, also weder ZXing (QR-Erkennung) noch CameraX: Die App kennt
# genau eine Serveradresse, es gibt nichts zu scannen, und die App fragt
# nicht nach der Kamera.
#
# Beide werden NUR ZUR BAUZEIT bezogen; die App laedt zur Laufzeit nichts
# nach. Herkunft, Lizenz und -- fuer die proprietaere Wearable-Bibliothek --
# die Vertraeglichkeit mit der AGPL stehen in docs/Lizenzen.md 6a; die Liste
# selbst ist diese Datei.
#
# WARUM DIESE NUMMERN. compileSdk ist 37 (siehe handy/build.gradle.kts).
# Eine AndroidX-Bibliothek nennt ein MINDEST-compileSdk; die Nummern hier
# sind durchweg Fassungen, die mit 37 auskommen. Wer eine hochzieht, prueft das
# mit -- AGP meldet es als Fehler, nicht als Warnung, und der Baulauf bricht.
# ---------------------------------------------------------------------------

[versions]
agp = "9.4.1"
# KOTLIN IST SEIT AGP 9 EINGEBAUT. AGP bringt ein
# Kotlin-Gradle-Plugin als Laufzeitabhaengigkeit mit (bei 9.4.1: 2.2.10);
# die Zahl hier hebt es an. Sie gilt fuer ZWEI Plugins, die zusammen wandern
# muessen: das Kotlin-Plugin selbst (nur in der Wurzel, `apply false`,
# um die Fassung festzulegen) und den Compose-Compiler, der an genau diese
# Kotlin-Fassung gebunden ist.
kotlin = "2.4.20"

# --- AndroidX (Apache-2.0) ---
# Stand vom 24.09.2026. core-ktx, Compose-BOM und
# wear-compose verlangen compileSdk 37 und AGP >= 9.1 (aar-metadata).
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
wearCompose = "1.7.0"
wearInput = "1.2.0"

# --- Google Play-Dienste (proprietaer, nur Data Layer) ---
playServicesWearable = "20.0.1"

# --- Nur zum Pruefen; nichts davon liegt im APK ---
junit = "4.13.2"
robolectric = "4.16.1"
# DAS ANDROID-ABBILD, MIT DEM ROBOLECTRIC LAEUFT -- als Abhaengigkeit und
# nicht als Laufzeit-Download.
#
# Robolectric holt sich dieses Archiv (145 MB) sonst WAEHREND DES TESTLAUFS
# selbst von Maven, ueber seinen eigenen `MavenArtifactFetcher` -- an Gradle
# vorbei, ohne Wiederholung und ohne den Abhaengigkeits-Zwischenspeicher.
# Bricht dieser Download auf einem Laeufer ab (`SocketException: Connection
# reset by peer`), ist der ganze Prueflauf rot: "HandyBildTest > classMethod
# FAILED, AssertionError at MavenArtifactFetcher.java:129". `classMethod` ist
# der Klassenaufbau, kein Prueffall -- es ist also nie ein Testfehler.
#
# DIE ZAHL 14 IST ANDROID 14 = API 34 und gehoert zu `sdk=34` aus
# `src/test/resources/robolectric.properties`. Wer dort die Stufe aendert
# ODER Robolectric hochstuft, zieht diese Kennung mit: Die richtige steht im
# Protokoll eines Laufs OHNE `robolectric.offline` ("Failed to fetch maven
# artifact org.robolectric:android-all-instrumented:<hier>"), und sie ist im
# Maven-Zentralverzeichnis nachschlagbar. Passt sie nicht zur eingestellten
# Stufe, faellt das beim ersten Lauf auf und nicht still.
robolectricAbbild = "14-robolectric-10818077-i7"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"
# Der Testlaeufer fuer INSTRUMENTIERTE Faelle. Er laeuft auf dem
# Android-System statt in der JVM und traegt die neun Faelle, die Robolectric
# nicht erreicht: der echte AndroidKeyStore (sechs) und die Erreichbarkeit der
# Wearable-API (drei). `androidx.test.ext:junit` bringt ihn NICHT mit -- es
# haengt an core und monitor, der Laeufer ist ein eigener Baustein.
androidxTestRunner = "1.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

androidx-wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
androidx-wear-input = { group = "androidx.wear", name = "wear-input", version.ref = "wearInput" }



play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
robolectric-abbild = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "robolectricAbbild" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
