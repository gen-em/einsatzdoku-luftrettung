# ---------------------------------------------------------------------------
# Fremdbestandteile -- eine Liste, eine Nummer je Bestandteil (E-S4-04).
#
# GRUNDSATZ: so wenige wie moeglich. HTTP laeuft ueber HttpURLConnection, JSON
# ueber org.json, der Puffer ueber SQLiteOpenHelper -- alles drei Bordmittel
# von Android und deshalb hier NICHT aufgefuehrt. Was hier steht, sind die drei
# zugelassenen Fremdbestandteile und ihr Pruefwerkzeug:
#
#   AndroidX / Compose        Apache-2.0   Oberflaeche, Kamera, Lebenszyklus
#   ZXing (core)              Apache-2.0   QR-Erkennung aus dem Kamerabild
#   play-services-wearable    proprietaer  ausschliesslich der Data Layer
#
# Alle drei werden NUR ZUR BAUZEIT bezogen; die App laedt zur Laufzeit nichts
# nach. Herkunft, Lizenz und -- fuer die proprietaere Wearable-Bibliothek --
# die Vertraeglichkeit mit der AGPL werden in docs/Lizenzen.md nachgetragen
# (Block D, E-S4-04). Bis dahin ist diese Datei die vollstaendige Liste.
#
# WARUM DIESE NUMMERN. compileSdk ist 36 (siehe handy/build.gradle.kts).
# Eine AndroidX-Bibliothek nennt ein MINDEST-compileSdk; die Nummern hier sind
# durchweg Fassungen, die mit 36 auskommen. Wer eine hochzieht, prueft das
# mit -- AGP meldet es als Fehler, nicht als Warnung, und der Baulauf bricht.
# ---------------------------------------------------------------------------

[versions]
agp = "8.13.2"
kotlin = "2.1.21"

# --- AndroidX (Apache-2.0) ---
coreKtx = "1.16.0"
lifecycle = "2.9.1"
activityCompose = "1.10.1"
composeBom = "2025.06.01"
wearCompose = "1.4.1"
wearInput = "1.2.0"
camerax = "1.4.2"

# --- ZXing (Apache-2.0) ---
zxing = "3.5.4"

# --- Google Play-Dienste (proprietaer, nur Data Layer) ---
playServicesWearable = "20.0.1"

# --- Nur zum Pruefen; nichts davon liegt im APK ---
junit = "4.13.2"
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

androidx-wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
androidx-wear-input = { group = "androidx.wear", name = "wear-input", version.ref = "wearInput" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
