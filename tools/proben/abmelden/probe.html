<!doctype html>
<meta charset="utf-8">
<title>Abmeldeprobe — was bleibt nach dem Abmelden liegen? (Backlog Nr. 22, Nr. 370)</title>
<h1>Abmeldeprobe</h1>
<pre id="ausgabe">läuft …</pre>
<script>
'use strict';
/* DIE FÄCHER DER FASSUNGEN BIS 23.3.x, VOR crypto.js GEFÜLLT. Ein Tab, der
   über die Auslieferung von 23.4.0 hinweg offen war, trägt dort noch Daten-
   und Inhaltsschlüssel als Hex. crypto.js räumt sie beim Laden (R17-25);
   gemessen wird, ob sie danach fort sind — ohne dass jemand abmeldet. */
const ALT = { edk: 'aa'.repeat(32), pck: 'bb'.repeat(32),
              pckb: '0123456789abcdef', pckt: '1750000000000' };
sessionStorage.clear();
Object.keys(ALT).forEach(k => sessionStorage.setItem(k, ALT[k]));
window.__altGefuellt = Object.keys(ALT).filter(k => sessionStorage.getItem(k) !== null);
</script>
<script src="/server/assets/crypto.js"></script>
<script src="/server/assets/keyguard.js"></script>
<script>
'use strict';

/* Alles, was das Projekt seit R17-25 an Schlüsselmaterial im Browser führt.
   Erhoben aus assets/crypto.js, assets/keyguard.js und einstellungen.php. */
const FAECHER = {
  /* SEIT S10/AP2 LIEGEN HIER HAELFTEN, KEINE DATENSCHLUESSEL — der
     Datenschluessel entsteht erst aus Haelfte UND Server-Anteil. */
  'edkvor':  { wert: JSON.stringify({ hf: { 600000: 'cc'.repeat(32) }, tk: { t: 'x' } }),
               was: 'Vormerkfach der Anmeldung — die PBKDF2-Hälften und Anmelde-Token' },
  'edk_neu': { wert: 'dd'.repeat(32),
               was: 'Vormerkfach des Passwortwechsels — der NEUE Datenschlüssel' },
};

function uebrigImTab() {
  return Object.keys(FAECHER).concat(Object.keys(ALT))
    .filter(k => sessionStorage.getItem(k) !== null);
}

(async () => {
  const ergebnis = { faecher: FAECHER };
  // 1. Die alten Fächer hat crypto.js beim Laden geräumt?
  ergebnis.altGefuellt = window.__altGefuellt;
  ergebnis.altNachLaden = Object.keys(ALT).filter(k => sessionStorage.getItem(k) !== null);

  // 2. Alles belegen, was heute belegt sein kann — dazu die Ablage.
  Object.keys(FAECHER).forEach(k => sessionStorage.setItem(k, FAECHER[k].wert));
  const griff = await EdKeyGuard.ablegen('ee'.repeat(32), 'huelle-probe');
  ergebnis.ablageVorher = !!(await EdCrypto.inhaltLesen());
  ergebnis.griffExtrahierbar = griff.extractable;

  // 3. Der Abmeldeweg (session_lib.php ruft genau das; login.php löscht die Ablage beim Laden noch einmal).
  await EdCrypto.clearSession();
  ergebnis.imTabNachher = uebrigImTab();
  ergebnis.ablageNachher = !!(await EdCrypto.inhaltLesen());

  window.__ergebnis = ergebnis;
  document.getElementById('ausgabe').textContent = JSON.stringify(ergebnis, null, 2);
  window.__fertig = true;
})().catch(e => { window.__ergebnis = { fehler: String(e && e.message || e) }; window.__fertig = true; });
</script>
