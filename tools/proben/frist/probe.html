<!doctype html>
<meta charset="utf-8">
<title>Fristprobe — Frist und Bindung des Inhaltsschlüssels in der Ablage (R44, R17-25)</title>
<h1>Fristprobe</h1>
<pre id="ausgabe">läuft …</pre>
<script>
'use strict';
/* DIE UHR GEHÖRT DER PROBE, UND ZWAR VOR DEN SKRIPTEN. `keyguard.js` räumt
 * beim Laden einen abgelaufenen Eintrag und liest dafür `Date.now()`. Die
 * Probe rückt die Uhr in Schritten vor, statt acht Stunden zu warten —
 * gemessen wird dieselbe Logik, nur schneller. */
let jetzt = 1_750_000_000_000;
const echteJetzt = Date.now;
Date.now = () => jetzt;
</script>
<script src="/server/assets/crypto.js"></script>
<script src="/server/assets/keyguard.js"></script>
<script>
'use strict';

/* WAS HIER GEMESSEN WIRD — gegen die echten Dateien und die echte IndexedDB.
 *
 * Bis R17-25 lag der Inhaltsschlüssel als Hex im sessionStorage des Tabs,
 * neben ihm der Datenschlüssel, und diese Probe arbeitete mit einem
 * nachgebauten EdCrypto: Gezählt wurden STILLE NEU-ENTPACKUNGEN aus `edk`
 * (R44: 17 statt 1 je Schicht). Den Datenschlüssel gibt es nach dem
 * Entsperren nicht mehr; eine abgelaufene Frist heißt jetzt „Passwort",
 * nicht „still neu entpacken". Gemessen wird deshalb:
 *
 *   (1) Durchgehende Arbeit über eine Schicht verliert den Schlüssel NIE —
 *       die Frist gleitet mit jedem Gebrauch (R44).
 *   (2) Leerlauf über die Frist hinaus liefert null und LÖSCHT den Eintrag.
 *   (3) Eine fremde Hülle liefert null und lässt den Eintrag STEHEN (ein
 *       Tab von vor einem Passwortwechsel sperrt nicht alle anderen).
 *   (4) Eine Seite, die nach Ablauf der Frist lädt, räumt den Eintrag,
 *       auch ohne nach dem Schlüssel zu fragen.
 *   (5) Was aus der Ablage kommt, ist ein nicht extrahierbarer CryptoKey,
 *       und er öffnet, was mit dem Hex desselben Schlüssels verschlossen ist.
 */
const SCHICHT_MIN   = 480;   // acht Stunden Dienst
const BEDIENUNG_MIN = 5;     // alle fünf Minuten eine Seite
const FRIST_MIN     = 30;    // MAX_ALTER_MS in keyguard.js
const CK = 'cc'.repeat(32);
const HUELLE = 'huelle-eins';
const MIN = 60 * 1000;

function laden(src) {   // eine zweite Seite derselben Herkunft, mit der Uhr der Probe
  return new Promise((gut, schlecht) => {
    const f = document.createElement('iframe');
    f.src = src + '?jetzt=' + jetzt;
    f.onload = () => gut(f);
    f.onerror = schlecht;
    document.body.appendChild(f);
  });
}
async function warteBis(bedingung, ms) {
  const ende = echteJetzt() + ms;
  while (echteJetzt() < ende) { if (await bedingung()) { return true; } await new Promise(r => setTimeout(r, 50)); }
  return false;
}

(async () => {
  const e = { schichtMin: SCHICHT_MIN, bedienungMin: BEDIENUNG_MIN, fristMin: FRIST_MIN };
  await EdCrypto.clearSession();

  // (1) Schicht
  jetzt = 1_750_000_000_000;
  await EdKeyGuard.ablegen(CK, HUELLE);
  let aufrufe = 0, verloren = 0;
  for (let m = 0; m <= SCHICHT_MIN; m += BEDIENUNG_MIN) {
    const k = await EdKeyGuard.contentKey(HUELLE);
    aufrufe++;
    if (!k) { verloren++; await EdKeyGuard.ablegen(CK, HUELLE); }
    jetzt += BEDIENUNG_MIN * MIN;
  }
  e.schicht = { aufrufe, verloren };

  // (2) Leerlauf
  await EdKeyGuard.ablegen(CK, HUELLE);
  jetzt += (FRIST_MIN + 1) * MIN;
  e.leerlauf = { schluessel: !!(await EdKeyGuard.contentKey(HUELLE)),
                 eintragDanach: !!(await EdCrypto.inhaltLesen()) };

  // (3) Fremde Hülle
  await EdKeyGuard.ablegen(CK, HUELLE);
  e.fremd = { schluessel: !!(await EdKeyGuard.contentKey('huelle-zwei')),
              eintragDanach: !!(await EdCrypto.inhaltLesen()),
              eigeneDanach: !!(await EdKeyGuard.contentKey(HUELLE)) };

  // (4) Laden räumt
  await EdKeyGuard.ablegen(CK, HUELLE);
  jetzt += (FRIST_MIN + 1) * MIN;
  await laden('laden.html');
  e.laden = { geraeumt: await warteBis(async () => !(await EdCrypto.inhaltLesen()), 5000) };

  // (5) Der Griff
  jetzt = echteJetzt();
  const griff = await EdKeyGuard.ablegen(CK, HUELLE);
  const verschlossen = await EdCrypto.encrypt(CK, 'Probe');           // mit dem Hex
  let geoeffnet = null;
  try { geoeffnet = await EdCrypto.decrypt(griff, verschlossen); } catch (x) { geoeffnet = 'FEHLER ' + x.name; }
  let ausgeleitet;
  try { await crypto.subtle.exportKey('raw', griff); ausgeleitet = 'EXPORTIERT'; }
  catch (x) { ausgeleitet = 'verweigert'; }
  e.griff = { typ: Object.prototype.toString.call(griff), extrahierbar: griff.extractable,
              geoeffnet, ausgeleitet };

  await EdCrypto.clearSession();
  Date.now = echteJetzt;
  window.__ergebnis = e;
  window.__fertig = true;
  document.getElementById('ausgabe').textContent = JSON.stringify(e, null, 2);
})().catch(x => { window.__ergebnis = { fehler: String(x && x.message || x) }; window.__fertig = true; });
</script>
